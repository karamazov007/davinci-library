oluble vitamins. Fat is a floor, never zero."}]}, {"id": "fatloss", "name": "Fat loss", "blurb": "How stored fat is actually spent - and what a real cut looks like.", "blocks": [{"t": "p", "x": "Fat loss is your body <b>spending its own stored energy</b> to cover a shortfall. Fat cells don’t vanish — they <b>empty and shrink</b>."}, {"t": "h", "x": "The mechanism, step by step"}, {"t": "fig", "gen": "genCycle", "cap": "Deficit -> insulin falls -> lipolysis releases fatty acids -> burned (beta-oxidation) -> fat cell shrinks -> repeat.", "args": [[{"label": "Calorie\ndeficit", "note": "eat < TDEE"}, {"label": "Insulin\nfalls", "note": "storage off"}, {"label": "Lipolysis", "note": "fat released"}, {"label": "Fatty\nacids", "note": "into blood"}, {"label": "Beta-\noxidation", "note": "burned -> ATP"}, {"label": "Fat cell\nshrinks", "note": "repeat"}], {"w": 620, "h": 560, "center": "Fat loss"}]}, {"t": "h", "x": "Where does the fat actually go?"}, {"t": "fig", "gen": "genGraph", "cap": "Most fat leaves as CO2 you exhale, the rest as water. You literally breathe your fat out.", "args": [[{"id": "fat", "x": 0.1, "y": 0.5, "label": "Stored fat\ntriglyceride", "fill": "#ea580c", "w": 110, "h": 52}, {"id": "burn", "x": 0.42, "y": 0.5, "label": "Burned with\noxygen", "fill": "#4f46e5", "w": 120, "h": 52}, {"id": "co2", "x": 0.8, "y": 0.26, "label": "CO2\nexhaled", "fill": "#0891b2", "w": 100, "h": 50}, {"id": "h2o", "x": 0.8, "y": 0.74, "label": "Water\nurine/sweat", "fill": "#64748b", "w": 110, "h": 50}], [{"from": "fat", "to": "burn"}, {"from": "burn", "to": "co2", "label": "~84%", "color": "#0891b2", "lc": "#0891b2"}, {"from": "burn", "to": "h2o", "label": "~16%"}], {"w": 700, "h": 380}]}, {"t": "h", "x": "What a real cut looks like over time"}, {"t": "fig", "gen": "genTimeline", "cap": "Week 1's big drop is mostly water/glycogen; then a steady grind, an inevitable plateau, and a small adjustment.", "args": [[{"when": "Wk 1", "label": "Big drop\nwater/glycogen"}, {"when": "Wk 2-5", "label": "Steady\nfat loss"}, {"when": "Wk 6", "label": "Plateau\nadaptation"}, {"when": "Wk 7", "label": "+steps /\n-150 kcal"}, {"when": "Wk 8+", "label": "Loss\nresumes"}], {"w": 780, "h": 420}]}, {"t": "cards", "items": [{"h": "Protect muscle", "x": "High protein + keep lifting. In a deficit the body strips muscle too — unless you give it a reason (training) and the bricks (protein)."}, {"h": "The plateau", "x": "Burn drops as you shrink (less mass, less NEAT). Fix: add steps or trim ~150 kcal — don’t slash harder."}]}, {"t": "call", "x": "<b>Cue.</b> Modest deficit, high protein, keep lifting, walk more. Slow fat loss keeps muscle; crash diets burn both."}]}, {"id": "muscle", "name": "Muscle building", "blurb": "Challenge, feed, rest - and why it is slow.", "blocks": [{"t": "p", "x": "Muscle grows when you repeatedly <b>challenge it</b> (mechanical tension), then <b>feed and rest</b> it. Growth is the body over-building to be ready for next time. It is <b>slow</b> — and that’s normal."}, {"t": "h", "x": "The core balance: build vs break"}, {"t": "fig", "gen": "genGraph", "cap": "Muscle = synthesis (MPS) - breakdown (MPB). Training raises MPS; protein supplies material; net positive = growth.", "args": [[{"id": "eat", "x": 0.1, "y": 0.3, "label": "Protein", "fill": "#db2777", "w": 100, "h": 46}, {"id": "train", "x": 0.1, "y": 0.72, "label": "Training", "fill": "#9333ea", "w": 100, "h": 46}, {"id": "mps", "x": 0.46, "y": 0.3, "label": "MPS up\nbuild", "fill": "#16a34a", "w": 104, "h": 50}, {"id": "mpb", "x": 0.46, "y": 0.72, "label": "MPB\nbreak", "fill": "#ea580c", "w": 104, "h": 50}, {"id": "net", "x": 0.82, "y": 0.5, "label": "Net growth\nif MPS>MPB", "fill": "#db2777", "w": 120, "h": 56}], [{"from": "eat", "to": "mps"}, {"from": "train", "to": "mps", "color": "#9333ea"}, {"from": "mps", "to": "net", "label": "+", "color": "#16a34a", "lc": "#16a34a"}, {"from": "mpb", "to": "net", "label": "-", "color": "#ea580c", "lc": "#ea580c"}], {"w": 720, "h": 400}]}, {"t": "h", "x": "The engine: progressive overload"}, {"t": "fig", "gen": "genCycle", "cap": "Stress the muscle -> recover (this is when you grow) -> adapt -> add a little next time.", "args": [[{"label": "Train\ntension", "note": "stimulus"}, {"label": "Fatigue", "note": "micro-damage"}, {"label": "Recover", "note": "sleep + food"}, {"label": "Adapt", "note": "grow back bigger"}, {"label": "Add load", "note": "progress"}], {"w": 620, "h": 560, "center": "Overload"}]}, {"t": "cards", "items": [{"h": "0.25–0.5 kg / month", "x": "Realistic natural muscle gain, good case."}, {"h": "1.6–2.2 g/kg", "x": "Daily protein target."}, {"h": "+10% calories", "x": "A lean-gain surplus — no more."}]}, {"t": "call", "x": "<b>Reality check.</b> A bigger surplus doesn’t build muscle faster — it just adds fat faster. Beyond a small surplus, the extra is storage."}, {"t": "call", "x": "<b>Veg lens · building.</b> Works fine on veg+egg — the only lever needing attention is <b>total protein</b>. Front-load eggs/milk/paneer/soy; a whey scoop closes most gaps."}]}, {"id": "recomp", "name": "Muscle ↔ fat", "blurb": "They don't convert - the honest picture.", "blocks": [{"t": "p", "x": "The biggest myth: “turning fat into muscle.” They’re <b>different tissues</b> — one is stored energy, one is contractile protein. “Recomposition” is <b>two separate processes at once</b>: losing fat while building muscle."}, {"t": "fig", "gen": "genGraph", "cap": "Not a conversion - a redistribution run by two independent dials. The scale can barely move while the body changes.", "args": [[{"id": "now", "x": 0.1, "y": 0.5, "label": "Now\nlow muscle\n+ central fat", "fill": "#64748b", "w": 118, "h": 64}, {"id": "musc", "x": 0.5, "y": 0.22, "label": "Build muscle up", "fill": "#16a34a", "w": 140, "h": 48}, {"id": "fat", "x": 0.5, "y": 0.78, "label": "Shed fat down", "fill": "#ea580c", "w": 140, "h": 48}, {"id": "goal", "x": 0.88, "y": 0.5, "label": "Recomposition", "fill": "#16a34a", "w": 140, "h": 56}], [{"from": "now", "to": "musc", "label": "train + protein", "color": "#16a34a", "lc": "#16a34a"}, {"from": "now", "to": "fat", "label": "deficit", "color": "#ea580c", "lc": "#ea580c"}, {"from": "musc", "to": "goal"}, {"from": "fat", "to": "goal"}], {"w": 720, "h": 420}]}, {"t": "h", "x": "Which goal fits which starting body"}, {"t": "fig", "gen": "genMatrix", "cap": "Your body-fat x muscle position points to the smart move: cut, lean-gain, or recomp.", "args": ["Body fat  ->", "Muscle  ->", {"tl": {"title": "Lean & muscular", "items": ["Lean-gain to grow", "or maintain"]}, "tr": {"title": "Big but soft", "items": ["Cut to reveal it"]}, "bl": {"title": "Skinny", "items": ["Lean-gain / eat more", "build first"]}, "br": {"title": "Skinny-fat", "items": ["Recomp", "or short cut, then gain"]}}, {"w": 700, "h": 560}]}, {"t": "cards", "items": [{"h": "Recomp works best if…", "x": "Beginner · returning · higher body-fat. The body funds new muscle from your own fat stores — big newbie window."}, {"h": "Otherwise…", "x": "Trained & lean? Two dials fighting is slow. Alternate: cut to lean, then lean-gain."}]}, {"t": "call", "x": "<b>Cue.</b> Chase composition, not the scale. Track waist, lifts, and the mirror. ‘70 kg lean & strong’ beats ‘70 kg softer.’"}]}, {"id": "strength", "name": "Strength training", "blurb": "The signal that decides which way you change.", "blocks": [{"t": "p", "x": "Training is the <b>signal</b> that tells your body which way to change. Diet supplies the material; the barbell writes the instructions. Without it, a surplus is just fat and a deficit costs you muscle."}, {"t": "h", "x": "What matters, in order"}, {"t": "fig", "gen": "genPyramid", "cap": "Consistency > progressive overload > enough volume > hard-enough sets > exercise choice > the small stuff.", "args": [[{"label": "Tempo · rest · hacks", "sub": "minor"}, {"label": "Exercise selection"}, {"label": "Intensity (near failure)"}, {"label": "Enough volume"}, {"label": "Progressive overload"}, {"label": "Consistency / adherence", "sub": "foundation"}], {"w": 700, "h": 460}]}, {"t": "h", "x": "Reps map to different adaptations"}, {"t": "fig", "gen": "genSpectrum", "cap": "All rep ranges build muscle if taken near failure - the bias shifts: low->strength, mid->size, high->endurance.", "args": ["HEAVY · few reps", "LIGHT · many reps", [{"pos": 0.12, "label": "1-5 reps\nstrength", "color": "#9333ea"}, {"pos": 0.48, "label": "6-12 reps\nhypertrophy", "color": "#db2777"}, {"pos": 0.85, "label": "15+ reps\nendurance", "color": "#0891b2"}], {"w": 780, "h": 280, "title": "Near failure is what counts"}]}, {"t": "cards", "items": [{"h": "Tension", "x": "Take sets near failure (~1–3 reps in reserve). Junk volume grows little."}, {"h": "Overload", "x": "Add a little over time — more reps, weight, or better form."}, {"h": "Recover", "x": "Sleep is the anabolic window. Growth happens between sessions."}]}, {"t": "call", "x": "<b>Cue.</b> Show up, get a little stronger, sleep, repeat. Progressive overload + protein + recovery is 90% of it."}]}, {"id": "diets", "name": "Diet lenses", "blurb": "Same physics, three plates - veg / Mediterranean / non-veg.", "blocks": [{"t": "p", "x": "The physics never changes — calories, protein, training. What changes between diets is <b>how easily each plate hits the targets</b> and which nutrients need attention."}, {"t": "h", "x": "Vegetarian · Mediterranean · Non-veg"}, {"t": "fig", "gen": "genRadar", "cap": "Further out = easier/better on that axis. No diet wins everything.", "args": [["Protein ease", "Fiber", "Micros (B12/iron)", "Fat quality", "Omega-3", "Cost / ease"], [{"name": "Vegetarian", "color": "#16a34a", "vals": [0.55, 0.95, 0.55, 0.7, 0.4, 0.8]}, {"name": "Mediterranean", "color": "#0891b2", "vals": [0.7, 0.85, 0.9, 0.95, 0.9, 0.6]}, {"name": "Non-veg", "color": "#db2777", "vals": [0.95, 0.5, 0.9, 0.7, 0.8, 0.55]}], {"w": 640, "h": 560}]}, {"t": "cards", "items": [{"h": "Vegetarian (+egg)", "x": "High fiber & antioxidants; protein needs work. Watch: total protein, B12, omega-3, iron, D3. Your setup — solved with paneer/soy/whey + a small stack."}, {"h": "Mediterranean", "x": "Best-studied for long-term health. Fish, olive oil, legumes, veg, whole grains. Excellent fat quality & omega-3."}, {"h": "Non-veg (omnivore)", "x": "Complete protein, B12, iron, omega-3 built-in. Watch: fiber can fall low; fat quality of processed/red meat."}]}, {"t": "call", "x": "<b>Takeaway.</b> Every diet can build muscle and lose fat. Pick the one you’ll actually stick to, then patch its known gaps."}]}, {"id": "plan", "name": "Your plan (68 kg)", "blurb": "Worked numbers for a veg + eggs 68 kg body.", "blocks": [{"t": "p", "x": "Worked from your stats, using an <b>assumed</b> 175 cm / 27 yr / moderately-active profile → maintenance ≈ <b>2,400 kcal</b>. Give me your real height, age & activity and I’ll lock these exactly."}, {"t": "call", "x": "<b>Placeholder assumption.</b> The TDEE below is an estimate. The method is fixed; only the numbers shift with your real stats. Let the scale confirm over 2 weeks, then adjust ~150 kcal."}, {"t": "h", "x": "Three routes from 68 kg"}, {"t": "table", "head": ["Goal", "Calories", "Protein", "Fat", "Carbs", "Use when"], "rows": [["Cut (lose fat)", "~2,000", "150 g", "55 g", "~226 g", "see the abs first, then build"], ["Recomp (hold)", "~2,400", "140 g", "60 g", "~325 g", "lean-ish now; slow both-at-once"], ["Lean gain → 70", "~2,600", "140 g", "65 g", "~365 g", "add size with minimal fat"]]}, {"t": "h", "x": "Hitting ~140g protein on your plate"}, {"t": "fig", "gen": "genTreemap", "cap": "Your staples get you most of the way; the labelled levers close the gap to ~140g without changing how you eat.", "args": [[{"label": "Paneer / soy / whey", "weight": 44, "color": "#9333ea"}, {"label": "6 eggs", "weight": 36, "color": "#db2777"}, {"label": "Dal + roti", "weight": 24, "color": "#16a34a"}, {"label": "600 ml milk", "weight": 20, "color": "#0891b2"}, {"label": "2 PB sandwiches", "weight": 16, "color": "#ea580c"}], {"w": 700, "h": 420}]}, {"t": "cards", "items": [{"h": "Already covered", "x": "6 eggs (~36g), 600ml milk (~20g), dal, 2 PB sandwiches, peanuts — a strong protein & fat floor, big fiber."}, {"h": "Levers to add", "x": "Paneer, soy chunks, or 1 whey scoop add 20–25g each. Mg glycinate + K2 join your stack per the audit."}]}, {"t": "call", "x": "<b>Standing constraint.</b> Bananas are excluded from all recommendations per your medical restriction — carb sources here are rice, roti, oats, potato."}, {"t": "call", "x": "<b>Your cue.</b> Pick one route. Hit protein daily. Lift 3–4×/week, progressing. Let the weekly-average scale steer the calories."}]}]}, {"id": "youplan", "name": "You · body & plan", "icon": "🎯", "intro": "Your exact place and your plan, in pictures — where you sit, and how to get lean & muscular.", "topics": [{"id": "stand", "name": "Where you stand", "blurb": "BMI · waist · body-fat %", "blocks": [{"t": "p", "x": "Here's your exact place, and the plan — all in pictures. Snapshot: <b>23 yr · 175 cm · 68 kg</b>, waist <b>32″ (81 cm)</b>, roughly <b>~15% body fat</b>, lean mass ~58 kg. Verdict: a <b>lean, athletic, early-intermediate</b> — healthy weight, genuinely lean, just under-muscled for your potential (only 5–6 months trained)."}, {"t": "cards", "items": [{"h": "23 yr · 175 cm · 68 kg", "x": "BMI 22.2 — healthy weight, mid-normal."}, {"h": "Waist 32″ (81 cm)", "x": "waist-to-height 0.46 — lean (under 0.5)."}, {"h": "~15% body fat", "x": "lean mass ~58 kg — athletic, early-intermediate."}]}, {"t": "h", "x": "Where you sit on the body-fat spectrum"}, {"t": "fig", "gen": "genYBodyFat", "cap": "You're at ~15% — athletic, just outside the 12–15% 'visible definition' zone. Only ~2–3 kg of fat sits between you and clear definition.", "args": []}, {"t": "call", "x": "<b>Key insight.</b> You're already lean — the thing missing from the 'wow' look is <b>muscle</b>, not fat. So the priority is building, not cutting."}]}, {"id": "map", "name": "Composition & reveal", "blurb": "lean-but-small → lean & muscular", "blocks": [{"t": "h", "x": "The map: where you are → where you're going"}, {"t": "fig", "gen": "genYMap", "cap": "Two levers: horizontal = body fat, vertical = muscle. You're 'lean but small'; the goal is up-and-slightly-left → 'lean & muscular'. You get there by building muscle while staying lean.", "args": []}, {"t": "p", "x": "<b>Definition</b> is set by body fat (go leaner → more visible). <b>Size</b> is set by muscle (train + eat → bigger). They're separate dials — which is why 'do I need to be 70 kg to look defined?' is the wrong question."}, {"t": "h", "x": "Leaner = lighter AND more defined (same you)"}, {"t": "fig", "gen": "genYReveal", "cap": "Hold your muscle and just strip fat: you get a touch lighter and much more defined. Clear abs show around ~12–13% (~65–66 kg) — you'd LOSE weight to reveal them, not gain.", "args": []}]}, {"id": "frame", "name": "Frame & arm potential", "blurb": "wrist · arm runway", "blocks": [{"t": "h", "x": "Your frame & arm potential"}, {"t": "p", "x": "Your <b>wrist (6.5″)</b> is a proxy for your bone frame; forearm 11″, biceps <b>12.7″ flexed</b>. Slim-boned — which means a lean, proportionate ceiling (not a mass frame), and small joints that make muscle look bigger by contrast."}, {"t": "cards", "items": [{"h": "Wrist 6.5″ — slim frame", "x": "Lean natural ceiling ~mid-70s kg. Small joints = aesthetic advantage."}, {"h": "Forearm 11″", "x": "1.7× wrist — solid base, room to grow."}, {"h": "Biceps 12.7″ flexed", "x": "1.95× wrist — early-intermediate, ~average+."}]}, {"t": "fig", "gen": "genFrameScale", "cap": "Your 6.5″ wrist sits at the small/medium line for 5'9″ — a lean, proportionate build. Frame sets absolute size, not how good you can look.", "args": []}, {"t": "call", "x": "<b>Slim frame is an advantage.</b> Narrow wrists + a small waist make a lean, muscular physique read as ‘sculpted’. Your game is proportion + leanness, not raw bulk — build shoulders &amp; back for width, and arms."}, {"t": "h", "x": "Arm runway — where you are vs your potential"}, {"t": "fig", "gen": "genArmRunway", "cap": "A well-built natural arm is ~2.3–2.5× the wrist → for you ~15–16″. You're at 1.95× (12.7″), so there's ~3″ of runway — years of growth from big lifts (rows, chins, presses) + direct work in a small surplus.", "args": []}, {"t": "call", "x": "<b>Arm milestones:</b> 13.5″ = good · 14.5″ = strong for your frame · 15–16″ = excellent, near potential. A lean 72–73 kg with 15″ arms looks genuinely impressive on a slim frame."}]}, {"id": "fork", "name": "Cut or build first?", "blurb": "the decision", "blocks": [{"t": "h", "x": "Cut now, or build first? (the fork)"}, {"t": "fig", "gen": "genGraph", "cap": "You're lean and early in training — so build first. Cutting now reveals abs on a small frame; lean-bulking builds the muscle, then a short cut shows a lean AND muscular you.", "args": [[{"id": "you", "x": 0.1, "y": 0.5, "label": "YOU\nlean ~15%\nearly trainee", "fill": "#2563EB", "w": 140, "h": 66, "shape": "round"}, {"id": "cut", "x": 0.48, "y": 0.2, "label": "Cut now\n→ 65 kg · abs\nbut small", "fill": "#D97706", "w": 150, "h": 60, "shape": "round"}, {"id": "lb", "x": 0.46, "y": 0.8, "label": "LEAN-BULK\nnow", "fill": "#16A34A", "w": 140, "h": 54, "shape": "round"}, {"id": "goal", "x": 0.84, "y": 0.55, "label": "build ~5 kg muscle\n→ short cut →\nLEAN + MUSCULAR ~70 kg", "fill": "#0D9488", "w": 200, "h": 76, "shape": "round"}], [{"from": "you", "to": "cut"}, {"from": "you", "to": "lb", "label": "recommended", "color": "#16A34A", "lc": "#16A34A"}, {"from": "lb", "to": "goal"}], {"w": 720, "h": 420}]}, {"t": "call", "x": "<b>My recommendation: lean-bulk now.</b> You're lean enough (15%) and early enough in training that this is prime muscle-building time. Cutting now just makes you a smaller version of what you already are — build the muscle, reveal it later."}]}, {"id": "whybulk", "name": "Why a surplus builds", "blurb": "same protein, more muscle", "blocks": [{"t": "h", "x": "Why a surplus builds muscle (even with protein constant)"}, {"t": "p", "x": "The confusing bit: if protein is fixed, how does eating more build muscle? Because the <b>“~3 g net” is not a constant — it depends on your energy state.</b> The surplus doesn't <i>become</i> muscle; it makes the environment that lets your fixed protein actually get built."}, {"t": "fig", "gen": "genNetByEnergy", "cap": "Same 130 g of protein → different net muscle depending on energy: a deficit nets ~0 or negative, maintenance ~+1 g (you, stuck), a surplus ~+3 g. Energy state flips the MPS − MPB balance.", "args": []}, {"t": "fig", "gen": "genWhySurplus", "cap": "Same bricks, opposite result. In a deficit MPS is low and breakdown (MPB) high → muscle lost. In a surplus MPS is high and MPB low → muscle built. The protein is identical; the energy decides.", "args": []}, {"t": "cards", "items": [{"h": "1 · Pays the ATP bill", "x": "Assembling muscle is expensive; a deficit can't afford it, a surplus can."}, {"h": "2 · Spares your protein", "x": "A deficit burns your amino acids for fuel; a surplus lets them build instead."}, {"h": "3 · Anabolic hormones", "x": "Surplus keeps insulin / testosterone / IGF-1 up and cortisol down."}, {"h": "4 · Fuels training + recovery", "x": "Full glycogen → harder overload; more energy → better repair."}]}, {"t": "call", "x": "<b>So:</b> the small fat gain of a bulk is the <i>toll</i> you pay for an anabolic environment that turns your constant 130 g from “~0 at maintenance” into “~3 g of muscle.” This is exactly why 2 months at maintenance built nothing — add the surplus and the same protein finally works."}]}, {"id": "fuel", "name": "Follow the fuel", "blurb": "macros → jobs → muscle", "blocks": [{"t": "h", "x": "Follow the fuel — how each mechanism gets funded (toggle)"}, {"t": "p", "x": "In kcal: each macro's energy flows to its jobs (run the body · train + recover · <b>ATP to BUILD</b> · hormone support), and your 130 g protein flows to its fates. Toggle cut → maintenance → lean bulk and watch <b>MUSCLE-building grow 97 → 159 → 270</b> as the surplus funds the labour, spares the protein, and tops up hormones."}, {"t": "mechflow"}, {"t": "call", "x": "<b>How to read it:</b> the thin rose ribbon into MUSCLE = the amino-acid <i>bricks</i> (small); the violet (ATP labour) + green (hormones) = the <i>energy that lets those bricks get laid</i>. A cut starves all three; a lean bulk funds them — same 130 g protein, far more muscle."}]}, {"id": "targets", "name": "Calorie targets", "blurb": "the multiplier thumb-rules", "blocks": [{"t": "h", "x": "Calorie targets — the thumb rules"}, {"t": "p", "x": "<b>Maintenance ≈ bodyweight(kg) × 30–33</b> (desk + gym ~30–31; active ~33). You: 68 × 31 ≈ <b>2,100</b> — your stable weight confirms it. Then just <b>multiply</b> to pick a goal."}, {"t": "fig", "gen": "genTgtDial", "cap": "Multiply maintenance: standard cut ×0.80, lean bulk ×1.10. Left of ×1.00 = deficit, right = surplus. Your lean-bulk target ≈ 2,310 kcal.", "args": []}, {"t": "table", "head": ["Goal", "× maintenance", "Change", "You (2,100)"], "rows": [["Aggressive cut", "×0.75", "−25%", "~1,575"], ["Standard cut", "×0.80", "−20%", "~1,680"], ["Gentle cut", "×0.85", "−15%", "~1,785"], ["Maintenance", "×1.00", "0", "~2,100"], ["Lean bulk", "×1.10", "+10%", "~2,310"], ["Aggressive bulk", "×1.20", "+20%", "~2,520 (skip)"]]}, {"t": "h", "x": "Protein stays fixed; carbs & fat flex"}, {"t": "fig", "gen": "genTgtMacros", "cap": "Protein is the constant rail (~130 g) whether you cut or bulk — only carbs and fat move: trim them to cut, add them to bulk.", "args": []}, {"t": "h", "x": "The scale is the real calculator (rate check)"}, {"t": "fig", "gen": "genTgtRate", "cap": "The multiplier is only a starting guess — the weekly-average scale confirms it. Stay in the green: cut −0.35 to −0.7 kg/wk, bulk +0.2 to +0.35 kg/wk. Off-target → adjust ±150 kcal.", "args": []}, {"t": "call", "x": "<b>Cue.</b> Maintenance = kg × 30–33. Cut = ×0.80, lean bulk = ×1.10. Hold protein fixed, flex carbs/fat, and let the weekly scale fine-tune."}]}, {"id": "plan", "name": "Lean-bulk plan", "blurb": "numbers · macros · 12-mo arc", "blocks": [{"t": "h", "x": "Your lean-bulk plan"}, {"t": "cards", "items": [{"h": "~2,350 kcal / day", "x": "+250 over ~2,100 maintenance — a LEAN bulk, not a dirty one."}, {"h": "Protein ~130 g", "x": "you already hit this (whey + eggs + milk). Don't add more."}, {"h": "Gain 0.25–0.5 kg / month", "x": "mostly muscle at your stage. Weigh weekly; if gaining too fast, trim ~150 kcal."}]}, {"t": "fig", "gen": "genTreemap", "cap": "Your lean-bulk day (~2,350 kcal): protein stays where you already are; carbs fuel the extra training; a modest surplus drives growth.", "args": [[{"label": "Carbs ~311 g", "weight": 1244, "color": "#0E7490"}, {"label": "Protein 130 g", "weight": 520, "color": "#DB2777"}, {"label": "Fat ~65 g", "weight": 585, "color": "#D97706"}], {"w": 700, "h": 400}]}, {"t": "h", "x": "The 12-month arc"}, {"t": "fig", "gen": "genTimeline", "cap": "The arc: a slow lean-bulk adds muscle over a year (staying under ~18% BF), then a short cut reveals a lean, muscular physique — heavier than now but defined.", "args": [[{"when": "Now", "label": "68 kg · 15%"}, {"when": "Mo 3", "label": "~70 kg\nbuilding"}, {"when": "Mo 6", "label": "~71 kg"}, {"when": "Mo 9", "label": "~72 kg"}, {"when": "Mo 12", "label": "~73 kg\n<18% BF"}, {"when": "Cut", "label": "~70 kg\nlean+defined"}], {"w": 780, "h": 420}]}, {"t": "h", "x": "What actually drives it (in order)"}, {"t": "fig", "gen": "genPyramid", "cap": "What actually moves the needle for you, in order. The base is everything — the apex barely matters.", "args": [[{"label": "Supplements", "sub": "minor"}, {"label": "Meal timing / spread"}, {"label": "Sleep & recovery"}, {"label": "Protein ~130 g/day"}, {"label": "Slight surplus +250 kcal"}, {"label": "Progressive overload + consistency", "sub": "foundation"}], {"w": 700, "h": 460}]}]}, {"id": "stuck", "name": "Why you're stuck", "blurb": "current-day audit", "blocks": [{"t": "h", "x": "Your current day — why you've been stuck"}, {"t": "table", "head": ["Food", "Protein", "Calories"], "rows": [["3 eggs", "18 g", "210"], ["Whey ×3 scoops (72 g)", "72 g", "360"], ["Milk 600 ml", "20 g", "360"], ["Rice (lunch)", "5 g", "260"], ["Dal (1 katori)", "7 g", "150"], ["Potato sabzi", "3 g", "200"], ["2 roti", "6 g", "240"], ["Gourd veg", "2 g", "90"], ["Mango (1½)", "1.5 g", "200"], ["Total", "≈ 134 g", "≈ 2,070"]]}, {"t": "call", "x": "<b>Why stuck 2 months:</b> ~2,100 kcal ≈ your maintenance, so weight (and everything) sits still. Protein is already plenty (~2 g/kg). The fix isn't more protein — it's a <b>small surplus (+250)</b> + <b>progressive overload</b> + <b>sleep</b>."}, {"t": "call", "x": "<b>Your move.</b> Add ~250 kcal (an extra PB sandwich or a bowl of oats), keep protein ~130 g, push your lifts up every week, weigh weekly. Build to ~72–73 kg over the year, then a short cut → lean and muscular."}]}]}, {"id": "mealplan", "name": "Meal Plan", "icon": "🍽️", "intro": "Your lean-bulk meal plan — the day, the protein toolbox, and the swaps.", "topics": [{"id": "core", "name": "Daily core", "blurb": "your 3 non-negotiables", "blocks": [{"t": "h", "x": "Your 3 daily non-negotiables"}, {"t": "p", "x": "The one-glance summary of everything we worked out. Do what you like with the rest — but <b>eggs, soya and paneer</b> are the spine of the plan. Eggs and soya every day; paneer as the swap-in when you want a change (it's the same protein, just ~3× the cost)."}, {"t": "fig", "gen": "genMealCore", "cap": "Eggs + soya carry your protein every single day; paneer swaps in for the soya a few days a week. Stack them with a whey-and-milk shake and your usual dal & staples and the day lands ~140 g. Everything else is decoration.", "args": []}, {"t": "call", "x": "<b>The one cue that survives everything:</b> eat your eggs, eat your soya, swap in paneer sometimes. If a day falls apart, protect <i>those</i> — the rest is optional."}]}, {"id": "heur", "name": "Heuristics", "blurb": "the thinking behind it", "blocks": [{"t": "h", "x": "Heuristics — the thinking behind the plan"}, {"t": "p", "x": "The rules-of-thumb the whole plan runs on — so you can always see <i>why</i> a choice is made, not just what to eat."}, {"t": "fig", "gen": "genMealHeur", "cap": "Your operating heuristics, grouped: protein · energy & goals · food quality · training. Read these first — everything else is just applying them.", "args": []}, {"t": "cards", "items": [{"h": "Each meal 35–40 g protein", "x": "Hit it with 1–2 sources combined. This re-triggers muscle-building (MPS) ~4× a day instead of once."}, {"h": "Lunch & dinner always get a protein anchor", "x": "No matter what the main sabzi is — drop in a quick add-on (soy/paneer/egg/whey). These two meals are the danger zones."}, {"h": "Daily total is king", "x": "~1.6–2.2 g/kg/day is what matters; the per-meal spread is the optimizer, not a hard rule."}, {"h": "Protein is the fixed rail", "x": "Keep protein constant whether you cut or bulk; only carbs & fat flex up or down."}]}, {"t": "call", "x": "<b>Meta-rule:</b> calories set the <i>direction</i> (gain/lose), protein + training set <i>what tissue</i> (muscle/fat), and the weekly scale is the only judge of whether your numbers are right."}]}, {"id": "day", "name": "The day", "blurb": "meal by meal + itemised", "blocks": [{"t": "h", "x": "The day, meal by meal"}, {"t": "p", "x": "Your <b>lean-bulk day</b>: ~<b>2,460 kcal · ~148 g protein</b>, spread across 4 feedings (33–46 g each). Flex it with the toolbox and swaps below — the goal is a <i>clean</i> bulk. If the scale climbs faster than ~0.35 kg/wk, trim ~150 kcal."}, {"t": "fig", "gen": "genMealBars", "cap": "33–46 g protein per meal — re-triggers MPS ~4× a day. Total ~148 g / ~2,460 kcal (a clean surplus over maintenance).", "args": []}, {"t": "cards", "items": [{"h": "🌅 Breakfast · ~46 g · 780 kcal", "x": "<b>4-egg omelette</b> · 40 g oats (or low-sugar muesli) in 250 ml milk · <b>1 tbsp peanut butter on 1 slice bread</b> · 1 tbsp ground flax/chia. (PB on bread = easy, no teeth-stick.)"}, {"h": "🍛 Lunch · ~35 g · 620 kcal", "x": "1 cup rice · 1½ katori dal · <b>ONE protein pick</b> · kachumber (cucumber + onion + tomato + coriander, lemon, rock salt) · ~50 g curd (optional — 100 g is too much). Pick: soy chunks 30 g (15 g) / kabuli chana 100 g (9 g) / rajma 100 g (8 g) / green peas (5 g) / paneer 80 g (16 g)."}, {"h": "🏋️ Post-workout · ~34 g · 300 kcal", "x": "1 scoop whey + 300 ml milk. <b>Add a 2nd scoop ONLY</b> on days lunch/dinner had no big protein pick — you don't need 2+2."}, {"h": "🌙 Dinner · ~33 g · 760 kcal", "x": "3 roti · <b>ONE protein pick</b>: low-fat paneer 100 g (20 g) / rajma 1 katori (8 g) / soy (15 g) / chana (9 g) · green beans or sweet-corn sabzi · 1 mango. If both lunch+dinner were light on protein, top off with 1 whey scoop + 250 ml milk."}, {"h": "🥜 On-the-go (optional)", "x": "Travelling / studying: 1 tbsp pumpkin/hemp/flax/chia, or 20–30 g peanuts/almonds (~6–8 g / 150–170 kcal). Fill gaps — don't stack; keep the bulk lean."}]}, {"t": "h", "x": "Lunch & dinner — base protein & the gap to fill"}, {"t": "p", "x": "Your staples already carry some protein; one <b>pick</b> tops it up to ~35 g. <b>Lunch:</b> rice ~4 g + 1½ katori dal ~11 g + salad ~2 g ≈ <b>17 g base → need ~+18 g</b>. <b>Dinner:</b> 3 roti ~9 g + veg ~3 g + 1 mango ~1.5 g ≈ <b>~13 g base → need ~+21 g</b>. So subtract the base from 35 and cover the rest with your protein pick."}, {"t": "fig", "gen": "genMealMath", "cap": "The solid coloured bars = protein already in your staples; the dashed-pink 'gap' is what your pick must add to reach ~35 g. Lunch takes one big pick (soy/paneer); dinner takes a big pick, or a medium one (rajma/chana) + an egg or whey.", "args": []}, {"t": "h", "x": "Full day, itemised"}, {"t": "table", "head": ["Meal", "Foods", "Protein", "Calories"], "rows": [["Breakfast", "4-egg omelette · oats + 250 ml milk · PB on 1 bread · flax", "46 g", "780"], ["Lunch", "rice · 1½ dal · soy chunks · kachumber · 50 g curd", "35 g", "620"], ["Post-workout", "1 scoop whey + 300 ml milk", "34 g", "300"], ["Dinner", "3 roti · paneer/rajma · beans/corn · 1 mango", "33 g", "760"], ["Total", "", "≈ 148 g", "≈ 2,460"]]}]}, {"id": "toolbox", "name": "Protein toolbox", "blurb": "ranked, colour-coded", "blocks": [{"t": "h", "x": "Protein toolbox — pick your swaps"}, {"t": "fig", "gen": "genMealTool", "cap": "Protein per serving, ranked and colour-coded by group, with the fraction of each food's weight that is protein. Soy chunks, low-fat paneer, whey and Greek/hung curd are your highest-value picks; legumes add fibre + micros; seeds add omega-3.", "args": []}, {"t": "p", "x": "Flip it around: instead of protein per serving, here's <b>how much of each food you'd have to eat to get the same 18 g</b> — the flip-side of the fraction column. Whey and soy take a handful; legumes take ~2 katori; green peas take 3+ katori."}, {"t": "fig", "gen": "genMealLooksAll", "cap": "Every bar is 18 g of protein — the length is grams of that food you'd eat to get there. Concentrated foods (whey, soy, paneer, seeds, nuts) sit at the top with tiny amounts; bulky legumes and peas run down the bottom. Same protein, wildly different volume on your plate.", "args": []}]}, {"id": "swaps", "name": "Upgrade weak spots", "blurb": "before → after", "blocks": [{"t": "h", "x": "Upgrade the weak spots"}, {"t": "fig", "gen": "genMealSwap", "cap": "The biggest single win: swap the plain gourd/potato veg for a protein pick. Greek/hung curd triples the protein of regular dahi.", "args": []}]}, {"id": "rules", "name": "Rules & flex", "blurb": "curd, whey, muesli", "blocks": [{"t": "h", "x": "Rules & flex"}, {"t": "cards", "items": [{"h": "Whey scoops", "x": "Default 1 post-workout scoop. 2nd scoop only on low-protein days. No 2+2 shakes — total daily protein is what matters, and you're already there."}, {"h": "Curd", "x": "~50 g (2–3 tbsp) is plenty with rice; 100 g is too much. Optional — the lemony kachumber does the job."}, {"h": "Muesli vs oats", "x": "Fine if it's low/no-added-sugar (<5 g sugar/serving). It's ~oats + a bit more carbs/fat — just count the extra."}, {"h": "Keep it lean", "x": "PB, nuts and seeds are calorie-dense — measure them so you land ~2,350–2,400, not 2,800."}]}, {"t": "call", "x": "<b>Cue.</b> 4 feedings of 33–40 g protein · one real protein pick at lunch AND dinner · whey fills the gaps · seeds/nuts on the go · land ~2,390 kcal · progressively overload · weigh weekly (+0.2–0.35 kg/wk = perfect)."}]}, {"id": "quickadd", "name": "Quick add-ons", "blurb": "always-ready protein", "blocks": [{"t": "h", "x": "Quick protein add-ons"}, {"t": "p", "x": "Don't depend on what's cooked — keep your own quick add-ons ready and drop <b>ONE</b> onto any lunch or dinner. Breakfast &amp; post-workout are already sorted; these cover the two danger zones. Rule: <b>every lunch and dinner gets one protein anchor (~15–25 g)</b>, whatever else is on the table."}, {"t": "fig", "gen": "genMealAddons", "cap": "Grab one for any meal. Green = no cooking · blue = batch-prep once/twice a week · amber = 2-minute. Paneer cubes and a whey shake need zero prep; soy chunks and chana just need a weekly batch-boil.", "args": []}, {"t": "cards", "items": [{"h": "🥤 Whey + milk", "x": "1 scoop + 300 ml = ~34 g. The universal backup for any meal that falls short."}, {"h": "🧀 Raw paneer cubes", "x": "80–100 g = ~18–20 g. Cube + chaat masala, eat as-is. The laziest dinner fix — zero cooking."}, {"h": "🫘 Boiled soy chunks", "x": "30 g dry = ~15 g. Batch-boil, then toss into dal/sabzi/rice/curd or dry-roast as a snack — no separate curry needed."}, {"h": "🥚 Boiled eggs", "x": "2–3 = ~12–18 g. Keep a few boiled in the fridge; add instantly."}, {"h": "🫛 Boiled chana / rajma", "x": "1 katori = ~8–9 g. Pressure-cook + freeze in portions; 2-min chana chaat or add to anything."}, {"h": "🌱 Sprouted moong", "x": "1 cup = ~7 g. Roll a jar every 2 days; eat raw with lemon + onion."}, {"h": "🥣 Curd / Greek curd", "x": "~50 g side; Greek/hung curd triples the protein of regular dahi."}]}, {"t": "h", "x": "Batch-prep — once or twice a week"}, {"t": "p", "x": "Pressure-cook a big lot of chana/rajma and freeze in portions · boil a batch of soy chunks (keeps 3–4 days in the fridge) · start a sprout jar every 2 days. Paneer, eggs, curd and whey need <b>zero</b> prep. That's ~30 minutes a week for a whole week of protein insurance."}, {"t": "h", "x": "Lunch & dinner — the specifics"}, {"t": "cards", "items": [{"h": "🍛 Lunch is almost sorted", "x": "Dal already gives ~8–11 g. Add ONE — soy chunks tossed in, a boiled egg, or curd — and you're at ~30 g."}, {"h": "🌙 Dinner with no protein sabzi", "x": "Just add raw paneer cubes, 2 boiled eggs, a chana chaat, or a whey shake. One of them, every night."}]}, {"t": "call", "x": "<b>The system:</b> whatever your mother cooks + <b>pick ONE add-on</b> = protein sorted. You're never dependent on the menu. Ask her for a protein dish a few times a week if you like — but your batch-prepped add-ons are the real insurance."}]}, {"id": "brands", "name": "Trusted brands", "blurb": "what to buy in India", "blocks": [{"t": "h", "x": "Trusted brands"}, {"t": "p", "x": "Given the FSSAI drives on <b>‘analogue paneer’</b> (vegetable oil + starch sold as milk paneer), here's what to trust. Good news: <b>paneer is the only anchor you need to be strict about</b> — eggs, branded milk, whey, soya and dal are all low-risk."}, {"t": "fig", "gen": "genMealBrands", "cap": "Buy sealed & branded, with an FSSAI licence number. For paneer & curd, stick to big milk co-ops/dairies; for soya and legumes any reputable sealed brand is fine.", "args": []}, {"t": "h", "x": "Spotting fake / analogue paneer"}, {"t": "cards", "items": [{"h": "👃 Smell &amp; taste", "x": "Real paneer = mild, creamy, slightly sweet. A sour / chemical / detergent-like smell, or a chalky-bland taste, means adulterated."}, {"h": "✋ Texture", "x": "Real paneer crumbles softly; analogue is oddly rubbery / over-stretchy."}, {"h": "🧪 Starch test", "x": "Boil a piece, cool it, add a drop of iodine tincture — turns blue-black = starch added (fake)."}, {"h": "🏷️ Label", "x": "Must say made from milk + carry an FSSAI licence number. If it says ‘analogue’ / ‘non-dairy’, it isn't real paneer."}]}, {"t": "call", "x": "<b>Buying heuristic:</b> sealed + branded + FSSAI number + a big-name dairy for anything milk-based; real paneer isn't cheap (cheap = suspicious). Want zero paneer worry? Lean on <b>soya chunks + curd + eggs + whey</b> — all low-risk protein anchors."}]}, {"id": "swapcost", "name": "Swaps, portions & cost", "blurb": "system · portions · price", "blocks": [{"t": "h", "x": "Swaps, portions & cost"}, {"t": "p", "x": "The whole plan in one place: what's <b>automatic</b> vs what you <b>add</b>, exactly <b>how much</b> of each pick, the <b>backups</b> when you miss one, and what it all <b>costs</b>. This is the flexibility layer — use it to swap freely without ever dropping below your daily protein."}, {"t": "fig", "gen": "genMealSimple", "cap": "Green = automatic (eggs + whey + milk run themselves). Amber = your only two 'add' moves: soy at lunch, eggs (or a pick) at dinner. If you miss either, the violet plug — whey + milk (or water at night) — covers it. Day lands ≈ 137 g even on a lazy day.", "args": []}, {"t": "h", "x": "How much of each pick"}, {"t": "p", "x": "Your lunch/dinner staples give ~13–17 g on their own; one pick tops it to ~30–35 g. Here's the portion of each pick for a <b>~15 g</b> or <b>~20 g</b> top-up:"}, {"t": "table", "head": ["Protein pick", "for ~15 g", "for ~20 g"], "rows": [["Soy chunks (dry)", "30 g", "40 g"], ["Low-fat paneer", "75 g", "100 g"], ["Kabuli chana (cooked)", "1½ katori", "2 katori"], ["Rajma (cooked)", "2 katori", "2 katori + 1 egg"], ["Tofu", "180 g", "250 g"], ["Greek / hung curd", "150 g", "200 g"], ["Eggs", "2–3", "3–4"], ["Whey", "½ scoop", "1 scoop"]]}, {"t": "call", "x": "<b>Fast mental math:</b> soy is ~1/2 protein, paneer ~1/5, Greek curd ~1/10. So grams-of-protein ≈ weight × that fraction — 40 g soy ≈ 20 g, 100 g paneer ≈ 20 g, 200 g Greek curd ≈ 20 g."}, {"t": "h", "x": "Why soy, paneer &amp; eggs win — the veg-protein tiers"}, {"t": "p", "x": "The blunt truth about vegetarian protein: most vegetables are <b>decoration</b> — trace protein locked in a huge volume of water and fibre. You'd have to eat an <i>enormous</i> amount to hit your target, filling your belly and blowing your calories before you get there. Concentrated sources sidestep <b>both</b> ceilings — stomach volume <i>and</i> calorie budget — at once."}, {"t": "fig", "gen": "genMealLooks", "cap": "Every bar is the <b>same 18 g of protein</b> — the length is how much of that food you'd have to eat to get it. Soy needs 35 g; green beans need a full kilogram. That ~28× gap is the whole argument for concentrated protein.", "args": []}, {"t": "fig", "gen": "genMealTiers", "cap": "Three tiers: the <b>engine</b> (soy · paneer · eggs · whey · tofu · curd) carries most of your protein · the <b>support</b> (dal · chana · rajma · moong) is real protein but bulky, so it's the base not the whole meal · <b>decorations</b> (broccoli · beans · peas · sabzi) are for fibre &amp; fullness, never counted on for protein.", "args": []}, {"t": "call", "x": "<b>Tier cue:</b> get protein from the <b>engine</b>, build the plate on the <b>support</b>, enjoy <b>decorations</b> for fibre — never try to hit protein with vegetables."}, {"t": "h", "x": "Backups & compromises"}, {"t": "cards", "items": [{"h": "Forgot the pick? → whey + milk", "x": "1 scoop + 300 ml (or water at night) ≈ 34 g. The <b>universal plug</b> for a missed lunch soy or dinner pick — never go to bed short."}, {"h": "3 eggs at dinner = the pick", "x": "~18 g on top of roti + veg + mango → ~31 g. Then paneer/soy aren't needed at dinner. 6 eggs across a day is perfectly safe for you."}, {"h": "Don't over-optimise", "x": "~15 g from a pick is fine; a meal at ~30 g still lands the day near ~137 g. Precision isn't the point — <b>not skipping</b> is."}, {"h": "Soy daily · paneer a treat", "x": "Same protein, but paneer costs ~3× and whey ~5× per gram. Use paneer 2–3×/week for taste; let soy + dal + eggs carry the load."}]}, {"t": "h", "x": "Cost per gram of protein"}, {"t": "p", "x": "Where your protein rupees go. This is why the plan leans on soy, dal, eggs and milk for the bulk of it, and treats paneer &amp; whey as premium extras."}, {"t": "fig", "gen": "genMealCost", "cap": "Per gram of protein: soy, chana/rajma, peanuts, dal and milk are the cheap engine; eggs sit mid; paneer ~3× and whey ~5× the price of soy; branded Greek yogurt is priciest — make hung curd at home instead.", "args": []}, {"t": "h", "x": "The value map — density vs price, together"}, {"t": "p", "x": "The two ideas on one picture. <b>Up</b> = protein-dense (more protein per gram of food, so less to eat). <b>Right</b> = costs more per gram of protein. So the <b>top-left corner is the sweet spot</b>: dense <i>and</i> cheap."}, {"t": "fig", "gen": "genMealValue", "cap": "Each food plotted by protein density (up) vs cost per gram of protein (right). <b>Soy</b> sits alone in the green corner — dense and dirt-cheap, your everyday base. <b>Whey</b> is the densest but pricier. <b>Dal, chana, peanuts, eggs</b> cluster in the good-value band. <b>Branded Greek yogurt</b> is stranded bottom-right — dilute and expensive.", "args": []}, {"t": "call", "x": "<b>Value cue:</b> read the corner — <b>soy = eat daily</b> (dense + cheap); whey when you need dense-and-fast; dal/chana/eggs for cheap volume; paneer as a tasty splurge; branded Greek yogurt only if you love it (or make hung curd)."}, {"t": "call", "x": "<b>Cost cue:</b> budget engine = <b>soy + dal + eggs + milk</b>. Paneer &amp; whey = premium extras for taste + convenience. Skip branded Greek yogurt — hung curd at home is a fraction of the price for the same protein."}]}]}, {"id": "cmap", "name": "Nutrition Concept Map", "icon": "🗺️", "intro": "Pan, zoom, and click the + on any node to open it up.", "topics": [{"id": "map", "name": "Interactive map", "blurb": "Food to molecules to fates to stores — fully explorable.", "blocks": [{"t": "cmap", "map": "nutrition"}]}]}, {"id": "pmap", "name": "Protein Concept Map", "icon": "🧬", "intro": "Follow a gram of protein from plate to muscle (or fuel). Pan, zoom, click the + on any node.", "topics": [{"id": "map", "name": "Interactive map", "blurb": "Protein → amino acids → build / burn / recycle.", "blocks": [{"t": "cmap", "map": "protein"}]}]}, {"id": "pdose", "name": "Protein · dosing & MPS", "icon": "🍳", "intro": "What 0.4 g/kg means, the per-meal ceiling, and how to keep MPS elevated — with the graphs.", "topics": [{"id": "main", "name": "Dosing & MPS", "blurb": "g/kg, the ceiling, spreading, and the thumb rule.", "blocks": [{"t": "p", "x": "<b>“0.4 g/kg” = grams of protein per kg of your BODYWEIGHT</b> — nothing to do with the weight of the food. At 68 kg: one meal ≈ 0.4×68 ≈ <b>27 g protein</b>; the daily target uses the same anchor. Formula: <b>g/day = g/kg × bodyweight</b>."}, {"t": "table", "head": ["Goal (g/kg)", "Daily protein (68 kg)", "Per meal (×4)"], "rows": [["Minimum · RDA 0.8", "54 g", "—"], ["Build / keep · 1.6", "109 g", "27 g"], ["Solid · 2.0", "136 g", "34 g"], ["Cutting · 2.2", "150 g", "38 g"]]}, {"t": "h", "x": "The per-meal ceiling (“muscle full”)"}, {"t": "fig", "gen": "genPCDose", "cap": "One meal switches MPS on, but it maxes out at ~0.4 g/kg (~25–30 g). Past the ceiling, MPS doesn’t climb — the extra amino acids are oxidised.", "args": []}, {"t": "call", "x": "<b>Ceiling.</b> A bigger single dose does NOT build faster — it maxes the switch, and the surplus is burned. This is why one giant protein meal wastes most of it."}, {"t": "h", "x": "Where your 136 g/day actually goes (in grams)"}, {"t": "fig", "gen": "genPCSankey136", "cap": "Your 136 g/day in grams: ~34 g is taken by the gut & liver on first pass; of the ~102 g that reaches the body, ~60 g is oxidised for energy (nitrogen out as urea), ~28 g renews existing proteins (upkeep), ~11 g becomes other molecules, and only ~3 g is NET new muscle. Grams illustrative for a weight-stable 68 kg trainee.", "args": []}, {"t": "h", "x": "Why 160 g ≠ 12 g deposited"}, {"t": "fig", "gen": "genPCDaily", "cap": "Muscle-building drive vs TOTAL daily protein. It rises to ~1.6 g/kg then plateaus — past ~1.6–2.2 g/kg, more protein does not add muscle.", "args": []}, {"t": "call", "x": "<b>Two separate ceilings.</b> (1) Per-meal MPS caps at ~0.4 g/kg. (2) Per-DAY, net muscle is capped by your biological growth rate (~2–4 g/day). So eating 160 g instead of 130 g still deposits ~3 g — the surplus is upkeep + fuel. Training + time drive deposition, not extra grams."}, {"t": "h", "x": "Keeping MPS elevated all day (and all week)"}, {"t": "fig", "gen": "genPCTimeline", "cap": "A workout raises/sensitises MPS for ~24–48 h (the shaded envelope). Each protein feeding spikes MPS for ~2–3 h. Spread 3–4 feeds across the day to keep re-triggering it; train again next day to re-lift the envelope.", "args": []}, {"t": "p", "x": "<b>Spreading logic:</b> each meal maxes MPS for ~2–3 h, then it falls back and needs a dip (~3–5 h) before it responds again. So 3–4 meals of ~0.4 g/kg beat one huge meal (maxes once, wastes the rest) or six tiny ones (each may miss the threshold). Over a week of near-daily training + regular protein, MPS stays chronically elevated → muscle accrues."}, {"t": "h", "x": "The thumb rule"}, {"t": "cards", "items": [{"h": "Minimum — RDA 0.8 g/kg", "x": "Only avoids deficiency (sedentary). 68 kg → 54 g. Not enough for training."}, {"h": "Optimal — 1.6–2.2 g/kg", "x": "Build &amp; keep muscle. 68 kg → 109–150 g. ~1.6 covers most; go higher when lean/advanced."}, {"h": "Cutting — ~2.2 g/kg", "x": "In a deficit, the high end protects muscle. 68 kg → ~150 g."}]}, {"t": "h", "x": "See each target as a flow — toggle the four goals"}, {"t": "psankey"}, {"t": "call", "x": "<b>Cue.</b> Hit ~0.4 g/kg protein at 3–4 meals, total ~1.6–2.2 g/kg/day, train regularly. That keeps MPS maxed all day and rides the training envelope — the actual recipe for the ~3 g/day of new muscle."}]}]}]};

 function block(b,ctx){

 }
