<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition</title><style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1c2431;--dim:#5b6572;--line:#e7e9ee;--line2:#dcdfe6;--accent:#2f7d4f;--accent2:#1c2431;--soft:#e7f2ec;--gold:#caa24a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.happ{display:flex;flex-direction:column;height:100vh}
.hbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hbrand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:6px}
.htabs{display:flex;gap:3px;flex-wrap:wrap}
.htabs button{border:0;background:none;color:var(--dim);font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.htabs button:hover{background:var(--soft);color:var(--ink)}
.htabs button.active{background:var(--accent);color:#fff}
.stage{flex:1;min-height:0;overflow:hidden;position:relative}
.nlayout{display:flex;height:100%}
.nnav{flex:0 0 236px;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px}
.nnav .nl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:8px 10px 6px}
.tbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;font:inherit;padding:10px 11px;border-radius:10px;cursor:pointer;color:var(--dim);margin-bottom:3px;line-height:1.3}
.tbtn:hover{background:var(--soft);color:var(--ink)}
.tbtn.active{background:var(--soft);color:var(--ink);border-color:var(--accent)}
.tbtn b{display:block;font-size:14px;font-weight:750;color:inherit}
.tbtn span{font-size:12px;color:var(--dim)}
.nmain{flex:1;min-width:0;overflow-y:auto;padding:28px 34px 90px}
.nmain-in{max-width:820px}
.ntoc{flex:0 0 192px;border-left:1px solid var(--line);background:var(--surface);padding:14px 10px;overflow-y:auto}
.ntoc .tl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:4px 10px 8px}
.ntoc a{display:block;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.ntoc a:hover{background:var(--soft);color:var(--accent)}
.thead{margin-bottom:6px}
.thead h1{font-size:27px;font-weight:850;letter-spacing:-.01em;margin:0 0 4px}
.thead p{font-size:15px;color:var(--dim);margin:0;line-height:1.5}
.bh{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin:34px 0 8px;scroll-margin-top:12px}
.bh::after{content:"";flex:1;height:1px;background:var(--line)}
p.bp{font-size:15px;line-height:1.72;color:#39424f;margin:12px 0;max-width:760px}
p.bp b{color:var(--ink)}
.call{background:var(--soft);border:1px solid #cfe6d9;border-left:3px solid var(--accent);border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;line-height:1.66;color:#274b39;max-width:770px}
.pull{font-size:19px;font-weight:800;line-height:1.4;color:var(--ink);border-left:4px solid var(--gold);padding:6px 0 6px 18px;margin:18px 0;max-width:740px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:14px 0;max-width:840px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--accent);transform:translateY(-3px)}
.card b{display:block;font-size:14.5px;margin-bottom:4px}
.card span{font-size:13px;color:var(--dim);line-height:1.5}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;margin:14px 0}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.ncard .nt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ncard .nn{font-size:16px;font-weight:800}
.ncard .tag{font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 8px}
.ncard .nrow{font-size:13px;line-height:1.5;margin:5px 0}
.ncard .nrow .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1px}
.ncard .nrow.def .k{color:#c0453a}
.gtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:820px}
.gtable th,.gtable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);background:var(--soft)}
.gtable tr:last-child td{border-bottom:0}.gtable td b{color:var(--ink)}
.blist{margin:12px 0;padding-left:20px;max-width:760px}.blist li{font-size:14.5px;line-height:1.6;color:#39424f;margin:5px 0}
.flow{margin:16px 0;max-width:620px}
.flow .step{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 15px;font-size:14px;color:#39424f;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.flow .step b{color:var(--ink)}
.flow .arr{text-align:center;color:var(--accent);font-size:15px;line-height:1;margin:4px 0}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 8px;margin:18px 0;box-shadow:0 1px 2px rgba(20,25,40,.04);max-width:820px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:12.5px;color:var(--dim);text-align:center;padding:6px 8px 8px;line-height:1.5}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 19px;margin:12px 0;box-shadow:0 1px 2px rgba(20,25,40,.04);max-width:820px}
.term h4{margin:0 0 5px;font-size:17px;font-weight:800}
.term .what{font-size:14px;color:#39424f;line-height:1.6;margin:0 0 10px}
.term .trow{margin:8px 0}
.term .trow .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.term .trow.sym .k{color:#0891b2}.term .trow.fix .k{color:#16a34a}
.term .trow ul{margin:2px 0;padding-left:18px}.term .trow li{font-size:13.5px;line-height:1.5;color:#39424f}
@media(max-width:900px){.nlayout{flex-direction:column;height:auto}.nnav,.ntoc{flex:0 0 auto;border:0;border-bottom:1px solid var(--line)}.ntoc{display:none}.nmain{padding:22px 18px 70px}}
/*NCMCSS*/.ncm-root{position:relative;width:100%;height:70vh;background:#f7f8fa;overflow:hidden}.ncm-bleed{position:fixed;left:0;right:0;bottom:0;top:var(--ncm-top,58px);width:auto;height:auto;z-index:45;background:#f7f8fa}.ncm-stage{position:absolute;inset:0}.ncm-svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#f7f8fa}.ncm-svg.grab{cursor:grabbing}.ncm-toolbar{position:absolute;top:14px;right:18px;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e7e9ee;border-radius:22px;padding:8px 16px;box-shadow:0 2px 12px rgba(20,25,40,.10)}.ncm-zlabel{font-size:12px;color:#8b93a1;font-family:Helvetica,Arial,sans-serif}.ncm-slider{width:170px;accent-color:#7c3aed}.ncm-hint{position:absolute;left:18px;bottom:16px;font-size:12px;color:#8b93a1;background:#fff;border:1px solid #e7e9ee;border-radius:8px;padding:6px 11px}body.cmap-active .ntoc{display:none!important}body.cmap-active .nmain{padding:0!important}.ncm-node text,.ncm-edge text{font-family:Helvetica,Arial,sans-serif}.ncm-child,.ncm-cedge{transition:opacity .18s ease}/*ENCMCSS*//*PSKCSS*/.psankey-root{margin:14px 0}.psk-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.psk-btn{cursor:pointer;border:1px solid #e7e9ee;background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;color:#334;font-family:inherit}.psk-btn:hover{background:#f1f3f6}.psk-btn.on{background:#1c2431;color:#fff;border-color:#1c2431}.psk-chart svg{display:block;width:100%;height:auto}/*ENPSKCSS*/</style></head><body>
<div class="happ">
 <header class="hbar"><div class="hbrand">🥗 Nutrition</div><nav class="htabs" id="htabs"></nav></header>
 <div class="stage" id="stage"></div>
</div>
<script>
const C={ink:'#1f2933',mut:'#5b6572',line:'#c3cbd8',a1:'#4f46e5',a2:'#0891b2',a3:'#db2777',a4:'#ea580c',a5:'#16a34a',a6:'#9333ea'};

const MK=`<defs>
<marker id="mA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.mut}"/></marker>
<marker id="mR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.a3}"/></marker>
<marker id="mB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.a1}"/></marker></defs>`;

const escT=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const P=[C.a1,C.a2,C.a4,C.a5,C.a6,C.a3];

function SV(inner,w=680,h=460){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial">${MK}${inner}</svg>`;}
function T(x,y,txt,{fill=C.ink,fs=12,fw=400,anchor='middle',tr=''}={}){return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="${fs}" font-weight="${fw}"${tr?` transform="${tr}"`:''}>${escT(txt)}</text>`;}
function ML(x,y,label,o={}){const lines=String(label).split('\n');const lh=o.lh||13;const off=(lines.length-1)*lh/2;return lines.map((ln,i)=>T(x,y-off+i*lh,ln,o)).join('');}
function boxN(x,y,w,h,label,{fill=C.a1,tc='#fff',fs=12,r=9,stroke='',sw=0}={}){const lines=String(label).split('\n');const startY=y+h/2-((lines.length-1)*7)+4;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''}/>`+lines.map((ln,i)=>T(x+w/2,startY+i*14,ln,{fill:tc,fs,fw:600})).join('');}

function genGraph(nodes,edges,{w=700,h=460,pad=26}={}){
  const px=n=>pad+n.x*(w-2*pad), py=n=>pad+n.y*(h-2*pad); const byId={}; nodes.forEach(n=>byId[n.id]=n); let s='';
  (edges||[]).forEach(e=>{const a=byId[e.from],b=byId[e.to]; if(!a||!b)return; let x1=px(a),y1=py(a),x2=px(b),y2=py(b);
    const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;
    const o1=(a.r||(a.w?Math.max(a.w,a.h)/2:26))+2, o2=(b.r||(b.w?Math.max(b.w,b.h)/2:26))+7;
    x1+=dx/d*o1; y1+=dy/d*o1; x2-=dx/d*o2; y2-=dy/d*o2;
    const mk=e.arrow===false?'':`marker-end="url(#${e.mk||'mA'})"`, col=e.color||C.mut; let lmx,lmy;
    if(e.curve){const mxp=(x1+x2)/2-dy/d*e.curve, myp=(y1+y2)/2+dx/d*e.curve; s+=`<path d="M${x1},${y1} Q${mxp},${myp} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${e.w||1.7}" ${e.dash?`stroke-dasharray="${e.dash}"`:''} ${mk}/>`; lmx=(x1+2*mxp+x2)/4; lmy=(y1+2*myp+y2)/4;}
    else {s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${e.w||1.7}" ${e.dash?`stroke-dasharray="${e.dash}"`:''} ${mk}/>`; lmx=(x1+x2)/2; lmy=(y1+y2)/2;}
    if(e.label){const lw=String(e.label).length*6+8; s+=`<rect x="${lmx-lw/2}" y="${lmy-9}" width="${lw}" height="16" rx="4" fill="#fff" opacity=".92"/>`+T(lmx,lmy+3,e.label,{fill:e.lc||C.mut,fs:e.label.length<3?12:9.5,fw:e.label.length<3?800:400});}
  });
  nodes.forEach((n,i)=>{const cx=px(n),cy=py(n),fill=n.fill||P[i%P.length],tc=n.tc||'#fff',shape=n.shape||'round';
    if(shape==='circle'){const r=n.r||30; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${n.hollow?'#fff':fill}"${n.hollow?` stroke="${fill}" stroke-width="2.5"`:''}/>`+ML(cx,cy+4,n.label,{fill:n.hollow?C.ink:tc,fs:n.fs||11,fw:600});}
    else if(shape==='diamond'){const ww=n.w||96,hh=n.h||64; s+=`<polygon points="${cx},${cy-hh/2} ${cx+ww/2},${cy} ${cx},${cy+hh/2} ${cx-ww/2},${cy}" fill="${n.hollow?'#fff':fill}"${n.hollow?` stroke="${fill}" stroke-width="2.5"`:''}/>`+ML(cx,cy+4,n.label,{fill:n.hollow?C.ink:tc,fs:n.fs||10,fw:600});}
    else {const ww=n.w||110,hh=n.h||44; s+=boxN(cx-ww/2,cy-hh/2,ww,hh,n.label,{fill,tc,fs:n.fs||11,r:shape==='rect'?4:12});}
  });
  return SV(s,w,h);
}
function genMindMap(center,branches,{w=780,h=540}={}){const cx=w/2,cy=h/2,R1=Math.min(w,h)*0.29,rr=Math.min(w,h)*0.185,n=branches.length; let s='';
  branches.forEach((br,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n,bx=cx+Math.cos(ang)*R1,by=cy+Math.sin(ang)*R1,col=P[i%P.length];
    s+=`<path d="M${cx},${cy} Q${(cx+bx)/2},${(cy+by)/2} ${bx},${by}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    const kids=br.children||[],spread=Math.PI/2.6;
    kids.forEach((k,j)=>{const ka=ang+(kids.length>1?(-spread/2+j*spread/(kids.length-1)):0),kx=bx+Math.cos(ka)*rr,ky=by+Math.sin(ka)*rr;
      s+=`<line x1="${bx}" y1="${by}" x2="${kx}" y2="${ky}" stroke="${col}" stroke-width="1.4" opacity=".65"/>`;
      s+=`<rect x="${kx-48}" y="${ky-13}" width="96" height="26" rx="13" fill="#fff" stroke="${col}" stroke-width="1.4"/>`+ML(kx,ky+4,k,{fill:C.ink,fs:9.5,fw:600});});
    s+=boxN(bx-58,by-19,116,38,br.label,{fill:col,fs:11,r:19});});
  s+=`<circle cx="${cx}" cy="${cy}" r="48" fill="${C.ink}"/>`+ML(cx,cy+4,center,{fill:'#fff',fs:13,fw:700});
  return SV(s,w,h);}
function genTree(root,{w=720,h=440,pad=44,boxW=104,boxH=40}={}){let leaves=[];const levels=[];
  (function walk(n,d){n._d=d;levels[d]=1;if(!n.children||!n.children.length)leaves.push(n);else n.children.forEach(c=>walk(c,d+1));})(root,0);
  const maxD=levels.length-1,xGap=(w-2*pad)/Math.max(1,leaves.length-1);
  leaves.forEach((lf,i)=>lf._x=leaves.length===1?w/2:pad+i*xGap);
  const yGap=(h-2*pad-boxH)/Math.max(1,maxD);
  (function setx(n){if(n.children&&n.children.length){n.children.forEach(setx);n._x=(n.children[0]._x+n.children[n.children.length-1]._x)/2;}n._y=pad+n._d*yGap;})(root);
  let s='';const pal=[C.a2,C.a4,C.a5,C.a6,C.a3];
  (function ed(n){if(n.children)n.children.forEach(c=>{s+=`<path d="M${n._x},${n._y+boxH} C${n._x},${(n._y+boxH+c._y)/2} ${c._x},${(n._y+boxH+c._y)/2} ${c._x},${c._y}" fill="none" stroke="${C.line}" stroke-width="1.6"/>`;ed(c);});})(root);
  (function nd(n){const col=n._d===0?C.a1:pal[(n._d-1)%pal.length];s+=boxN(n._x-boxW/2,n._y,boxW,boxH,n.label,{fill:n._d===0?C.a1:'#fff',tc:n._d===0?'#fff':C.ink,stroke:n._d===0?'':col,sw:1.8,fs:10.5,r:8});if(n.children)n.children.forEach(nd);})(root);
  return SV(s,w,h);}
function genPyramid(levels,{w=680,h=460}={}){const n=levels.length,top=44,botW=w-160,ax=w/2,H=h-100,lh=H/n;let s='';
  levels.forEach((lv,i)=>{const y0=top+i*lh,y1=top+(i+1)*lh,wt=botW*i/n,wb=botW*(i+1)/n;
    s+=`<polygon points="${ax-wt/2},${y0} ${ax+wt/2},${y0} ${ax+wb/2},${y1} ${ax-wb/2},${y1}" fill="${lv.color||P[i%P.length]}"/>`;
    s+=ML(ax,(y0+y1)/2+4,lv.label,{fill:'#fff',fs:12,fw:700});
    if(lv.sub)s+=T(ax+wb/2+10,(y0+y1)/2+4,lv.sub,{fill:C.mut,fs:10,anchor:'start'});});
  return SV(s,w,h);}
function genTreemap(items,{w=680,h=440,pad=8}={}){const total=items.reduce((a,b)=>a+b.weight,0);let it=items.slice().sort((a,b)=>b.weight-a.weight);
  const x=pad,rw=w-2*pad,rh=h-2*pad;let curY=pad,s='',rem=it.slice();
  while(rem.length){const rc=Math.min(rem.length,rem.length<=3?rem.length:2),row=rem.splice(0,rc),rowW=row.reduce((a,b)=>a+b.weight,0),rowH=rh*(rowW/total);let curX=x;
    row.forEach(item=>{const cw=rw*(item.weight/rowW);s+=`<rect x="${curX}" y="${curY}" width="${cw-4}" height="${rowH-4}" rx="6" fill="${item.color||C.a1}"/>`;
      s+=ML(curX+(cw-4)/2,curY+rowH/2-2,item.label,{fill:'#fff',fs:11.5,fw:700});
      s+=T(curX+(cw-4)/2,curY+rowH/2+16,Math.round(item.weight/total*100)+'%',{fill:'rgba(255,255,255,.85)',fs:10});curX+=cw;});curY+=rowH;}
  return SV(s,w,h);}
function genTimeline(events,{w=780,h=420}={}){const y=h/2,x0=54,x1=w-54,n=events.length;let s=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="3"/>`;
  events.forEach((e,i)=>{const x=x0+(x1-x0)*(n===1?0.5:i/(n-1)),dir=i%2===0?-1:1,col=P[i%P.length];
    s+=`<circle cx="${x}" cy="${y}" r="7" fill="${col}"/>`;const ly=y+dir*74;
    s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${ly+(dir<0?24:-24)}" stroke="${col}" stroke-width="1.6"/>`;
    s+=`<rect x="${x-72}" y="${ly-24}" width="144" height="54" rx="9" fill="#fff" stroke="${col}" stroke-width="1.6"/>`;
    s+=T(x,ly-6,e.when,{fill:col,fs:11.5,fw:700})+ML(x,ly+13,e.label,{fill:C.ink,fs:9.5,fw:600,lh:11});});
  return SV(s,w,h);}
function genCycle(stages,{w=620,h=560,center=''}={}){const cx=w/2,cy=h/2,R=Math.min(w,h)*0.30,n=stages.length;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.line}" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  const pts=stages.map((st,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,a};});
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],a1=p.a+0.44,a2=q.a-0.44,x1=cx+Math.cos(a1)*R,y1=cy+Math.sin(a1)*R,x2=cx+Math.cos(a2)*R,y2=cy+Math.sin(a2)*R;
    s+=`<path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" fill="none" stroke="${C.mut}" stroke-width="2" marker-end="url(#mA)"/>`;}
  stages.forEach((st,i)=>{const p=pts[i],col=P[i%P.length];s+=`<circle cx="${p.x}" cy="${p.y}" r="46" fill="${col}"/>`+ML(p.x,p.y+4,st.label,{fill:'#fff',fs:11,fw:700});
    if(st.note){const ox=cx+(p.x-cx)*1.62,oy=cy+(p.y-cy)*1.62;s+=ML(ox,oy,st.note,{fill:C.mut,fs:9,lh:10});}});

var DATA={"pal": {"a1": "#4f46e5", "a2": "#0891b2", "a3": "#db2777", "a4": "#ea580c", "a5": "#16a34a", "a6": "#9333ea"}, "tabs": [{"id": "overview", "name": "Overview", "icon": "🍎", "intro": "How food becomes you — the single mental model under everything else.", "topics": [{"id": "picture", "name": "The Big Picture", "blurb": "Food → energy → build & repair.", "blocks": [{"t": "p", "x": "Strip nutrition down to first principles and it is one loop: you eat food, your body dismantles it for <b>energy</b> and for <b>raw materials</b>, and it uses both to run and rebuild itself. Everything in this library — macros, micros, cholesterol, stress, metabolism — hangs off that loop."}, {"t": "fig", "gen": "genGraph", "cap": "Food is taken apart for fuel and building blocks.", "args": [[{"id": "f", "x": 0.5, "y": 0.07, "shape": "round", "w": 150, "h": 36, "label": "Food", "fill": "#4f46e5"}, {"id": "d", "x": 0.5, "y": 0.28, "shape": "rect", "w": 180, "h": 34, "label": "Digestion breaks bonds", "fill": "#0891b2"}, {"id": "g", "x": 0.22, "y": 0.52, "shape": "rect", "w": 150, "h": 40, "label": "Glucose / fatty acids\n/ amino acids", "fill": "#0891b2"}, {"id": "atp", "x": 0.5, "y": 0.74, "shape": "rect", "w": 150, "h": 34, "label": "ATP (energy)", "fill": "#16a34a"}, {"id": "bb", "x": 0.8, "y": 0.52, "shape": "rect", "w": 150, "h": 40, "label": "Building blocks", "fill": "#9333ea"}, {"id": "w", "x": 0.5, "y": 0.95, "shape": "round", "w": 190, "h": 36, "label": "Run & rebuild the body", "fill": "#16a34a"}], [{"from": "f", "to": "d"}, {"from": "d", "to": "g"}, {"from": "d", "to": "bb"}, {"from": "g", "to": "atp"}, {"from": "atp", "to": "w"}, {"from": "bb", "to": "w"}], {"w": 700, "h": 560}]}, {"t": "h", "x": "The one equation: food → ATP"}, {"t": "p", "x": "Every single thing your body does — a heartbeat, a thought, a muscle twitch, an immune cell fighting infection — is paid for in <b>ATP</b>. Food is just stored chemical energy; ATP is the spendable cash your cells actually use."}, {"t": "fig", "gen": "genConcentric", "cap": "Three layers: raw food → the conversion → the spendable currency.", "args": [[{"label": "Food (calories)", "color": "#4f46e5"}, {"label": "Cellular respiration", "color": "#0891b2"}, {"label": "ATP (spendable)", "color": "#16a34a"}], {"caption": "Glucose is the ore; ATP is the refined, spendable metal.", "w": 560, "h": 520}]}, {"t": "call", "x": "<b>Calories</b> = the total energy locked in food. <b>ATP</b> = the portion your cells actually capture. <b>Heat</b> = the rest, lost in conversion — and what keeps you at 37&deg;C."}, {"t": "h", "x": "Two directions at once"}, {"t": "p", "x": "Metabolism is two opposite processes running simultaneously — one tearing down for energy, one building up for repair."}, {"t": "cards", "items": [{"h": "Catabolism", "x": "Break down → release energy. Digesting food, burning fat, breaking down muscle."}, {"h": "Anabolism", "x": "Build up → consume energy. Building muscle, repairing tissue, making hormones."}, {"h": "Metabolism", "x": "Catabolism + anabolism, happening together, every second you are alive."}]}, {"t": "h", "x": "The fuel hierarchy"}, {"t": "p", "x": "Your body is a hybrid engine — it runs on a mix of fuels, but in a preference order."}, {"t": "flow", "steps": ["Glucose — fastest, most immediate", "Fat — largest store, slower to access (9 kcal/g vs 4)", "Protein — last resort, pulled from muscle when desperate"]}, {"t": "h", "x": "How this library is organised"}, {"t": "cards", "items": [{"h": "⚡ Energy & Metabolism", "x": "Calories, ATP, BMR/TDEE and what actually moves your metabolic rate.", "go": "energy"}, {"h": "🍞 Macronutrients", "x": "Carbs, protein, fats and sugar — the fuel and the framework.", "go": "macros"}, {"h": "💊 Micronutrients", "x": "Vitamins, minerals and the way they help or block each other.", "go": "micros"}, {"h": "🫀 Body Systems", "x": "Cholesterol and the stress response — where it all connects.", "go": "systems"}, {"h": "🩺 Medical Terms", "x": "The common conditions, decoded from first principles.", "go": "terms"}]}]}]}, {"id": "energy", "name": "Energy & Metabolism", "icon": "⚡", "intro": "Where your energy comes from, and what sets how much you burn.", "topics": [{"id": "cal", "name": "Calories → ATP", "blurb": "How food energy becomes usable energy.", "blocks": [{"t": "p", "x": "A calorie is just a unit of energy. The number on a food label is the total chemical energy stored in the bonds of its glucose, fat and protein. But your body can't spend calories directly — it has to convert them, inside your cells, into ATP."}, {"t": "fig", "gen": "genGraph", "cap": "Cellular respiration — the core energy reaction.", "args": [[{"id": "g", "x": 0.5, "y": 0.1, "shape": "round", "w": 190, "h": 36, "label": "Glucose + Oxygen", "fill": "#4f46e5"}, {"id": "r", "x": 0.5, "y": 0.42, "shape": "rect", "w": 200, "h": 34, "label": "Cellular respiration", "fill": "#0891b2"}, {"id": "atp", "x": 0.28, "y": 0.78, "shape": "rect", "w": 150, "h": 34, "label": "ATP → powers work", "fill": "#16a34a"}, {"id": "h", "x": 0.72, "y": 0.78, "shape": "rect", "w": 160, "h": 34, "label": "Heat → keeps 37°C", "fill": "#ea580c"}, {"id": "co", "x": 0.5, "y": 0.95, "shape": "round", "w": 160, "h": 32, "label": "+ CO₂ + water", "fill": "#5b6572"}], [{"from": "g", "to": "r"}, {"from": "r", "to": "atp"}, {"from": "r", "to": "h"}, {"from": "r", "to": "co"}], {"w": 700, "h": 520}]}, {"t": "p", "x": "Carbs, fats and proteins all funnel into this same ATP-producing machinery, just at different entry points. Fat yields more ATP per gram (that's why it's 9 kcal/g vs 4 for carbs and protein), but glucose is the quickest to tap."}, {"t": "flow", "steps": ["Carbohydrates → glucose → ATP", "Fats → fatty acids → ATP (more per gram, slower)", "Proteins → amino acids → ATP only when needed"]}]}, {"id": "tdee", "name": "Metabolism & TDEE", "blurb": "The four things you burn calories on.", "blocks": [{"t": "p", "x": "Your <b>Total Daily Energy Expenditure (TDEE)</b> is everything you burn in a day. Most people picture 'exercise' — but exercise is usually the smallest, most variable slice. Four components make up the whole."}, {"t": "table", "head": ["Component", "Share of TDEE", "What it is"], "rows": [["BMR — Basal Metabolic Rate", "60–70%", "Energy just to stay alive at rest — heart, lungs, kidneys, cells."], ["NEAT — Non-Exercise Activity", "15–30%", "Walking around, fidgeting, standing, gesturing. The quiet giant."], ["TEF — Thermic Effect of Food", "~10%", "The cost of digesting and processing food. Yes, eating burns calories."], ["EAT — Exercise Activity", "Variable", "Deliberate training — gym, running, sport."]]}, {"t": "call", "x": "The two biggest levers — BMR and NEAT — are the ones people ignore. An hour in the gym can be undone by sitting still for the other 23."}]}, {"id": "rate", "name": "Move Your Metabolic Rate", "blurb": "What raises it, what lowers it.", "blocks": [{"t": "p", "x": "Metabolic rate isn't fixed. Modern life — sedentary, sleep-deprived, stressed, low-protein — systematically pushes it <b>down</b>. Almost everyone's goal is to nudge it back up."}, {"t": "fig", "gen": "genFishbone", "cap": "The levers that raise metabolic rate.", "args": ["Higher metabolic rate", [{"name": "Muscle", "causes": ["more muscle mass", "resistance training"]}, {"name": "Intake", "causes": ["high protein", "adequate iodine/selenium"]}, {"name": "Recovery", "causes": ["good sleep", "managed stress"]}, {"name": "Stimuli", "causes": ["cold exposure", "caffeine", "EPOC after training"]}], {"w": 820, "h": 430}]}, {"t": "cards", "items": [{"h": "↑ Raises it", "x": "More muscle · resistance training · high protein · adequate thyroid (T3/T4) · good sleep · cold exposure · youth · caffeine · post-exercise EPOC."}, {"h": "↓ Lowers it", "x": "Low muscle (sarcopenia) · chronic caloric restriction · hypothyroidism · chronic stress (cortisol) · poor sleep · aging · sedentary living."}]}, {"t": "call", "x": "Muscle mass is the single most powerful lever you control. It's the 'idling speed' of the whole engine."}]}, {"id": "loop", "name": "The Muscle–Metabolism Loop", "blurb": "Why muscle is the master lever.", "blocks": [{"t": "p", "x": "Muscle isn't just for looks or strength — it's metabolically active tissue that burns calories at rest and improves how you handle glucose. It sets off a self-reinforcing cycle in whichever direction you're heading."}, {"t": "fig", "gen": "genCycle", "cap": "The upward spiral — and it runs in reverse too.", "args": [[{"label": "More muscle"}, {"label": "Higher resting burn"}, {"label": "Leaner body"}, {"label": "Better insulin sensitivity"}, {"label": "Higher testosterone"}], {"w": 600, "h": 540, "center": "Build"}]}, {"t": "p", "x": "Concretely: two people at 70 kg, one at 30% body fat and one at 15%, differ by ~10 kg of muscle — and the leaner one burns roughly <b>300 more calories a day just existing</b>. Over a year that's ~14 kg of fat's worth of energy, for doing nothing extra. This is why resistance training is the strongest long-term metabolic intervention there is."}, {"t": "h", "x": "The three hormonal accelerators"}, {"t": "cards", "items": [{"h": "Thyroid (T3)", "x": "Adequate T3 = every cell runs at full speed. Low T3 (hypothyroidism) can drop metabolic rate 30–40% — fatigue, cold, weight gain, brain fog. Needs iodine + selenium."}, {"h": "Cortisol (stress)", "x": "Chronic cortisol breaks down muscle, stores visceral fat, suppresses thyroid and wrecks sleep — lowering BMR from several angles at once."}, {"h": "Sleep", "x": "One bad night drops insulin sensitivity; several drop growth hormone, raise cortisol and cut muscle repair — measurably lowering metabolic rate."}]}, {"t": "call", "x": "The reverse — the sarcopenia death spiral: less muscle → lower burn → more fat → worse insulin sensitivity → higher cortisol → even less muscle. The direction you feed wins."}]}]}, {"id": "macros", "name": "Macronutrients", "icon": "🍞", "intro": "The three fuels and the framework — carbs, protein, fats, and sugar.", "topics": [{"id": "carbs", "name": "Carbohydrates", "blurb": "Glucose, insulin and blood sugar.", "blocks": [{"t": "p", "x": "Carbohydrates are the body's quickest fuel. Nearly all of them end up as <b>glucose</b> in your blood — 'blood sugar' is literally the concentration of glucose, measured in mg/dL (a healthy fasting value is around 95)."}, {"t": "p", "x": "When blood glucose rises, the pancreas releases <b>insulin</b> — the master storage hormone. It does three jobs at once, deciding where the glucose goes."}, {"t": "fig", "gen": "genGraph", "cap": "Eat carbs → glucose rises → insulin stores it three ways.", "args": [[{"id": "e", "x": 0.5, "y": 0.06, "shape": "round", "w": 180, "h": 34, "label": "Eat rice → glucose ↑", "fill": "#4f46e5"}, {"id": "i", "x": 0.5, "y": 0.26, "shape": "rect", "w": 150, "h": 32, "label": "Insulin released", "fill": "#0891b2"}, {"id": "m", "x": 0.2, "y": 0.55, "shape": "rect", "w": 150, "h": 44, "label": "Muscle → glycogen", "fill": "#16a34a"}, {"id": "l", "x": 0.5, "y": 0.62, "shape": "rect", "w": 150, "h": 44, "label": "Liver → glycogen", "fill": "#16a34a"}, {"id": "f", "x": 0.8, "y": 0.55, "shape": "rect", "w": 150, "h": 44, "label": "Fat → triglycerides", "fill": "#ea580c"}, {"id": "b", "x": 0.5, "y": 0.92, "shape": "round", "w": 210, "h": 34, "label": "Glucose back to 70–100 in ~2h", "fill": "#0891b2"}], [{"from": "e", "to": "i"}, {"from": "i", "to": "m"}, {"from": "i", "to": "l"}, {"from": "i", "to": "f"}, {"from": "m", "to": "b"}, {"from": "l", "to": "b"}, {"from": "f", "to": "b"}], {"w": 720, "h": 520}]}, {"t": "h", "x": "The blood-sugar response tells the story"}, {"t": "table", "head": ["Person", "Spike", "Return to baseline"], "rows": [["Healthy", "~140 mg/dL", "Within ~2 hours"], ["Pre-diabetic", "~180 mg/dL", "3+ hours"], ["Diabetic", "Above 200 mg/dL", "May not return"]]}, {"t": "p", "x": "A longer-term marker is <b>HbA1c</b> — the fraction of your haemoglobin that has glucose stuck to it. Because red cells live ~3 months, it's a running average of your blood sugar, not a single snapshot."}, {"t": "call", "x": "The problem is rarely carbs existing — it's <b>refined</b> carbs and sugar spiking glucose fast and often, forcing big insulin swings."}]}, {"id": "protein", "name": "Protein", "blurb": "Amino acids — the body's building material.", "blocks": [{"t": "p", "x": "Protein is chains of <b>amino acids</b> — the alphabet the body builds nearly everything from: muscle, enzymes, hormones, skin, hair, antibodies, even neurotransmitters. There are 20 amino acids; 9 are <b>essential</b> (you must eat them) and 11 are non-essential (the body makes them)."}, {"t": "fig", "gen": "genTree", "cap": "20 amino acids — 9 you must eat, 11 you can make.", "args": [{"label": "Amino acids (20)", "children": [{"label": "Essential (9)", "children": [{"label": "Leucine"}, {"label": "Lysine"}, {"label": "Methionine"}, {"label": "Tryptophan"}]}, {"label": "Non-essential (11)", "children": [{"label": "Glutamine"}, {"label": "Glycine"}, {"label": "Alanine"}]}]}, {"w": 820, "h": 420, "boxW": 92, "boxH": 32}]}, {"t": "h", "x": "Complete vs incomplete"}, {"t": "cards", "items": [{"h": "Complete — all 9", "x": "Eggs (gold standard), whey, milk & paneer, chicken, fish."}, {"h": "Incomplete — missing some", "x": "Dal/lentils, rice/roti, peanut butter, chickpeas."}, {"h": "Combine to complete", "x": "Dal + rice together cover each other's gaps — a complete protein."}]}, {"t": "h", "x": "What protein does"}, {"t": "cards", "items": [{"h": "Muscle", "x": "Build & repair; leucine triggers synthesis."}, {"h": "Enzymes", "x": "Every chemical reaction in the body needs them."}, {"h": "Hormones", "x": "Insulin, growth hormone — all proteins."}, {"h": "Structure", "x": "Collagen (skin, tendons, bone), keratin (hair)."}, {"h": "Immunity", "x": "Every antibody is a protein."}, {"h": "Transport & mood", "x": "Haemoglobin carries O₂; serotonin & dopamine come from amino acids."}]}, {"t": "h", "x": "If you run short"}, {"t": "flow", "steps": ["Short term: poor recovery, fatigue, slow healing, hair loss, brain fog", "Medium term: muscle wasting, fluid retention, hormonal issues, skin loses elasticity", "Long term: organ damage, collapsed immunity, kwashiorkor"]}, {"t": "call", "x": "Master rule: get all 9 essential amino acids daily, prioritise complete sources, and aim for ~2 g per kg bodyweight if you train — eggs and whey first."}]}, {"id": "fats", "name": "Fats", "blurb": "Not the enemy — the type is what matters.", "blocks": [{"t": "p", "x": "A fat is a glycerol backbone with three fatty-acid chains. Whether it's solid or liquid — and whether it helps or harms — comes down to its chemical shape. There are three broad kinds, and they are not equal."}, {"t": "fig", "gen": "genTree", "cap": "The fat family — from best to avoid.", "args": [{"label": "Fats (lipids)", "children": [{"label": "Saturated", "children": [{"label": "solid"}]}, {"label": "Unsaturated", "children": [{"label": "Mono"}, {"label": "Poly", "children": [{"label": "Omega-3"}, {"label": "Omega-6"}]}]}, {"label": "Trans", "children": [{"label": "avoid"}]}]}, {"w": 820, "h": 430, "boxW": 84, "boxH": 30}]}, {"t": "fig", "gen": "genSpectrum", "cap": "How to treat each type.", "args": ["Eat freely", "Avoid entirely", [{"label": "Mono", "pos": 0.1, "color": "#16a34a"}, {"label": "Omega-3", "pos": 0.2, "color": "#16a34a"}, {"label": "Saturated\n(moderate)", "pos": 0.5, "color": "#ea580c"}, {"label": "Omega-6\n(reduce)", "pos": 0.68, "color": "#ea580c"}, {"label": "Trans", "pos": 0.95, "color": "#db2777"}], {"title": "Prioritise mono & omega-3; moderate saturated; cut omega-6 excess; eliminate trans", "w": 820, "h": 270}]}, {"t": "nutri", "items": [{"n": "Saturated", "tag": "MODERATE", "fn": ["Hormone production (testosterone/estrogen)", "Cell-membrane stability", "Absorbs vitamins A/D/E/K"], "src": ["Ghee, butter, eggs", "Full-fat milk, coconut oil"], "def": ["Low testosterone, hormonal disruption", "Poor fat-soluble vitamin absorption"]}, {"n": "Monounsaturated", "tag": "FREELY", "fn": ["Lowers LDL, raises HDL", "Anti-inflammatory", "Membrane flexibility"], "src": ["Olive oil, avocado", "Almonds, cashews, peanut butter"], "def": ["Higher cardiovascular risk", "Inflammation rises"]}, {"n": "Omega-3 (poly)", "tag": "PRIORITISE", "fn": ["DHA builds the brain", "EPA reduces inflammation", "Heart, eyes, joints, mood"], "src": ["Fatty fish (salmon, mackerel)", "Fish oil, walnuts & flax (ALA)"], "def": ["Brain fog, poor memory", "Depression, chronic inflammation, dry skin"]}, {"n": "Omega-6 (poly)", "tag": "REDUCE", "fn": ["Membrane structure", "Controlled inflammation (in balance)"], "src": ["Vegetable oils, sunflower seeds", "Corn oil, most packaged snacks"], "def": ["Excess → chronic inflammation", "Blocks omega-3 from working"]}, {"n": "Trans", "tag": "ELIMINATE", "fn": ["Zero beneficial function"], "src": ["Vanaspati/dalda, fried street food", "Anything 'partially hydrogenated'"], "def": ["Raises LDL AND lowers HDL", "Damages arteries — no safe level"]}]}, {"t": "call", "x": "The critical number is the <b>Omega-6 : Omega-3 ratio</b>. Ideal is ~4:1; a modern diet runs 20:1 or worse — which is why cutting seed oils and adding fish/flax matters more than total fat."}]}, {"id": "sugar", "name": "Sugar & Insulin", "blurb": "The spike, the crash, and the spiral.", "blocks": [{"t": "p", "x": "Sugar is the fastest carb of all — and its danger is behavioural as much as metabolic. Each hit sets up a short loop that, repeated for years, hardens into insulin resistance."}, {"t": "h", "x": "The meal-to-meal loop"}, {"t": "flow", "steps": ["Eat sugary/high-carb food", "Blood glucose spikes fast → dopamine hit (feels rewarding)", "Large insulin response to clear it", "Glucose crashes below baseline", "Energy crash → brain screams for quick energy", "Crave sugar again → repeat"]}, {"t": "h", "x": "The years-long spiral"}, {"t": "fig", "gen": "genCycle", "cap": "Repeated spikes → insulin resistance.", "args": [[{"label": "Chronic spikes"}, {"label": "Pancreas overworked"}, {"label": "Receptors downregulate"}, {"label": "Glucose can't enter cells"}, {"label": "Stored as visceral fat"}], {"w": 600, "h": 540, "center": "Resistance"}]}, {"t": "p", "x": "As receptors go numb, glucose can't get into cells efficiently — so cells are starved (chronic fatigue) while blood sugar stays high and gets stored as visceral fat, which worsens the resistance further. That's the road to Type 2 diabetes."}, {"t": "call", "x": "The fix isn't heroics — it's blunting the spikes: whole carbs over refined, protein/fat/fibre alongside, and movement after meals to pull glucose into muscle."}]}]}, {"id": "micros", "name": "Micronutrients", "icon": "💊", "intro": "Vitamins and minerals — tiny amounts, huge leverage, and they interact.", "topics": [{"id": "vitamins", "name": "Vitamins", "blurb": "Fat-soluble (stored) and water-soluble (daily).", "blocks": [{"t": "p", "x": "Vitamins split by where they dissolve. <b>Fat-soluble</b> (A, D, E, K) need dietary fat to absorb, are stored in liver and fat, and can accumulate — so you don't need them daily. <b>Water-soluble</b> (B-complex, C) aren't stored, flush out in urine, and are needed regularly (overdose is almost impossible)."}, {"t": "h", "x": "Fat-soluble — A · D · E · K"}, {"t": "nutri", "items": [{"n": "Vitamin A", "tag": "A", "fn": ["Night vision", "Skin cell renewal", "Immune barrier"], "src": ["Eggs, ghee, milk", "Carrots, pumpkin, spinach"], "def": ["Night blindness", "Dry skin, infections"]}, {"n": "Vitamin D3", "tag": "D", "fn": ["Calcium absorption", "Testosterone & mood", "Regulates 200+ genes"], "src": ["Sunlight (primary)", "Fatty fish, supplement"], "def": ["Fatigue, low testosterone", "Depression, weak bones"]}, {"n": "Vitamin E", "tag": "E", "fn": ["Antioxidant — protects cell walls", "Protects omega-3", "Works with vitamin C"], "src": ["Almonds, sunflower seeds", "Peanut butter, spinach"], "def": ["Cell damage", "Nerve damage, weak immunity"]}, {"n": "Vitamin K2", "tag": "K", "fn": ["Directs calcium INTO bones, OUT of arteries", "Works with D3"], "src": ["Natto (richest)", "Aged cheese, ghee"], "def": ["Calcium in arteries", "Weak bones despite calcium intake"]}]}, {"t": "h", "x": "Water-soluble — B-complex · C"}, {"t": "nutri", "items": [{"n": "B-complex (B1–B7)", "tag": "B", "fn": ["Turn food into ATP (energy)", "Nerve function, skin, hair", "B6 → serotonin/dopamine"], "src": ["Eggs, meat, dairy", "Whole grains, legumes"], "def": ["Fatigue, low energy", "Nerve and skin problems"]}, {"n": "B9 + B12", "tag": "B", "fn": ["DNA synthesis & red blood cells", "B12 builds myelin (nerves)"], "src": ["B9: leafy greens, dal", "B12: eggs, meat, dairy (supplement if vegan)"], "def": ["Anaemia, fatigue", "Nerve damage, brain fog"]}, {"n": "Vitamin C", "tag": "C", "fn": ["Collagen synthesis (skin, joints)", "Antioxidant", "Boosts iron absorption & immunity"], "src": ["Amla, citrus", "Tomato, peppers"], "def": ["Gum problems, poor healing", "Weak immunity (scurvy in extreme)"]}]}, {"t": "call", "x": "For most people on a mixed diet the gaps are: <b>Vitamin D</b> (supplement with food), and <b>B12</b> (must supplement if plant-based). Get vitamin C from food and A from colourful vegetables daily."}]}, {"id": "minerals", "name": "Minerals", "blurb": "Macrominerals (grams) and trace minerals (milligrams).", "blocks": [{"t": "p", "x": "Minerals are inorganic elements. <b>Macrominerals</b> you need in gram amounts — they run structure and fluid balance. <b>Trace minerals</b> you need in milligrams — but they act as catalysts, so a tiny shortfall causes outsized problems."}, {"t": "h", "x": "Macrominerals"}, {"t": "nutri", "items": [{"n": "Calcium", "tag": "Ca", "fn": ["Bone & teeth structure", "Muscle contraction, nerve signals"], "src": ["Milk, paneer", "Dal, sesame"], "def": ["Muscle cramps", "Bone density loss, osteoporosis"]}, {"n": "Magnesium", "tag": "Mg", "fn": ["300+ reactions — more than any other mineral", "Activates vitamin D3", "Muscle & nervous-system relaxation, sleep"], "src": ["Pumpkin seeds, dark leafy greens", "Dal, peanut butter"], "def": ["Poor sleep, cramps, anxiety", "D3 supplements barely work"]}, {"n": "Sodium", "tag": "Na", "fn": ["Fluid balance outside cells", "Nerve impulses, nutrient absorption"], "src": ["Table salt", "All cooked food"], "def": ["Rare; excess is the real issue → high BP"]}, {"n": "Potassium", "tag": "K", "fn": ["Fluid balance inside cells", "Heart rhythm, counters sodium → lowers BP"], "src": ["Potato, dal", "Banana, tomato, milk"], "def": ["Muscle weakness", "Irregular heartbeat, high BP"]}, {"n": "Phosphorus", "tag": "P", "fn": ["Bone structure with calcium", "Part of ATP and DNA/RNA"], "src": ["Eggs, milk", "Dal, peanut butter"], "def": ["Extremely rare — bone pain, low energy"]}]}, {"t": "h", "x": "Trace minerals"}, {"t": "nutri", "items": [{"n": "Iron", "tag": "Fe", "fn": ["Oxygen transport (haemoglobin)", "Energy production"], "src": ["Red meat (heme, best)", "Dal, spinach (needs vitamin C)"], "def": ["Fatigue, brain fog", "Anaemia — world's #1 deficiency"]}, {"n": "Zinc", "tag": "Zn", "fn": ["Immunity, wound healing", "Testosterone, taste & smell"], "src": ["Red meat, eggs", "Pumpkin seeds"], "def": ["Frequent illness", "Low testosterone, hair loss"]}, {"n": "Iodine", "tag": "I", "fn": ["Makes thyroid hormones T3/T4", "Sets whole-body metabolism"], "src": ["Iodised salt", "Seafood, dairy"], "def": ["Hypothyroidism", "Fatigue, weight gain, brain fog"]}, {"n": "Selenium", "tag": "Se", "fn": ["Master antioxidant (glutathione)", "Activates thyroid T4 → T3"], "src": ["Brazil nuts (2/day)", "Eggs, seafood"], "def": ["Thyroid dysfunction", "Weak immunity"]}, {"n": "Manganese", "tag": "Mn", "fn": ["Bone formation", "Antioxidant enzymes, metabolism"], "src": ["Rice, roti, dal", "Tea, nuts"], "def": ["Rare — bone fragility"]}]}]}, {"id": "pairs", "name": "Synergies & Antagonisms", "blurb": "Which nutrients help, block, or activate each other.", "blocks": [{"t": "p", "x": "Micronutrients don't act alone. Some <b>amplify</b> each other, some <b>compete</b> for the same absorption pathway, and some form <b>chains</b> where one activates the next. Getting the pairings right often matters more than the dose."}, {"t": "h", "x": "Synergistic pairs — take together"}, {"t": "cards", "items": [{"h": "D3 + K2", "x": "The most critical pairing. D3 absorbs calcium; K2 sends it to bones, not arteries. Always together."}, {"h": "D3 + Magnesium", "x": "Magnesium activates D3 — without it, a D3 supplement barely works."}, {"h": "Vitamin C + Iron", "x": "Vitamin C converts plant (non-heme) iron into an absorbable form. Lemon on dal."}, {"h": "Vitamin C + Vitamin E", "x": "C regenerates E after it neutralises a free radical — an antioxidant relay."}, {"h": "Ca + D3 + K2 + Mg", "x": "The bone team. Miss one and the whole chain underperforms."}, {"h": "Iodine + Selenium", "x": "Iodine makes T4; selenium converts it to active T3. Both needed for thyroid."}]}, {"t": "h", "x": "Antagonistic pairs — separate them"}, {"t": "cards", "items": [{"h": "Iron ✗ Calcium", "x": "Compete for absorption — don't take an iron and a calcium supplement together."}, {"h": "Iron ✗ Zinc", "x": "Share a pathway; large doses of one blunt the other."}, {"h": "Omega-6 ✗ Omega-3", "x": "Compete for the same enzymes — excess omega-6 crowds omega-3 out."}]}, {"t": "h", "x": "Dependent chains — one activates the next"}, {"t": "fig", "gen": "genGraph", "cap": "Chains where each step enables the next.", "args": [[{"id": "se", "x": 0.25, "y": 0.12, "shape": "round", "w": 130, "h": 32, "label": "Selenium", "fill": "#0891b2"}, {"id": "gl", "x": 0.25, "y": 0.5, "shape": "rect", "w": 150, "h": 32, "label": "Glutathione", "fill": "#0891b2"}, {"id": "ax", "x": 0.25, "y": 0.88, "shape": "round", "w": 140, "h": 32, "label": "Antioxidant", "fill": "#16a34a"}, {"id": "tr", "x": 0.75, "y": 0.12, "shape": "round", "w": 150, "h": 32, "label": "Tryptophan + B6", "fill": "#9333ea"}, {"id": "sr", "x": 0.75, "y": 0.5, "shape": "round", "w": 130, "h": 32, "label": "Serotonin", "fill": "#16a34a"}, {"id": "bb", "x": 0.5, "y": 0.7, "shape": "round", "w": 150, "h": 32, "label": "B9 + B12", "fill": "#4f46e5"}, {"id": "dn", "x": 0.75, "y": 0.88, "shape": "rect", "w": 170, "h": 32, "label": "DNA + red cells", "fill": "#16a34a"}], [{"from": "se", "to": "gl"}, {"from": "gl", "to": "ax"}, {"from": "tr", "to": "sr"}, {"from": "bb", "to": "dn"}], {"w": 720, "h": 460}]}]}]}, {"id": "systems", "name": "Body Systems", "icon": "🫀", "intro": "Where nutrition becomes physiology — cholesterol and the stress response.", "topics": [{"id": "chol", "name": "Cholesterol & Lipids", "blurb": "A building material, not a poison.", "blocks": [{"t": "p", "x": "Cholesterol is not a disease — it's a fat-like molecule your body depends on. Your liver makes ~80% of it; your brain is ~25% cholesterol; and testosterone, estrogen, cortisol and vitamin D are all built from it. The problem is never that it exists — it's the transport going wrong."}, {"t": "h", "x": "Six essential jobs"}, {"t": "fig", "gen": "genMindMap", "cap": "What cholesterol actually does.", "args": ["Cholesterol", [{"label": "Membrane fluidity"}, {"label": "Enables membrane proteins"}, {"label": "Lipid rafts (signalling)"}, {"label": "Myelin (nerve insulation)"}, {"label": "Steroid hormones"}, {"label": "Bile acids (fat digestion)"}], {"w": 800, "h": 560}]}, {"t": "h", "x": "LDL and HDL are trucks, not cargo"}, {"t": "p", "x": "Cholesterol can't travel in water-based blood alone, so it rides inside <b>lipoproteins</b>. LDL and HDL are the vehicles — not the cholesterol itself. 'LDL cholesterol' on a blood test means the cholesterol being carried inside LDL particles."}, {"t": "fig", "gen": "genGraph", "cap": "Delivery out, cleanup back.", "args": [[{"id": "li", "x": 0.5, "y": 0.1, "shape": "round", "w": 130, "h": 34, "label": "Liver", "fill": "#4f46e5"}, {"id": "ldl", "x": 0.25, "y": 0.45, "shape": "rect", "w": 170, "h": 44, "label": "LDL → delivers to cells", "fill": "#db2777"}, {"id": "cells", "x": 0.5, "y": 0.75, "shape": "round", "w": 130, "h": 34, "label": "Body cells", "fill": "#5b6572"}, {"id": "hdl", "x": 0.75, "y": 0.45, "shape": "rect", "w": 170, "h": 44, "label": "HDL → returns for recycling", "fill": "#16a34a"}], [{"from": "li", "to": "ldl"}, {"from": "ldl", "to": "cells"}, {"from": "cells", "to": "hdl"}, {"from": "hdl", "to": "li"}], {"w": 700, "h": 460}]}, {"t": "p", "x": "Trouble starts when there's too much LDL and it gets <b>oxidised</b> by free radicals — it deposits in artery walls, forming plaque (atherosclerosis). HDL is the cleanup crew pulling excess cholesterol back to the liver."}, {"t": "table", "head": ["Marker", "Target"], "rows": [["LDL", "below 100 mg/dL"], ["HDL", "above 60 mg/dL (protective)"], ["Triglycerides", "below 150 mg/dL"], ["Total : HDL ratio", "below 4"]]}, {"t": "call", "x": "The reframe: the fix is to improve transport — more HDL, less oxidised LDL — not to crush cholesterol itself. Triglycerides, notably, rise from excess <b>sugar and refined carbs</b>, not dietary fat."}]}, {"id": "stress", "name": "The Stress Response", "blurb": "One hormone, six system-wide effects.", "blocks": [{"t": "p", "x": "Acute stress is a brilliant survival system: adrenaline and cortisol prepare you to fight or flee — heart rate up, glucose dumped into blood, digestion and immunity paused. The design flaw is that it's meant to be <b>resolved by physical action</b>. When the threat is chronic and psychological, the hormones just circulate with nowhere to go."}, {"t": "fig", "gen": "genFishbone", "cap": "One trigger, one hormone, six simultaneous harms.", "args": ["Chronic disease", [{"name": "Blood sugar", "causes": ["insulin resistance", "Type 2 diabetes"]}, {"name": "Vessels", "causes": ["high blood pressure", "artery damage"]}, {"name": "Muscle", "causes": ["breakdown", "testosterone drops"]}, {"name": "Fat", "causes": ["visceral fat", "inflammation"]}, {"name": "Immune", "causes": ["suppressed", "frequent illness"]}, {"name": "Sleep", "causes": ["disrupted", "self-perpetuating"]}], {"w": 840, "h": 460}]}, {"t": "p", "x": "Sustained cortisol elevates blood sugar (→ insulin resistance), constricts vessels and retains sodium (→ high blood pressure), breaks down muscle (→ lower testosterone and metabolic rate), stores visceral fat (→ inflammation, worse cholesterol), suppresses immunity, and disrupts sleep — which loops back and worsens everything."}, {"t": "call", "x": "This is why exercise is the most effective stress relief — not as motivation, but as mechanism. Physical activity <b>completes the fight-or-flight cycle</b>: it burns off the adrenaline and cortisol-driven glucose, releases endorphins, and raises testosterone to directly counter cortisol."}]}]}, {"id": "terms", "name": "Medical Terms", "icon": "🩺", "intro": "Common conditions decoded — what they are, why they happen, and the nutrient links.", "topics": [{"id": "how", "name": "How to think about them", "blurb": "Categories that reveal mechanism.", "blocks": [{"t": "p", "x": "Most everyday medical terms fall into a few families. Knowing which family something belongs to immediately tells you how it works and why it happens."}, {"t": "cards", "items": [{"h": "Measurable values", "x": "Cholesterol, blood pressure, thyroid — numbers, usually silent until damage is done."}, {"h": "Digestive", "x": "Acidity, constipation, diarrhoea, kidney & gall stones."}, {"h": "Inflammatory / respiratory", "x": "Arthritis, asthma, sinusitis, migraine."}, {"h": "Infections", "x": "Cold and other viral illness — mostly your immune response, not the virus itself."}, {"h": "Neurological / vestibular", "x": "Migraine, vertigo — and nausea, which is a symptom, not a disease."}]}, {"t": "table", "head": ["Condition", "Category", "Root cause", "Key symptom"], "rows": [["Cholesterol", "Blood lipid", "Excess LDL, trans fats, sugar", "Silent"], ["Blood pressure", "Circulatory", "Arterial resistance, sodium, stress", "Silent"], ["Thyroid", "Hormonal", "Iodine/selenium deficiency, autoimmune", "Fatigue, weight change"], ["Cold", "Viral", "Rhinovirus", "Runny nose, sore throat"], ["Sinusitis", "Inflammatory", "Blocked sinus drainage", "Facial pressure, thick mucus"], ["Migraine", "Neurological", "Cortical spreading depression", "Severe one-sided headache"], ["Acidity", "Digestive", "LES valve failure", "Burning in chest"], ["Constipation", "Digestive", "Low fibre/water/magnesium", "Hard stools, straining"], ["Diarrhoea", "Digestive", "Infection, intolerance", "Loose watery stools"], ["Asthma", "Respiratory", "Airway hypersensitivity", "Wheezing, breathlessness"], ["Arthritis", "Inflammatory", "Wear & tear or autoimmune", "Joint pain, stiffness"], ["Kidney stone", "Mineral deposit", "Concentrated urine", "Severe flank pain"], ["Gallstone", "Mineral deposit", "Excess cholesterol in bile", "Upper-right abdominal pain"]]}]}, {"id": "measurable", "name": "Measurable Values", "blurb": "Cholesterol, blood pressure, thyroid.", "blocks": [{"t": "term", "items": [{"n": "Blood Pressure", "what": "The force of blood against artery walls — systolic (heart contracts) over diastolic (heart relaxes). Normal ~120/80; hypertension is consistently above 130/80.", "why": ["Arteries narrow (plaque) or stiffen (age, trans fats, K2 deficiency)", "Excess sodium retains water → more blood volume", "Stress and stimulants make the heart pump harder", "Kidneys are the master regulator via fluid balance"], "sym": ["Usually none — the 'silent killer'", "Severe: headache, vision changes, nosebleeds"], "fix": ["Less sodium, more potassium (potato, dal)", "Exercise, stress reduction, magnesium"]}, {"n": "Thyroid", "what": "The thyroid sets whole-body metabolic speed via hormones T4 and T3. Low output (hypothyroidism) slows every cell.", "why": ["Iodine or selenium deficiency", "Autoimmune (Hashimoto's)"], "sym": ["Fatigue, weight gain, cold intolerance", "Brain fog, dry skin, hair loss"], "fix": ["Adequate iodine (iodised salt/seafood) + selenium (Brazil nuts)"]}]}]}, {"id": "digestive", "name": "Digestive", "blurb": "Acidity, constipation, diarrhoea, stones.", "blocks": [{"t": "term", "items": [{"n": "Acidity / Reflux (GERD)", "what": "Stomach acid (HCl) splashes up past the lower esophageal sphincter (LES) into the unprotected esophagus — the burning called heartburn.", "why": ["Overeating or lying down after meals", "Obesity, spicy/fatty/acidic foods", "Coffee, alcohol, stress; H. pylori"], "sym": ["Burning in chest/throat, sour taste", "Regurgitation, chronic cough, worse lying down"], "fix": ["Smaller meals, don't lie down after eating; treat — don't just mask (chronic reflux → Barrett's esophagus)"]}, {"n": "Constipation", "what": "Transit is too slow, so the colon absorbs too much water and stool turns hard and dry (fewer than 3 movements/week).", "why": ["Too little fibre or water", "Sedentary living, low magnesium", "Hypothyroidism, stress, certain meds"], "sym": ["Hard lumpy stools, straining", "Bloating, incomplete emptying"], "fix": ["The fibre–water–magnesium triangle solves most cases"]}, {"n": "Diarrhoea", "what": "The opposite — transit too fast, or the gut actively secreting water to flush an irritant. Three+ loose stools a day.", "why": ["Viral (rota/noro) or bacterial infection", "Food intolerance, IBS, antibiotics"], "sym": ["Loose watery stools", "Danger: dehydration + electrolyte loss"], "fix": ["Oral rehydration — water WITH sodium and potassium, not water alone"]}, {"n": "Kidney Stones", "what": "Hard mineral crystals that form when urine is too concentrated (80% are calcium-oxalate).", "why": ["Dehydration — urine too concentrated", "High sodium, high-oxalate foods, vitamin D excess without K2"], "sym": ["Severe cramping flank pain radiating to groin", "Blood in urine, nausea"], "fix": ["Drink 2.5–3 L water daily — the single best prevention"]}, {"n": "Gallstones", "what": "Hard deposits in the gallbladder, usually when bile holds too much cholesterol relative to bile salts (80% are cholesterol stones).", "why": ["High cholesterol in bile, obesity", "Rapid weight loss; estrogen; even very low-fat diets (bile stagnates)"], "sym": ["Sudden upper-right pain after fatty meals", "Radiates to right shoulder; jaundice if duct blocked"], "fix": ["Steady weight, regular meals with some fat so the gallbladder empties"]}]}]}, {"id": "inflammatory", "name": "Inflammatory & Respiratory", "blurb": "Sinusitis, asthma, arthritis, migraine.", "blocks": [{"t": "term", "items": [{"n": "Sinusitis", "what": "Inflammation of the sinuses; drainage blocks, mucus stagnates and can turn infected.", "why": ["Follows a cold or allergy", "Deviated septum, dry air, low immunity"], "sym": ["Facial pain/pressure, thick yellow-green mucus", "Blocked nose, reduced smell, headache"], "fix": ["Acute (<4 wks) usually post-cold; chronic (>12 wks) often allergic/structural"]}, {"n": "Asthma", "what": "Chronically hypersensitive airways that narrow (bronchospasm), swell and fill with mucus in response to triggers.", "why": ["Allergens, cold air, exercise, infection, smoke", "Genetic + early-environment (hygiene hypothesis)"], "sym": ["Wheezing, shortness of breath", "Chest tightness, night cough"], "fix": ["Vitamin D and omega-3 lower severity; magnesium relaxes airways (IV Mg used in severe attacks)"]}, {"n": "Arthritis", "what": "Joint inflammation — over 100 conditions, but two dominate: osteoarthritis (mechanical cartilage wear) and rheumatoid (autoimmune attack on the joint lining).", "why": ["OA: age, obesity, overuse, injury", "RA: genetic predisposition + immune trigger"], "sym": ["Joint pain, swelling, morning stiffness", "RA is symmetric + systemic (fatigue, fever)"], "fix": ["Omega-3 and vitamin D reduce inflammation; collagen (vitamin-C dependent) and Ca+K2 support joints"]}, {"n": "Migraine", "what": "A neurological condition — a wave of electrical activity (cortical spreading depression) triggers inflammation and vessel changes, not just a bad headache.", "why": ["Hormonal shifts, sleep disruption, dehydration, stress", "Trigger foods; magnesium deficiency is a top link"], "sym": ["Phases: prodrome → aura → throbbing one-sided headache → postdrome", "Nausea, light/sound sensitivity"], "fix": ["Magnesium, B2 (riboflavin) and CoQ10 all address the mitochondrial/vessel mechanisms"]}]}]}, {"id": "infections", "name": "Infections & Symptoms", "blurb": "Cold, viral illness, nausea, vertigo.", "blocks": [{"t": "term", "items": [{"n": "Common Cold", "what": "A viral infection of the nose and throat — 200+ viruses, mostly rhinovirus. The symptoms are your immune response expelling the virus, not the virus itself.", "why": ["Low vitamin D, zinc or vitamin C", "Poor sleep, high stress (cortisol suppresses immunity)"], "sym": ["Runny/blocked nose, sneezing", "Sore throat, mild fever, fatigue"], "fix": ["No cure — resolves in 7–10 days; vitamin C, zinc, rest, hydration support the response"]}, {"n": "Viral Infections (category)", "what": "A virus is genetic material in a protein shell — not truly alive. It can't reproduce alone; it hijacks your cells' machinery.", "why": ["Enters, injects genes, forces cells to copy it", "Spreads until the immune system mounts a response"], "sym": ["Depends on the virus (cold, flu, COVID, etc.)", "Symptoms are mostly the immune response"], "fix": ["Antibiotics don't work — they target bacterial structures viruses lack. Immunity/vaccines build memory B cells"]}, {"n": "Nausea", "what": "A symptom, not a disease — the urge to vomit, generated by the brainstem's vomiting centre. Vomiting is a protective reflex to expel a suspected toxin.", "why": ["Gut distress signals via the vagus nerve", "Vestibular mismatch (motion sickness), migraine, chemicals, anxiety"], "sym": ["Queasiness, urge to vomit"], "fix": ["Treat the cause; address the underlying trigger"]}, {"n": "Vertigo", "what": "A false sensation of spinning, distinct from dizziness. Balance comes from inner ear + eyes + joint sensors; when they conflict, you get vertigo.", "why": ["BPPV — dislodged inner-ear calcium crystals (most common)", "Vestibular neuritis, Meniere's, migraine-associated"], "sym": ["Spinning triggered by head movement", "Nausea, balance trouble, nystagmus"], "fix": ["BPPV responds excellently to the Epley maneuver — often 1–2 sessions"]}]}]}]}, {"id": "gym", "name": "Gym / Body Comp", "icon": "🏋️", "intro": "Calories, macros, and training — how to lose fat, build muscle, and recomposition, applied to a veg + eggs diet.", "topics": [{"id": "bigpicture", "name": "The big picture", "blurb": "Calories set direction; protein + training set what you become.", "blocks": [{"t": "p", "x": "Your body runs on an <b>energy budget</b>. Eat under it and you shrink; eat over it and you grow. <b>Which tissue</b> you gain or lose — fat or muscle — is decided by <b>protein</b> and <b>resistance training</b>, not by the calories alone."}, {"t": "fig", "gen": "genGraph", "cap": "The master switch: energy balance sets gain vs lose; protein + training set muscle vs fat.", "args": [[{"id": "in", "x": 0.09, "y": 0.42, "label": "Calories\nIN", "fill": "#4f46e5", "w": 96, "h": 52}, {"id": "out", "x": 0.34, "y": 0.42, "label": "Calories OUT\n(TDEE)", "fill": "#64748b", "w": 120, "h": 52}, {"id": "gap", "x": 0.58, "y": 0.42, "label": "The gap", "fill": "#d97706", "shape": "diamond", "w": 104, "h": 64}, {"id": "lose", "x": 0.88, "y": 0.2, "label": "LOSE\nweight", "fill": "#ea580c", "w": 96, "h": 50}, {"id": "gain", "x": 0.88, "y": 0.62, "label": "GAIN\nweight", "fill": "#16a34a", "w": 96, "h": 50}, {"id": "qual", "x": 0.34, "y": 0.86, "label": "Protein +\nTraining", "fill": "#db2777", "w": 120, "h": 50}], [{"from": "in", "to": "out"}, {"from": "out", "to": "gap"}, {"from": "gap", "to": "lose", "label": "deficit", "color": "#ea580c", "lc": "#ea580c"}, {"from": "gap", "to": "gain", "label": "surplus", "color": "#16a34a", "lc": "#16a34a"}, {"from": "qual", "to": "lose", "label": "keep muscle", "color": "#db2777", "lc": "#db2777", "curve": 40, "dash": "5 4"}, {"from": "qual", "to": "gain", "label": "build muscle", "color": "#db2777", "lc": "#db2777", "dash": "5 4"}], {"w": 700, "h": 420}]}, {"t": "call", "x": "<b>The one cue.</b> Calories = direction. Protein + lifting = quality. Everything else is detail."}, {"t": "h", "x": "The territory, one map"}, {"t": "fig", "gen": "genMindMap", "cap": "Five systems: energy balance, macros, training, fiber & micros, and the goals they combine into.", "args": ["Nutrition", [{"label": "Energy balance", "children": ["TDEE", "Deficit", "Surplus"]}, {"label": "Macros", "children": ["Protein", "Carbs", "Fat"]}, {"label": "Training", "children": ["Tension", "Overload", "Recovery"]}, {"label": "Fiber & micros", "children": ["Gut", "Satiety", "Vitamins"]}, {"label": "Goals", "children": ["Cut", "Recomp", "Lean gain"]}], {"w": 800, "h": 560}]}, {"t": "cards", "items": [{"h": "Direction — energy balance", "x": "Intake vs TDEE. Deficit → lose, surplus → gain. The non-negotiable law."}, {"h": "Quality — protein + training", "x": "Tell the body to keep/build muscle while the scale moves."}, {"h": "Health floor — fiber & micros", "x": "Gut, satiety, and the vitamins/minerals that keep the machine running."}]}]}, {"id": "themath", "name": "The math / accounting", "blurb": "Where every calorie goes, and how muscle is actually built.", "blocks": [{"t": "p", "x": "One misconception hides in “protein calories build muscle.” The fix: <b>energy is fungible; material is not.</b> Every macro has two jobs — a <b>fuel</b> role (calories → one shared ATP pool that powers anything) and a <b>material</b> role (bricks that are macro-specific: only protein makes muscle)."}, {"t": "h", "x": "The whole picture — one map, start to end"}, {"t": "fig", "gen": "genFlowMap", "cap": "The whole loop: food digests to glucose / amino acids / fatty acids; insulin (fed) promotes storage and blocks fat-burn (so dietary fat is stored); glucose burns for ATP or fills glycogen; protein builds muscle only if a training signal is present, else it's burned; in a deficit the stores reverse and feed the fuel pool. A living map — we keep making it more exhaustive."}, {"t": "fig", "gen": "genGraph", "cap": "Energy from every macro pours into ONE shared fuel pool (fungible). Building blocks are separate and macro-specific. In - out = change in stores.", "args": [[{"id": "cin", "x": 0.5, "y": 0.12, "label": "Calories in\n4P + 4C + 9F", "fill": "#1c2431", "w": 168, "h": 54}, {"id": "fuel", "x": 0.27, "y": 0.45, "label": "Fuel pool\n(fungible)", "fill": "#9333ea", "w": 150, "h": 52}, {"id": "brick", "x": 0.73, "y": 0.45, "label": "Building blocks\n(material)", "fill": "#16a34a", "w": 160, "h": 52}, {"id": "spent", "x": 0.27, "y": 0.82, "label": "Spent\nBMR·NEAT·TEF·train", "fill": "#64748b", "w": 184, "h": 52}, {"id": "stored", "x": 0.73, "y": 0.82, "label": "Stored\nmuscle·glycogen·fat", "fill": "#64748b", "w": 184, "h": 52}], [{"from": "cin", "to": "fuel"}, {"from": "cin", "to": "brick"}, {"from": "fuel", "to": "spent"}, {"from": "brick", "to": "stored"}], {"w": 700, "h": 430}]}, {"t": "call", "x": "<b>The equations.</b> Intake: C_in = 4·P + 4·C + 9·F. Out: C_out = BMR + TEF + NEAT + training. Balance: <b>C_in − C_out = Δstored</b>, where Δstored = 9·Δfat + 4·Δglycogen + 4·Δmuscle-protein (water ≈ 0 kcal). Nothing overrides this line."}, {"t": "h", "x": "How the split is decided (fuel vs building blocks)"}, {"t": "p", "x": "It is <b>not sequential</b> — the fuel pool doesn’t take its share for the day and hand leftovers to storage. Allocation runs <b>continuously and in parallel</b>: at any instant some cells burn glucose while others store it. Three live dials decide the split — <b>cellular energy charge</b>, <b>hormones (insulin vs glucagon)</b>, and <b>tissue demand + tank space</b>."}, {"t": "fig", "gen": "genGraph", "cap": "Allocation is live, not a daily queue: hormones + each cell's energy need + tank space decide the split minute-by-minute. Muscle only grabs amino acids when training flips its switch on.", "args": [[{"id": "sw", "x": 0.5, "y": 0.07, "label": "Master switch\ninsulin = store · glucagon = burn", "fill": "#1c2431", "shape": "rect", "w": 330, "h": 48}, {"id": "ch", "x": 0.17, "y": 0.3, "label": "Carbs\n→ glucose", "fill": "#0891b2", "w": 150, "h": 50}, {"id": "c1", "x": 0.17, "y": 0.52, "label": "1 · burn for ATP", "fill": "#0891b2", "w": 158, "h": 46}, {"id": "c2", "x": 0.17, "y": 0.72, "label": "2 · glycogen\nsmall tank", "fill": "#0891b2", "w": 158, "h": 52}, {"id": "c3", "x": 0.17, "y": 0.93, "label": "3 · overflow → fat\nsurplus only", "fill": "#0891b2", "w": 168, "h": 52}, {"id": "ph", "x": 0.5, "y": 0.3, "label": "Protein\n→ amino acids", "fill": "#db2777", "w": 160, "h": 50}, {"id": "p1", "x": 0.5, "y": 0.52, "label": "1 · build proteins\nif training", "fill": "#db2777", "w": 168, "h": 52}, {"id": "p2", "x": 0.5, "y": 0.72, "label": "2 · burn / → glucose", "fill": "#db2777", "w": 168, "h": 46}, {"id": "p3", "x": 0.5, "y": 0.93, "label": "no storage tank\nuse it or lose it", "fill": "#64748b", "w": 168, "h": 52}, {"id": "fh", "x": 0.83, "y": 0.3, "label": "Fat\n→ fatty acids", "fill": "#ea580c", "w": 150, "h": 50}, {"id": "f1", "x": 0.83, "y": 0.52, "label": "1 · structural\nsmall, ongoing", "fill": "#ea580c", "w": 158, "h": 52}, {"id": "f2", "x": 0.83, "y": 0.72, "label": "2 · store\nfed / insulin", "fill": "#ea580c", "w": 158, "h": 52}, {"id": "f3", "x": 0.83, "y": 0.93, "label": "3 · burn\ndeficit / fasted", "fill": "#ea580c", "w": 158, "h": 52}], [{"from": "sw", "to": "ch"}, {"from": "sw", "to": "ph"}, {"from": "sw", "to": "fh"}, {"from": "ch", "to": "c1"}, {"from": "c1", "to": "c2"}, {"from": "c2", "to": "c3"}, {"from": "ph", "to": "p1"}, {"from": "p1", "to": "p2"}, {"from": "p2", "to": "p3"}, {"from": "fh", "to": "f1"}, {"from": "f1", "to": "f2"}, {"from": "f2", "to": "f3"}], {"w": 700, "h": 600}]}, {"t": "cards", "items": [{"h": "Dial 1 · energy charge", "x": "Each cell senses its own ATP. Low (AMPK) → burn incoming fuel now. High (mTOR) → store or build."}, {"h": "Dial 2 · insulin", "x": "Fed → insulin rises = store &amp; build, and it switches fat-burning OFF. Fasted/deficit → glucagon/adrenaline = mobilise &amp; burn."}, {"h": "Dial 3 · tank + demand", "x": "Glycogen = small fixed tank (fills fast, overflows). Fat = near-unlimited. Muscle protein = NO tank — build now or the amino acids get burned."}]}, {"t": "call", "x": "<b>Each store has its own bricks AND its own switch:</b> glycogen ← glucose (switch: insulin + empty tank) · fat ← fatty acids / excess (switch: insulin / surplus) · muscle ← amino acids (switch: <b>training</b>). That last one is why the same protein becomes muscle in a trained person and fuel in an untrained one."}, {"t": "h", "x": "Building muscle = bricks + labour"}, {"t": "fig", "gen": "genGraph", "cap": "Two things build muscle: BRICKS (amino acids, only from protein) + LABOUR (ATP, from the shared pool - mostly carbs/fat).", "args": [[{"id": "prot", "x": 0.12, "y": 0.32, "label": "Dietary\nprotein", "fill": "#db2777", "w": 120, "h": 50}, {"id": "aa", "x": 0.4, "y": 0.32, "label": "Amino\nacids", "fill": "#db2777", "w": 110, "h": 50}, {"id": "musc", "x": 0.72, "y": 0.32, "label": "Muscle\nprotein", "fill": "#16a34a", "w": 130, "h": 50}, {"id": "atp", "x": 0.4, "y": 0.82, "label": "ATP\n(carbs/fat)", "fill": "#9333ea", "w": 150, "h": 50}], [{"from": "prot", "to": "aa"}, {"from": "aa", "to": "musc"}, {"from": "atp", "to": "musc", "label": "powers", "color": "#9333ea", "lc": "#9333ea"}], {"w": 700, "h": 360}]}, {"t": "call", "x": "<b>Why 140 g protein ≠ 140 g muscle.</b> 1 kg of muscle ≈ 200 g protein + 750 g water. Gaining a strong 0.5 kg/month = ~100 g protein/month ≈ <b>~3 g/day</b> actually deposited. The rest of your intake is burned for fuel or recycled into other proteins — you eat the big number to keep MPS maxed and cover inefficiency, not because muscle costs that much material."}, {"t": "h", "x": "What training actually burns"}, {"t": "fig", "gen": "genSpectrum", "cap": "A working set (10s-2min) runs mostly on muscle glycogen = carbohydrate. Fat contributes at rest/after, not during the set.", "args": ["0-10 s · instant", "rest / after", [{"pos": 0.06, "label": "ATP-PC", "color": "#9333ea"}, {"pos": 0.4, "label": "Glycogen\n(carbs)", "color": "#0891b2"}, {"pos": 0.9, "label": "Fat", "color": "#ea580c"}], {"w": 780, "h": 300, "title": "Fuel during a lift, by set duration"}]}, {"t": "cards", "items": [{"h": "“Protein calories go into muscle” — half right", "x": "The amino-acid <b>material</b> that’s net-retained becomes muscle (and stores ~4 kcal/g). But the <b>energy</b> to build it is ATP from carbs/fat, and most protein you eat is burned or recycled — not deposited."}, {"h": "“Training burns carbohydrate” — correct", "x": "Lifting is fuelled by phosphocreatine then muscle glycogen (carbs). Fat/protein contribute little <b>during</b> the sets."}]}, {"t": "call", "x": "<b>Unified model.</b> One shared energy pool (calories in from any macro, calories out for everything incl. training) · separate macro-specific bricks (only protein makes muscle) · net muscle = MPS − MPB, protein supplies bricks, carbs/fat pay the ATP labour bill."}]}, {"id": "energy", "name": "Energy balance", "blurb": "Intake vs TDEE - the law of direction.", "blocks": [{"t": "p", "x": "Your weight is a running total of <b>energy in</b> (food) minus <b>energy out</b> (everything you burn, called <b>TDEE</b>). The gap, over time, is what changes on the scale."}, {"t": "h", "x": "Where your daily burn actually goes"}, {"t": "fig", "gen": "genTreemap", "cap": "BMR (staying alive) dominates; NEAT (daily movement) is the swing factor; TEF is the digestion tax, highest for protein.", "args": [[{"label": "BMR — staying alive", "weight": 65, "color": "#4f46e5"}, {"label": "NEAT — daily movement", "weight": 15, "color": "#16a34a"}, {"label": "EAT — exercise", "weight": 10, "color": "#9333ea"}, {"label": "TEF — digestion", "weight": 10, "color": "#db2777"}], {"w": 700, "h": 420}]}, {"t": "h", "x": "The one dial: deficit ↔ surplus"}, {"t": "fig", "gen": "genSpectrum", "cap": "Where you sit vs maintenance sets direction; the size of the gap sets speed (and collateral muscle/fat).", "args": ["DEFICIT · lose", "SURPLUS · gain", [{"pos": 0.1, "label": "Aggressive cut\n-25%", "color": "#ea580c"}, {"pos": 0.3, "label": "Cut\n-15/20%", "color": "#ea580c"}, {"pos": 0.5, "label": "Maintenance", "color": "#1c2431"}, {"pos": 0.72, "label": "Lean gain\n+10%", "color": "#16a34a"}, {"pos": 0.92, "label": "Dirty bulk\n+25%", "color": "#d97706"}], {"w": 780, "h": 280, "title": "Size of the gap = speed"}]}, {"t": "cards", "items": [{"h": "~7,700 kcal", "x": "≈ 1 kg of body fat."}, {"h": "−500 / day", "x": "≈ 0.5 kg fat lost per week."}, {"h": "+250 / day", "x": "a lean-gain surplus — slow, clean."}]}, {"t": "h", "x": "How the calories you eat get spent"}, {"t": "fig", "gen": "genSankey", "cap": "At maintenance, intake is fully spent on these. Surplus is stored; a deficit is pulled from fat (and muscle if protein/training are missing).", "args": ["Calories eaten", [{"label": "Basal / organs (BMR)", "value": 65, "color": "#4f46e5"}, {"label": "Everyday movement (NEAT)", "value": 15, "color": "#16a34a"}, {"label": "Exercise (EAT)", "value": 10, "color": "#9333ea"}, {"label": "Digestion (TEF)", "value": 10, "color": "#db2777"}], {"w": 740, "h": 420}]}, {"t": "call", "x": "<b>Common trap.</b> The “out” side isn’t fixed — eat less for weeks and NEAT quietly drops and BMR eases down. That’s the plateau, and why crash deficits stall."}]}, {"id": "maintenance", "name": "Maintenance & activity", "blurb": "The intake where weight holds - your anchor number.", "blocks": [{"t": "p", "x": "“Maintenance calories” = the intake where your weight holds. It’s your <b>BMR</b> scaled up by how much you move. Nail this and every goal is just “this ± a bit.”"}, {"t": "h", "x": "How to build the number"}, {"t": "fig", "gen": "genGraph", "cap": "Body stats -> BMR (Mifflin-St Jeor) -> x activity multiplier -> TDEE / maintenance.", "args": [[{"id": "w", "x": 0.08, "y": 0.2, "label": "Weight", "fill": "#64748b", "w": 92, "h": 40}, {"id": "ht", "x": 0.08, "y": 0.5, "label": "Height", "fill": "#64748b", "w": 92, "h": 40}, {"id": "a", "x": 0.08, "y": 0.8, "label": "Age · sex", "fill": "#64748b", "w": 92, "h": 40}, {"id": "bmr", "x": 0.42, "y": 0.5, "label": "BMR", "fill": "#4f46e5", "w": 120, "h": 56}, {"id": "act", "x": 0.68, "y": 0.5, "label": "x Activity", "fill": "#d97706", "shape": "diamond", "w": 110, "h": 60}, {"id": "tdee", "x": 0.9, "y": 0.5, "label": "TDEE\n(maintenance)", "fill": "#16a34a", "w": 120, "h": 56}], [{"from": "w", "to": "bmr"}, {"from": "ht", "to": "bmr"}, {"from": "a", "to": "bmr"}, {"from": "bmr", "to": "act"}, {"from": "act", "to": "tdee"}], {"w": 700, "h": 400}]}, {"t": "cards", "items": [{"h": "BMR (men) = 10·kg + 6.25·cm − 5·age + 5", "x": "Women use −161 instead of +5. This is the “engine idling” cost before any movement."}]}, {"t": "h", "x": "Activity raises the number"}, {"t": "fig", "gen": "genSpectrum", "cap": "Pick honestly. Most desk-workers who train 3-4x/week are ~1.4-1.55, not 1.7.", "args": ["1.2 · sedentary", "1.9 · athlete", [{"pos": 0.0, "label": "Desk, no gym\n1.2", "color": "#64748b"}, {"pos": 0.25, "label": "Light 1-3x\n1.375", "color": "#0891b2"}, {"pos": 0.5, "label": "Moderate 3-5x\n1.55", "color": "#16a34a"}, {"pos": 0.75, "label": "Hard 6-7x\n1.725", "color": "#9333ea"}, {"pos": 1.0, "label": "Physical job\n1.9", "color": "#d97706"}], {"w": 780, "h": 280, "title": "Over-picking is why a cut stalls"}]}, {"t": "call", "x": "<b>How activity adds calories.</b> A hard gym hour ≈ 300–500 kcal. The bigger lever is <b>NEAT</b> — steps, standing, fidgeting — which can swing 400–800 kcal/day. “Walk more” beats “cardio harder.”"}, {"t": "call", "x": "<b>Cue.</b> Estimate maintenance, then let the scale correct it: weigh daily, average weekly. Flat = found it; drifting = adjust ~150–200 kcal."}]}, {"id": "macros", "name": "Setting your macros", "blurb": "Protein, carbs, fat - and how to split them for a goal.", "blocks": [{"t": "p", "x": "Three nutrients carry energy: <b>protein</b>, <b>carbohydrate</b>, <b>fat</b>. Calories decide direction; <b>how you split these three</b> decides whether you keep muscle, train well, and feel full."}, {"t": "cards", "items": [{"h": "Protein — 4 kcal/g", "x": "Builds & repairs; most filling."}, {"h": "Carbs — 4 kcal/g", "x": "Training fuel."}, {"h": "Fat — 9 kcal/g", "x": "Dense; runs hormones."}]}, {"t": "h", "x": "What each macro is for"}, {"t": "fig", "gen": "genMindMap", "cap": "Fixed colours: protein = rose, carbs = cyan, fat = orange.", "args": ["Macros", [{"label": "Protein", "children": ["Amino acids", "Muscle (MPS)", "Satiety", "High TEF"]}, {"label": "Carbs", "children": ["Glucose", "Glycogen", "Fuel", "Fiber"]}, {"label": "Fat", "children": ["Hormones", "Cell walls", "Vit A/D/E/K", "Essential FAs"]}], {"w": 780, "h": 560}]}, {"t": "h", "x": "How you set them (order of operations)"}, {"t": "p", "x": "Never chase percentages first — they float with your calorie total. Anchor protein & fat to <b>bodyweight in grams</b>; carbs get the rest."}, {"t": "fig", "gen": "genGraph", "cap": "Lock protein -> set a fat floor -> carbs fill the rest. The % is a read-out, not the plan.", "args": [[{"id": "pr", "x": 0.12, "y": 0.5, "label": "1 · Protein\ng per kg", "fill": "#db2777", "w": 120, "h": 56}, {"id": "ft", "x": 0.38, "y": 0.5, "label": "2 · Fat\nfloor g/kg", "fill": "#ea580c", "w": 120, "h": 56}, {"id": "cb", "x": 0.63, "y": 0.5, "label": "3 · Carbs\nremainder", "fill": "#0891b2", "w": 120, "h": 56}, {"id": "pct", "x": 0.88, "y": 0.5, "label": "4 · % =\nread-out", "fill": "#1c2431", "shape": "rect", "w": 110, "h": 56}], [{"from": "pr", "to": "ft"}, {"from": "ft", "to": "cb"}, {"from": "cb", "to": "pct"}], {"w": 720, "h": 220}]}, {"t": "table", "head": ["Macro", "Set it to", "Why", "Veg + egg sources"], "rows": [["Protein", "1.6–2.2 g/kg", "Protects/builds muscle; most filling; highest TEF", "eggs, milk, paneer, dal, soy, whey"], ["Carbs", "the remainder", "Training fuel; spares protein; fiber lives here", "rice, roti, oats, potato, fruit"], ["Fat", "0.6–1.0 g/kg floor", "Hormones, cell walls, absorbs vit A/D/E/K", "eggs, peanuts, PB, oil, milk"]]}, {"t": "h", "x": "Protein — the mechanism"}, {"t": "fig", "gen": "genGraph", "cap": "Protein -> amino acids -> MPS. You grow when MPS outpaces breakdown (MPB); training + protein tilt it.", "args": [[{"id": "prot", "x": 0.08, "y": 0.55, "label": "Protein\n(food)", "fill": "#db2777", "w": 100, "h": 50}, {"id": "aa", "x": 0.32, "y": 0.55, "label": "Amino\nacids", "fill": "#64748b", "w": 92, "h": 50}, {"id": "train", "x": 0.32, "y": 0.14, "label": "Training", "fill": "#9333ea", "w": 100, "h": 44}, {"id": "mps", "x": 0.6, "y": 0.3, "label": "MPS\nbuild", "fill": "#16a34a", "w": 96, "h": 48}, {"id": "mpb", "x": 0.6, "y": 0.8, "label": "MPB\nbreak", "fill": "#ea580c", "w": 96, "h": 48}, {"id": "net", "x": 0.9, "y": 0.55, "label": "Net\nmuscle", "fill": "#db2777", "w": 96, "h": 52}], [{"from": "prot", "to": "aa"}, {"from": "aa", "to": "mps"}, {"from": "aa", "to": "mpb", "dash": "4 4"}, {"from": "train", "to": "mps", "label": "signal", "color": "#9333ea", "lc": "#9333ea"}, {"from": "mps", "to": "net", "label": "+", "color": "#16a34a", "lc": "#16a34a"}, {"from": "mpb", "to": "net", "label": "-", "color": "#ea580c", "lc": "#ea580c"}], {"w": 720, "h": 420}]}, {"t": "call", "x": "<b>Veg lens · protein.</b> Plant proteins are often “incomplete” (dal low in methionine, rice/wheat low in lysine). Combine across the day (dal+rice, roti+milk) and it evens out. Eggs, milk, paneer, soy, whey are complete. Hitting ~140g on veg+egg is the real challenge — paneer/soy/whey are the easy levers."}, {"t": "h", "x": "Carbs — the mechanism"}, {"t": "fig", "gen": "genGraph", "cap": "Carbs -> glucose -> insulin stores it as glycogen or burns it now. Only a chronic surplus routes the excess to fat.", "args": [[{"id": "carb", "x": 0.08, "y": 0.5, "label": "Carbs", "fill": "#0891b2", "w": 92, "h": 48}, {"id": "glu", "x": 0.34, "y": 0.5, "label": "Glucose\n(blood)", "fill": "#64748b", "w": 100, "h": 50}, {"id": "gly", "x": 0.7, "y": 0.24, "label": "Glycogen\nfuel store", "fill": "#16a34a", "w": 110, "h": 50}, {"id": "burn", "x": 0.7, "y": 0.55, "label": "Burned\nnow", "fill": "#4f46e5", "w": 100, "h": 48}, {"id": "fat", "x": 0.86, "y": 0.86, "label": "Fat\n(surplus only)", "fill": "#ea580c", "w": 110, "h": 48}], [{"from": "carb", "to": "glu"}, {"from": "glu", "to": "gly", "label": "insulin", "color": "#d97706", "lc": "#d97706"}, {"from": "glu", "to": "burn", "label": "energy"}, {"from": "glu", "to": "fat", "label": "surplus only", "color": "#ea580c", "lc": "#ea580c", "dash": "4 4", "curve": 30}], {"w": 720, "h": 420}]}, {"t": "call", "x": "<b>Carbs are not the enemy.</b> Surplus calories make you fat, not carbs. Carbs fill glycogen so you train hard, and are “protein-sparing” — the body burns them instead of chewing up muscle."}, {"t": "h", "x": "Fat — quality over quantity"}, {"t": "fig", "gen": "genSpectrum", "cap": "Type is a spectrum: trans = harmful; unsaturated (nuts, oils, eggs) = protective; saturated from whole foods is fine in moderation.", "args": ["TRANS · avoid", "UNSATURATED · best", [{"pos": 0.05, "label": "Trans\nfried/packaged", "color": "#ea580c"}, {"pos": 0.34, "label": "Saturated\nmoderation", "color": "#d97706"}, {"pos": 0.68, "label": "Mono\nolive, peanuts", "color": "#16a34a"}, {"pos": 0.95, "label": "Poly · Omega-3\nfish, walnuts", "color": "#0891b2"}], {"w": 780, "h": 280}]}, {"t": "call", "x": "<b>Don’t cut fat too low.</b> Below ~0.5 g/kg, testosterone and other hormones suffer and you stop absorbing fat-s
