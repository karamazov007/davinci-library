<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 780"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#e6e8ee"/></pattern><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="780" fill="#f7f8fa"/><rect width="1200" height="780" fill="url(#dots)"/><path d="M795.0,180.0 Q563.5,93.2 332.0,180.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tip)" opacity="0.9"/><rect x="435.7" y="124.6" width="255.6" height="23" rx="6" fill="#fff" stroke="#e3e5ea"/><text x="563.5" y="140.6" text-anchor="middle" fill="#5b6270" font-size="12.5" font-family="Helvetica,Arial,sans-serif">spares fat (insulin blocks its burn)</text><path d="M291.3,242.6 Q346.7,449.3 514.9,581.5" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#tip)" opacity="0.9"/><rect x="283.4" y="418.7" width="183.0" height="23" rx="6" fill="#fff" stroke="#e3e5ea"/><text x="374.9" y="434.7" text-anchor="middle" fill="#5b6270" font-size="12.5" font-family="Helvetica,Arial,sans-serif">direct &amp; cheap (~3% lost)</text><path d="M902.6,247.5 Q897.9,341.4 974.4,396.2" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tip)" opacity="0.9"/><rect x="803.6" y="319.6" width="229.2" height="23" rx="6" fill="#fff" stroke="#e3e5ea"/><text x="918.2" y="335.6" text-anchor="middle" fill="#5b6270" font-size="12.5" font-family="Helvetica,Arial,sans-serif">only if glycogen full / fructose</text><path d="M940.4,497.9 Q763.0,495.7 636.1,619.5" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#tip)" opacity="0.9"/><rect x="707.2" y="515.2" width="136.8" height="23" rx="6" fill="#fff" stroke="#e3e5ea"/><text x="775.6" y="531.2" text-anchor="middle" fill="#5b