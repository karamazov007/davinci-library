<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 384"><text x="20.0" y="30.0" text-anchor="start" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">Three tiers of vegetarian protein — where to actually get it</text><rect x="20.0" y="54.0" width="700.0" height="92.0" rx="12" fill="#fdeef5" opacity="1.0"/><rect x="20.0" y="54.0" width="10.0" height="92.0" rx="0" fill="#db2777" opacity="1.0"/><text x="44.0" y="86.0" text-anchor="start" fill="#db2777" font-size="15" font-weight="800" font-family="Helvetica,Arial,sans-serif">THE ENGINE</text><text x="44.0" y="112.0" text-anchor="start" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">soy · paneer · eggs · whey · tofu · curd</text><text x="44.0" y="134.0" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-style="italic" font-family="Helvetica,Arial,sans-serif">Protein without the volume or the calories — put most of your protein here.</text><rect x="20.0" y="162.0" width="700.0" height="92.0" rx="12" fill="#eaf1fd" opacity="1.0"/><rect x="20.0" y="162.0" width="10.0" height="92.0" rx="0" fill="#2563eb" opacity="1.0"/><text x="44.0" y="194.0" text-anchor="start" fill="#2563eb" font-size="15" font-weight="800" font-family="Helvetica,Arial,sans-serif">THE SUPPORT</text><text x="44.0" y="220.0" text-anchor="start" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">dal · chana · rajma · moong · masoor</text><text x="44.0" y="242.0" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-style="italic" font-family="Helvetica,Arial,sans-serif">Real protein (~2 katori ≈ 18 g) but bulky &amp; carb-heavy — the base, not the whole meal.</text><rect x="20.0" y="270.0" width="700.0" height="92.0" rx="12" fill="#eef1f5" opacity="1.0"/><rect x="20.0" y="270.0" width="10.0" height="92.0" rx="0" fill="#64748b" opacity="1.0"/><text x="44.0" y="302.0" text-anchor="start" fill="#64748b" font-size="15" font-weight="800" font-family="Helvetica,Arial,sans-serif">DECORATIONS</text><text x="44.0" y="328.0" text-anchor="start" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">broccoli · green beans · green peas · most sabzi</text><text x="44.0" y="350.0" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-style="italic" font-family="Helvetica,Arial,sans-serif">Trace protein in a huge volume — eat for fibre &amp; fullness, never for protein.</text><text x="742" y="208.0" text-anchor="middle" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif" transform="rotate(-90 742 208.0)">protein density: high → low</text></svg>