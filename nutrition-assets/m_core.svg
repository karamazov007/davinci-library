<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 392"><text x="20.0" y="32.0" text-anchor="start" fill="#1c2431" font-size="15" font-weight="800" font-family="Helvetica,Arial,sans-serif">Your 3 daily non-negotiables</text><text x="20.0" y="52.0" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-family="Helvetica,Arial,sans-serif">eat these almost every day — everything else is optional</text><rect x="30.0" y="66.0" width="205.0" height="150.0" rx="14" fill="#ffffff" opacity="1" stroke="#ca8a04" stroke-width="1.6"/><rect x="44.0" y="80.0" width="58.0" height="20.0" rx="10" fill="#ca8a04" opacity="1.0"/><text x="73.0" y="94.0" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Helvetica,Arial,sans-serif">DAILY</text><text x="46.0" y="128.0" text-anchor="start" fill="#ca8a04" font-size="14.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">🥚 Eggs</text><text x="46.0" y="160.0" text-anchor="start" fill="#1c2431" font-size="20" font-weight="800" font-family="Helvetica,Arial,sans-serif">6 eggs</text><text x="46.0" y="184.0" text-anchor="start" fill="#ca8a04" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">~36 g protein</text><text x="46.0" y="205.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">safe · your floor</text><rect x="285.0" y="66.0" width="205.0" height="150.0" rx="14" fill="#ffffff" opacity="1" stroke="#16a34a" stroke-width="1.6"/><rect x="299.0" y="80.0" width="58.0" height="20.0" rx="10" fill="#16a34a" opacity="1.0"/><text x="328.0" y="94.0" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Helvetica,Arial,sans-serif">DAILY</text><text x="301.0" y="128.0" text-anchor="start" fill="#16a34a" font-size="14.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">🫘 Soya chunks</text><text x="301.0" y="160.0" text-anchor="start" fill="#1c2431" font-size="20" font-weight="800" font-family="Helvetica,Arial,sans-serif">40 g dry</text><text x="301.0" y="184.0" text-anchor="start" fill="#16a34a" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">~20 g protein</text><text x="301.0" y="205.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">cheap &amp; lean · ~Rs 12</text><rect x="540.0" y="66.0" width="205.0" height="150.0" rx="14" fill="#ffffff" opacity="1" stroke="#0891b2" stroke-width="1.6"/><rect x="554.0" y="80.0" width="58.0" height="20.0" rx="10" fill="#0891b2" opacity="1.0"/><text x="583.0" y="94.0" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Helvetica,Arial,sans-serif">SWAP</text><text x="556.0" y="128.0" text-anchor="start" fill="#0891b2" font-size="14.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">🧀 Paneer</text><text x="556.0" y="160.0" text-anchor="start" fill="#1c2431" font-size="20" font-weight="800" font-family="Helvetica,Arial,sans-serif">90–100 g</text><text x="556.0" y="184.0" text-anchor="start" fill="#0891b2" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">~18–20 g protein</text><text x="556.0" y="205.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">a few days/wk · ~Rs 35</text><circle cx="515" cy="141" r="17" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="515.0" y="146.0" text-anchor="middle" fill="#7c3aed" font-size="15" font-weight="800" font-family="Helvetica,Arial,sans-serif">⇄</text><text x="515.0" y="178.0" text-anchor="middle" fill="#7c3aed" font-size="9.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">some days</text><rect x="30.0" y="238.0" width="715.0" height="48.0" rx="12" fill="#f7f8fa" opacity="1" stroke="#eef0f4" stroke-width="1"/><text x="387.0" y="259.0" text-anchor="middle" fill="#1c2431" font-size="12" font-weight="600" font-family="Helvetica,Arial,sans-serif">6 eggs (36) + 40 g soya (20) + whey + 300 ml milk (34) + dal &amp; staples (~40)</text><text x="387.0" y="277.0" text-anchor="middle" fill="#db2777" font-size="13" font-weight="800" font-family="Helvetica,Arial,sans-serif">≈ 140 g protein / day</text><rect x="30.0" y="300.0" width="715.0" height="50.0" rx="12" fill="#fdeef5" opacity="1" stroke="#db2777" stroke-width="1"/><text x="387.0" y="322.0" text-anchor="middle" fill="#9f1239" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">Everything else — sabzi · salad · fruit — is DECORATION</text><text x="387.0" y="340.0" text-anchor="middle" fill="#5b6572" font-size="11" font-weight="400" font-family="Helvetica,Arial,sans-serif">eat it for fibre &amp; fullness, never for protein</text></svg>