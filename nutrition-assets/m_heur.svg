<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 566"><text x="20.0" y="32.0" text-anchor="start" fill="#1c2431" font-size="14" font-weight="700" font-family="Helvetica,Arial,sans-serif">Heuristics — the thinking behind the plan</text><rect x="20.0" y="52.0" width="350.0" height="238.0" rx="12" fill="#fdf2f8" opacity="1" stroke="#db2777" stroke-width="1.3"/><text x="40.0" y="82.0" text-anchor="start" fill="#db2777" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">PROTEIN</text><line x1="40" y1="92" x2="350" y2="92" stroke="#db2777" stroke-width="1" opacity="0.4"/><circle cx="44" cy="112" r="3.2" fill="#db2777"/><text x="56.0" y="116.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Each meal ≈ 35–40 g (1–2 sources)</text><circle cx="44" cy="145" r="3.2" fill="#db2777"/><text x="56.0" y="149.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Lunch &amp; dinner ALWAYS get a protein add-on</text><circle cx="44" cy="178" r="3.2" fill="#db2777"/><text x="56.0" y="182.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Daily total rules (~1.6–2.2 g/kg)</text><circle cx="44" cy="211" r="3.2" fill="#db2777"/><text x="56.0" y="215.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Per-meal ceiling ~0.4 g/kg (~27 g) → spread</text><circle cx="44" cy="244" r="3.2" fill="#db2777"/><text x="56.0" y="248.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Protein = fixed rail; carbs &amp; fat flex</text><rect x="390.0" y="52.0" width="350.0" height="238.0" rx="12" fill="#f5f0fe" opacity="1" stroke="#7c3aed" stroke-width="1.3"/><text x="410.0" y="82.0" text-anchor="start" fill="#7c3aed" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">ENERGY &amp; GOALS</text><line x1="410" y1="92" x2="720" y2="92" stroke="#7c3aed" stroke-width="1" opacity="0.4"/><circle cx="414" cy="112" r="3.2" fill="#7c3aed"/><text x="426.0" y="116.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Maintenance ≈ bodyweight(kg) × 30–33</text><circle cx="414" cy="145" r="3.2" fill="#7c3aed"/><text x="426.0" y="149.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Lean bulk ×1.10  ·  cut ×0.80</text><circle cx="414" cy="178" r="3.2" fill="#7c3aed"/><text x="426.0" y="182.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">The weekly scale is the real calculator</text><circle cx="414" cy="211" r="3.2" fill="#7c3aed"/><text x="426.0" y="215.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Calories = direction; protein+train = tissue</text><circle cx="414" cy="244" r="3.2" fill="#7c3aed"/><text x="426.0" y="248.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Definition = body-fat %, not scale weight</text><rect x="20.0" y="308.0" width="350.0" height="238.0" rx="12" fill="#eefaf0" opacity="1" stroke="#16a34a" stroke-width="1.3"/><text x="40.0" y="338.0" text-anchor="start" fill="#16a34a" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">FOOD QUALITY</text><line x1="40" y1="348" x2="350" y2="348" stroke="#16a34a" stroke-width="1" opacity="0.4"/><circle cx="44" cy="368" r="3.2" fill="#16a34a"/><text x="56.0" y="372.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Complete: egg · milk · whey · paneer · soy</text><circle cx="44" cy="401" r="3.2" fill="#16a34a"/><text x="56.0" y="405.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Combine dal + rice/roti (completes plants)</text><circle cx="44" cy="434" r="3.2" fill="#16a34a"/><text x="56.0" y="438.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Add-ons: no-cook · batch · quick (30 min/wk)</text><circle cx="44" cy="467" r="3.2" fill="#16a34a"/><text x="56.0" y="471.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Seeds/nuts = micros + omega-3 (measure)</text><circle cx="44" cy="500" r="3.2" fill="#16a34a"/><text x="56.0" y="504.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">PB on bread · curd ~50 g · muesli low-sugar</text><rect x="390.0" y="308.0" width="350.0" height="238.0" rx="12" fill="#eef4fd" opacity="1" stroke="#2563eb" stroke-width="1.3"/><text x="410.0" y="338.0" text-anchor="start" fill="#2563eb" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">TRAINING &amp; RECOVERY</text><line x1="410" y1="348" x2="720" y2="348" stroke="#2563eb" stroke-width="1" opacity="0.4"/><circle cx="414" cy="368" r="3.2" fill="#2563eb"/><text x="426.0" y="372.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Progressive overload drives growth</text><circle cx="414" cy="401" r="3.2" fill="#2563eb"/><text x="426.0" y="405.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Sleep = the anabolic window</text><circle cx="414" cy="434" r="3.2" fill="#2563eb"/><text x="426.0" y="438.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Surplus funds the build; maintenance = stuck</text><circle cx="414" cy="467" r="3.2" fill="#2563eb"/><text x="426.0" y="471.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Two dials: cut to reveal, build to grow</text><circle cx="414" cy="500" r="3.2" fill="#2563eb"/><text x="426.0" y="504.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">Food can't fix a flat training stimulus</text></svg>