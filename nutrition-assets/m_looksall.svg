ont-family="Helvetica,Arial,sans-serif">200 g · 2 katori</text><text x="167.0" y="415.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Rajma</text><rect x="175.0" y="402.0" width="213.9" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="396.9" y="415.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">200 g · 2 katori</text><text x="167.0" y="445.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Tofu</text><rect x="175.0" y="432.0" width="240.6" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="423.6" y="445.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">225 g · ~225 g</text><text x="167.0" y="475.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Dal (cooked)</text><rect x="175.0" y="462.0" width="246.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="429.0" y="475.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">230 g · 2 katori</text><text x="167.0" y="505.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Moong (cooked)</text><rect x="175.0" y="492.0" width="278.1" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="461.1" y="505.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">260 g · 2½ katori</text><text x="167.0" y="535.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Green peas</text><rect x="175.0" y="522.0" width="385.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="568.0" y="535.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">360 g · 3+ katori</text><text x="20.0" y="582.0" text-anchor="start" fill="#9f1239" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Same 18 g everywhere: whey/soy need a handful; legumes need ~2 katori; green peas need 3+ katori. Concentrated = less food, fewer calories.</text></svg>