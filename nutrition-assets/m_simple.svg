ext><text x="704.0" y="145.0" text-anchor="end" fill="#db2777" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">~34 g</text><rect x="20.0" y="176.0" width="720.0" height="52.0" rx="10" fill="#f7f8fa" opacity="1" stroke="#eef0f4" stroke-width="1"/><text x="36.0" y="207.0" text-anchor="start" fill="#1c2431" font-size="12.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Lunch</text><rect x="150.0" y="191.0" width="70.0" height="22.0" rx="11" fill="#fdf0d9" opacity="1" stroke="#a15a12" stroke-width="1"/><text x="185.0" y="206.0" text-anchor="middle" fill="#a15a12" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif">ADD</text><text x="250.0" y="207.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">rice · dal   +   soy chunks 30 g</text><text x="704.0" y="207.0" text-anchor="end" fill="#db2777" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">~32 g</text><rect x="20.0" y="238.0" width="720.0" height="52.0" rx="10" fill="#f7f8fa" opacity="1" stroke="#eef0f4" stroke-width="1"/><text x="36.0" y="269.0" text-anchor="start" fill="#1c2431" font-size="12.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Dinner</text><rect x="150.0" y="253.0" width="70.0" height="22.0" rx="11" fill="#fdf0d9" opacity="1" stroke="#a15a12" stroke-width="1"/><text x="185.0" y="268.0" text-anchor="middle" fill="#a15a12" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif">ADD</text><text x="250.0" y="269.0" text-anchor="start" fill="#1c2431" font-size="11.5" font-weight="400" font-family="Helvetica,Arial,sans-serif">roti · veg · mango   +   3 eggs</text><text x="704.0" y="269.0" text-anchor="end" fill="#db2777" font-size="12.5" font-weight="800" font-family="Helvetica,Arial,sans-serif">~31 g</text><rect x="120.0" y="306.0" width="520.0" height="50.0" rx="12" fill="#f5f0fe" opacity="1" stroke="#7c3aed" stroke-width="1.3