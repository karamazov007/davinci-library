<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 386"><text x="20.0" y="30.0" text-anchor="start" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">Cost per gram of protein (Rs) — soy is the champion, Greek yogurt the priciest</text><text x="20.0" y="50.0" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-family="Helvetica,Arial,sans-serif">shorter bar = more protein per rupee</text><text x="202.0" y="83.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Soy chunks</text><rect x="210.0" y="70.0" width="40.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="258.0" y="83.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Rs 0.5/g</text><text x="202.0" y="117.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Chana / rajma (dry)</text><rect x="210.0" y="104.0" width="44.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="262.0" y="117.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Rs 0.55/g</text><text x="202.0" y="151.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Peanuts</text><rect x="210.0" y="138.0" width="48.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="266.0" y="151.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">Rs 0.6/g</text><text x="202.0" y="185.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Dal (dry)</text><rect x="210.0" y="172.0" width="52.0" height="18.0" rx="4" fill="#16a34a" opacity="1.0"/><text x="270.0" y="185.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Hel