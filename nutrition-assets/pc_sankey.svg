<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 540"><rect x="64.0" y="70.0" width="26" height="346.8" rx="3" fill="#64748b"/><text x="77.0" y="44.0" text-anchor="middle" fill="#1c2431" font-size="13" font-weight="700" font-family="Helvetica,Arial,sans-serif">136 g</text><text x="77.0" y="59.0" text-anchor="middle" fill="#5b6572" font-size="11" font-weight="400" font-family="Helvetica,Arial,sans-serif">eaten / day</text><rect x="330.0" y="70.0" width="26" height="86.7" rx="3" fill="#16A34A"/><rect x="330.0" y="168.7" width="26" height="260.1" rx="3" fill="#2563EB"/><path d="M90.0,70.0 C210.0,70.0 210.0,70.0 330.0,70.0 L330.0,156.7 C210.0,156.7 210.0,156.7 90.0,156.7 Z" fill="#16A34A" opacity="0.42"/><path d="M90.0,156.7 C210.0,156.7 210.0,168.7 330.0,168.7 L330.0,428.8 C210.0,428.8 210.0,416.8 90.0,416.8 Z" fill="#2563EB" opacity="0.42"/><text x="364.0" y="111.3" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Gut + liver</text><text x="364.0" y="127.3" text-anchor="start" fill="#5b6572" font-size="11" font-weight="400" font-family="Helvetica,Arial,sans-serif">first-pass · 34 g</text><text x="364.0" y="186.7" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Into the body · 102 g</text><rect x="560.0" y="70.0" width="26" height="86.7" rx="3" fill="#16A34A"/><rect x="560.0" y="168.7" width="26" height="153.0" rx="3" fill="#D97706"/><rect x="560.0" y="333.7" width="26" height="71.4" rx="3" fill="#2563EB"/><rect x="560.0" y="417.1" width="26" height="28.1" rx="3" fill="#7C3AED"/><rect x="560.0" y="457.1" width="26" height="7.6" rx="3" fill="#DB2777"/><path d="M356.0,70.0 C458.0,70.0 458.0,70.0 560.0,70.0 L560.0,156.7 C458.0,156.7 458.0,156.7 356.0,156.7 Z" fill="#16A34A" opacity="0.42"/><path d="M356.0,168.7 C458.0,168.7 458.0,168.7 560.0,168.7 L560.0,321.7 C458.0,321.7 458.0,321.7 356.0,321.7 Z" fill="#D97706" opacity="0.42"/><path d="M356.0,321.7 C458.0,321.7 458.0,333.7 560.0,333.7 L560.0,405.1 C458.0,405.1 458.0,393.1 356.0,393.1 Z" fill="#2563EB" opacity="0.42"/><path d="M356.0,393.1 C458.0,393.1 458.0,417.1 560.0,417.1 L560.0,445.1 C458.0,445.1 458.0,421.1 356.0,421.1 Z" fill="#7C3AED" opacity="0.42"/><path d="M356.0,421.1 C458.0,421.1 458.0,457.1 560.0,457.1 L560.0,464.8 C458.0,464.8 458.0,428.8 356.0,428.8 Z" fill="#DB2777" opacity="0.42"/><text x="596.0" y="112.3" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Gut/liver use → urea</text><text x="596.0" y="128.3" text-anchor="start" fill="#16A34A" font-size="11.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">34 g</text><text x="596.0" y="244.2" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Oxidised for energy → urea</text><text x="596.0" y="260.2" text-anchor="start" fill="#D97706" font-size="11.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">60 g</text><text x="596.0" y="368.4" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Renew body proteins (upkeep)</text><text x="596.0" y="384.4" text-anchor="start" fill="#2563EB" font-size="11.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">28 g</text><text x="596.0" y="430.1" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">Other molecules (creatine…)</text><text x="596.0" y="446.1" text-anchor="start" fill="#7C3AED" font-size="11.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">11 g</text><text x="596.0" y="460.0" text-anchor="start" fill="#1c2431" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif">NET new muscle</text><text x="596.0" y="476.0" text-anchor="start" fill="#DB2777" font-size="11.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">3 g</text><text x="450.0" y="524.0" text-anchor="middle" fill="#5b6572" font-size="11" font-weight="False" font-style="italic" font-family="Helvetica,Arial,sans-serif">Grams are illustrative for a weight-stable 68 kg trainee. Only ~3 g becomes NEW muscle; the rest renews proteins or is burned (N → urea).</text></svg>