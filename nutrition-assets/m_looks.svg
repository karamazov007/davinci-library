<text x="142.0" y="151.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Eggs</text><rect x="150.0" y="138.0" width="69.0" height="18.0" rx="4" fill="#db2777" opacity="1.0"/><text x="227.0" y="151.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">150 g · 3 eggs</text><text x="142.0" y="185.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Chana / rajma</text><rect x="150.0" y="172.0" width="92.0" height="18.0" rx="4" fill="#2563eb" opacity="1.0"/><text x="250.0" y="185.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">200 g · 2 katori</text><text x="142.0" y="219.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Masoor dal</text><rect x="150.0" y="206.0" width="92.0" height="18.0" rx="4" fill="#2563eb" opacity="1.0"/><text x="250.0" y="219.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">200 g · 2 katori</text><text x="142.0" y="253.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Tofu</text><rect x="150.0" y="240.0" width="103.5" height="18.0" rx="4" fill="#db2777" opacity="1.0"/><text x="261.5" y="253.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">225 g · ≈ 225 g</text><text x="142.0" y="287.0" text-anchor="end" fill="#1c2431" font-size="11" font-weight="600" font-family="Helvetica,Arial,sans-serif">Moong (cooked)</text><rect x="150.0" y="274.0" width="119.6" height="18.0" rx="4" fill="#2563eb" opacity="1.0"/><text x="277.6" y="287.0" text-anchor="start" fill="#5b6572" font-size="10.5" font-weight="700" font-family="Helvetica,Arial,sans-serif">260 g · 2½ katori</text><text