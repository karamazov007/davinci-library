  &lt;/div&gt;

  &lt;div class=&quot;story&quot;&gt;
    &lt;h3&gt;🧠 How one rep runs through the brain&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;b&gt;Hippocampus / MTL&lt;/b&gt; encodes the cue you were told → hands it up to &lt;b&gt;working memory (dlPFC)&lt;/b&gt;, which holds it &quot;in mind&quot; as &lt;b&gt;the goal&lt;/b&gt; the movement is aiming at.&lt;/li&gt;
      &lt;li&gt;dlPFC drives &lt;b&gt;Primary Motor Cortex (M1)&lt;/b&gt; (effortfully, early) and the &lt;b&gt;dorsomedial striatum&lt;/b&gt; picks the goal-directed action. M1 fires the movement — and sends a copy to the &lt;b&gt;cerebellum&lt;/b&gt;.&lt;/li&gt;
      &lt;li&gt;The &lt;b&gt;cerebellum&lt;/b&gt; predicts the sensory result, compares it against your body&#39;s actual feedback &lt;i&gt;and&lt;/i&gt; the intended goal, and sends the mismatch — the &lt;b&gt;prediction error&lt;/b&gt; — back to M1 as a correction. That&#39;s the error-corrected rep.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Dopamine (VTA/SNc)&lt;/b&gt; reports better- or worse-than-expected and &lt;b&gt;trains the striatum&lt;/b&gt; to keep what worked.&lt;/li&gt;
      &lt;li&gt;With reps + sleep, control &lt;b&gt;migrates from the dorsomedial → dorsolateral striatum&lt;/b&gt; and the program consolidates in &lt;b&gt;M1&lt;/b&gt;. The dlPFC steps back — the skill is now &lt;b&gt;effortless&lt;/b&gt; (and re-engaging dlPFC now = choking).&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;

/* ============================ SOURCES (verified) ============================ */
const CITES={
 squire:{t:&quot;Squire — multiple memory systems: declarative memory (facts, &#39;theory&#39;) depends on the hippocampus / medial temporal lobe and neocortex; skills &amp; habits depend on the striatum, cerebellum &amp; motor cortex — physically separate stores.&quot;,v:&quot;Squire &amp; Dede (2015), Cold Spring Harb. Perspect. Biol.&quot;,u:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC4355270/&quot;},
 goldman:{t:&quot;Goldman-Rakic — the dorsolateral prefrontal cortex holds information &#39;in mind&#39; through persistent neuronal firing: the seat of working memory.&quot;,v:&quot;Goldman-Rakic (1996), PNAS 93, 13473–13480.&quot;,u:&quot;https://www.pnas.org/content/93/24/13473&quot;},
 yin:{t:&quot;Yin &amp; Knowlton (2006) — as a habit forms, control shifts from the dorsomedial striatum (associative, goal-directed) to the dorsolateral striatum (sensorimotor, habitual).&quot;,v:&quot;Nature Reviews Neuroscience 7, 464–476.&quot;,u:&quot;https://www.nature.com/articles/nrn1919&quot;},
 doyon:{t:&quot;Doyon, Penhune &amp; Ungerleider — motor-skill learning runs on two loops, cortico-striatal and cortico-cerebellar, whose balance shifts as the skill automatizes.&quot;,v:&quot;Neuropsychologia (2003) 41, 252–262.&quot;,u:&quot;https://pubmed.ncbi.nlm.nih.gov/12457751/&quot;},
 cerebellum:{t:&quot;The cerebellum runs a &#39;forward model&#39;: using an efference copy it predicts a movement&#39;s sensory result, compares it with the actual feedback, and turns the mismatch (sensory prediction error) into a correction.&quot;,v:&quot;Shadmehr, Smith &amp; Krakauer (2010); review: Cerebellum, Predictions &amp; Errors (2018).&quot;,u:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC6340992/&quot;},
 schultz:{t:&quot;Schultz, Dayan &amp; Montague (1997) — midbrain dopamine neurons (VTA / substantia nigra) signal a reward-prediction error (better/worse than expected) and use it to train the striatum.&quot;,v:&quot;Science 275, 1593–1599.&quot;,u:&quot;https://www.its.caltech.edu/~jkenny/nb250c/papers/Schultz-1997.pdf&quot;},
 muellbacher:{t:&quot;Muellbacher et al. (2002) — the primary motor cortex (M1) is essential for early consolidation: it stabilizes and stores the newly practised motor program.&quot;,v:&quot;Nature 415, 640–644.&quot;,u:&quot;https://pubmed.ncbi.nlm.nih.gov/11807497/&quot;},
 ashby:{t:&quot;Ashby, Turner &amp; Horvitz (2010) — automaticity develops as control transfers from the associative to the sensorimotor striatum (and toward direct sensory→motor cortical routes); the exact path is debated.&quot;,v:&quot;Trends in Cognitive Sciences 14(5), 208–215.&quot;,u:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC2862890/&quot;},
 walker:{t:&quot;Walker et al. — motor memories consolidate &#39;offline&#39;, especially during sleep; the skill improves without further practice (magnitude debated).&quot;,v:&quot;Neuron 35 (2002); Learning &amp; Memory 10 (2003).&quot;,u:&quot;https://learnmem.cshlp.org/content/10/4/275.full.pdf&quot;},
 beilock:{t:&quot;Beilock &amp; Carr (2001) — &#39;choking&#39; is the conscious/prefrontal system re-engaging a movement the striatum &amp; cerebellum already run automatically, disrupting it.&quot;,v:&quot;J. Experimental Psychology: General 130(4), 701–725.&quot;,u:&quot;https://pubmed.ncbi.nlm.nih.gov/11757876/&quot;},
 wulf:{t:&quot;Wulf (2013) — an EXTERNAL focus (on the effect) beats an INTERNAL focus (on the body): consistent with keeping prefrontal micromanagement out of an automatic movement.&quot;,v:&quot;Int. Review of Sport &amp; Exercise Psychology 6(1), 77–104.&quot;,u:&quot;https://gwulf.faculty.unlv.edu/wp-content/uploads/2018/11/Wulf_AF_review_2013.pdf&quot;}
};
const CONF={
 established:[&quot;Established · strong consensus&quot;,&quot;#2f8a5b&quot;,&quot;#e9f7ef&quot;],
 debated:[&quot;Debated · mechanism/size argued&quot;,&quot;#b07d1e&quot;,&quot;#fdf3d6&quot;],
 interp:[&quot;My interpretation · systems framing&quot;,&quot;#6d5bd0&quot;,&quot;#efeafc&quot;]
};
function footnote(cites,conf){
  const cm=CONF[conf||&quot;established&quot;];
  const links=(cites||[]).map(k=&gt;{const c=CITES[k];if(!c)return&quot;&quot;;
    const l=c.u?`&lt;a href=&quot;${c.u}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${c.v} ↗&lt;/a&gt;`:`&lt;span style=&quot;color:#8894ae&quot;&gt;${c.v}&lt;/span&gt;`;
    return `&lt;div class=&quot;fcite&quot;&gt;&lt;b&gt;${c.t}&lt;/b&gt;&lt;br&gt;${l}&lt;/div&gt;`;}).join(&quot;&quot;);
  return `&lt;div class=&quot;fnote&quot;&gt;&lt;div class=&quot;fnh&quot;&gt;&lt;span class=&quot;conf&quot; style=&quot;color:${cm[1]};background:${cm[2]}&quot;&gt;${cm[0]}&lt;/span&gt;&lt;span class=&quot;evh&quot;&gt;Evidence&lt;/span&gt;&lt;/div&gt;${links}&lt;/div&gt;`;
}

/* ============================ BRAIN REGIONS (nodes) ============================ */
const SW=340,SH=190;
const stocks={
 hippocampus:{x:420,y:230,pastel:&quot;#ece5fb&quot;,edge:&quot;#b7a6ee&quot;,tag:&quot;declarative&quot;,title:&quot;Hippocampus / MTL&quot;,hint:&quot;holds cues, facts &amp; &#39;theory&#39;&quot;,
   conf:&quot;established&quot;,cite:[&quot;squire&quot;],
   logic:&quot;Where &lt;b&gt;declarative&lt;/b&gt; knowledge is encoded — the cues, rules and &#39;theory&#39; you can state — often in a single exposure, then handed to the neocortex for long-term storage (Squire). &lt;b&gt;Key point for you:&lt;/b&gt; this is a &lt;i&gt;different organ&lt;/i&gt; from where the skill itself lives (striatum, cerebellum, M1). That&#39;s the neural reason your &#39;theory pile&#39; never turns into &#39;doing&#39; — it&#39;s stored in the wrong place. Its useful job is to hand &lt;b&gt;one&lt;/b&gt; cue up to working memory.&quot;,
   detail:[[&quot;Holds&quot;,&quot;statable cues + facts (episodic &amp; semantic &#39;theory&#39;)&quot;],[&quot;Hands off to&quot;,&quot;working memory (dlPFC) — one cue at a time&quot;]]},
 dlpfc:{x:1150,y:230,pastel:&quot;#dcebfc&quot;,edge:&quot;#95c0f0&quot;,tag:&quot;working memory&quot;,title:&quot;Dorsolateral PFC&quot;,hint:&quot;holds the cue in mind = the goal&quot;,
   conf:&quot;established&quot;,cite:[&quot;goldman&quot;,&quot;beilock&quot;],
   logic:&quot;&lt;b&gt;Working memory.&lt;/b&gt; The dorsolateral prefrontal cortex holds the cue &#39;in mind&#39; via persistent firing (Goldman-Rakic) — this is the &lt;b&gt;goal / reference&lt;/b&gt; the movement aims at, and the narrow, effortful channel that runs early performance. As the skill automates it &lt;b&gt;steps back&lt;/b&gt;; if it re-engages a movement the striatum already runs, you &lt;b&gt;choke&lt;/b&gt; (Beilock).&quot;,
   detail:[[&quot;Holds&quot;,&quot;the cue as the intended outcome (the comparator&#39;s reference)&quot;],[&quot;Limit&quot;,&quot;tiny capacity → give it ONE cue per rep; external focus keeps it from micromanaging&quot;]]},
 dms:{x:1150,y:1060,pastel:&quot;#daf0e5&quot;,edge:&quot;#8dd3b2&quot;,tag:&quot;goal-directed&quot;,title:&quot;Dorsomedial Striatum&quot;,hint:&quot;early: action → outcome&quot;,
   conf:&quot;established&quot;,cite:[&quot;yin&quot;],
   logic:&quot;The &lt;b&gt;associative&lt;/b&gt; striatum. Early in learning, control is &lt;b&gt;goal-directed&lt;/b&gt; here — it links an action to its outcome (&#39;do this to get that&#39;), working with prefrontal cortex (Yin &amp; Knowlton). Flexible but effortful and slow. With practice, control migrates &lt;i&gt;out&lt;/i&gt; of here toward the dorsolateral striatum.&quot;,
   detail:[[&quot;Runs&quot;,&quot;the deliberate, outcome-aware version of the skill&quot;],[&quot;Trained by&quot;,&quot;dopamine reward-prediction error&quot;]]},
 dls:{x:1800,y:1060,pastel:&quot;#d3edf1&quot;,edge:&quot;#8bccd1&quot;,tag:&quot;habitual&quot;,title:&quot;Dorsolateral Striatum&quot;,hint:&quot;late: the &#39;effortless&#39; skill&quot;,
   conf:&quot;debated&quot;,cite:[&quot;yin&quot;,&quot;ashby&quot;],
   logic:&quot;The &lt;b&gt;sensorimotor&lt;/b&gt; striatum — where the skill becomes &lt;b&gt;effortless&lt;/b&gt;. With repetition, control shifts here: fast, automatic stimulus→response habits that no longer need prefrontal supervision (Yin &amp; Knowlton; Ashby). &#39;Effortless skill&#39; is largely &lt;b&gt;this node taking over + the program stored in M1&lt;/b&gt;. &lt;i&gt;Exactly how the hand-off works — via this striatal shift and/or direct sensory→motor cortical routes — is still debated.&lt;/i&gt;&quot;,
   detail:[[&quot;Runs&quot;,&quot;the automatic version — no working memory needed&quot;],[&quot;This is&quot;,&quot;the neural home of &#39;effortless skill&#39;&quot;]]},
 cerebellum:{x:2320,y:800,pastel:&quot;#fde8d6&quot;,edge:&quot;#f0b98a&quot;,tag:&quot;predict + correct&quot;,title:&quot;Cerebellum&quot;,hint:&quot;the error-correction engine&quot;,
   conf:&quot;established&quot;,cite:[&quot;cerebellum&quot;,&quot;doyon&quot;],
   logic:&quot;The &lt;b&gt;prediction-and-correction engine&lt;/b&gt;. From an &lt;b&gt;efference copy&lt;/b&gt; of M1&#39;s command it &lt;b&gt;predicts&lt;/b&gt; the movement&#39;s sensory result, compares that against your body&#39;s &lt;b&gt;actual&lt;/b&gt; feedback &lt;i&gt;and&lt;/i&gt; the intended goal held in dlPFC, and turns the mismatch — the &lt;b&gt;sensory prediction error&lt;/b&gt; — into a correction sent back to M1 (Shadmehr). This is the error-corrected rep, and it&#39;s &lt;b&gt;fast&lt;/b&gt; (within/after each attempt).&quot;,
   detail:[[&quot;Compares&quot;,&quot;predicted vs actual vs the intended cue (the goal)&quot;],[&quot;Sends&quot;,&quot;a correction to M1 → the next rep is closer&quot;]]},
 da:{x:420,y:1060,pastel:&quot;#fbf1cf&quot;,edge:&quot;#e6cf7e&quot;,tag:&quot;reward error&quot;,title:&quot;Dopamine · VTA / SNc&quot;,hint:&quot;&#39;better or worse than expected?&#39;&quot;,

 m1:{x:2320,y:230,pastel:&quot;#e6e9f2&quot;,edge:&quot;#b6c0da&quot;,tag:&quot;execute + store&quot;,title:&quot;Primary Motor Cortex (M1)&quot;,hint:&quot;fires the movement · stores the program&quot;,

 f_goal:{from:&quot;dlpfc&quot;,to:&quot;dms&quot;,rate:&quot;set the goal-directed action&quot;,bend:0,ldx:150,ldy:0,conf:&quot;established&quot;,cite:[&quot;yin&quot;],
   logic:&quot;Prefrontal cortex works with the dorsomedial (associative) striatum to select actions by their expected outcome — the deliberate, goal-directed mode of early learning (Yin &amp; Knowlton).&quot;},

 f_move:{from:&quot;m1&quot;,to:&quot;body&quot;,rate:&quot;movement out&quot;,bend:-30,ldx:55,ldy:-30,conf:&quot;established&quot;,cite:[&quot;cerebellum&quot;],

   logic:&quot;A copy of the motor command lets the cerebellum&#39;s forward model predict the movement&#39;s sensory consequences before the feedback arrives (Shadmehr).&quot;},

   logic:&quot;THE transition to effortless. With repetition, control shifts from the dorsomedial (goal-directed) to the dorsolateral (habitual) striatum (Yin &amp; Knowlton). Whether the endpoint is the sensorimotor striatum, direct sensory→motor cortical routes, or both, is still debated (Ashby).&quot;},

 declarative:{x:440,y:250,pastel:&quot;#ece5fb&quot;,edge:&quot;#b7a6ee&quot;,tag:&quot;knowing-about&quot;,title:&quot;Declarative Cues&quot;,hint:&quot;rules &amp; cues you can state&quot;,
