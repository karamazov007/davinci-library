<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition</title><style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1c2431;--dim:#5b6572;--line:#e7e9ee;--line2:#dcdfe6;--accent:#2f7d4f;--accent2:#1c2431;--soft:#e7f2ec;--gold:#caa24a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.happ{display:flex;flex-direction:column;height:100vh}
.hbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hbrand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:6px}
.htabs{display:flex;gap:3px;flex-wrap:wrap}
.htabs button{border:0;background:none;color:var(--dim);font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.htabs button:hover{background:var(--soft);color:var(--ink)}
.htabs button.active{background:var(--accent);color:#fff}
.stage{flex:1;min-height:0;overflow:hidden;position:relative}
.nlayout{display:flex;height:100%}
.nnav{flex:0 0 236px;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px}
.nnav .nl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:8px 10px 6px}
.tbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;font:inherit;padding:10px 11px;border-radius:10px;cursor:pointer;color:var(--dim);margin-bottom:3px;line-height:1.3}
.tbtn:hover{background:var(--soft);color:var(--ink)}
.tbtn.active{background:var(--soft);color:var(--ink);border-color:var(--accent)}
.tbtn b{display:block;font-size:14px;font-weight:750;color:inherit}
.tbtn span{font-size:12px;color:var(--dim)}
.nmain{flex:1;min-width:0;overflow-y:auto;padding:28px 34px 90px}
.nmain-in{max-width:820px}
.ntoc{flex:0 0 192px;border-left:1px solid var(--line);background:var(--surface);padding:14px 10px;overflow-y:auto}
.ntoc .tl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:4px 10px 8px}
.ntoc a{display:block;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.ntoc a:hover{background:var(--soft);color:var(--accent)}
.thead{margin-bottom:6px}
.thead h1{font-size:27px;font-weight:850;letter-spacing:-.01em;margin:0 0 4px}
.thead p{font-size:15px;color:var(--dim);margin:0;line-height:1.5}
.bh{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin:34px 0 8px;scroll-margin-top:12px}
.bh::after{content:"";flex:1;height:1px;background:var(--line)}
p.bp{font-size:15px;line-height:1.72;color:#39424f;margin:12px 0;max-width:760px}
p.bp b{color:var(--ink)}
.call{background:var(--soft);border:1px solid #cfe6d9;border-left:3px solid var(--accent);border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;line-height:1.66;color:#274b39;max-width:770px}
.pull{font-size:19px;font-weight:800;line-height:1.4;color:var(--ink);border-left:4px solid var(--gold);padding:6px 0 6px 18px;margin:18px 0;max-width:740px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:14px 0;max-width:840px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--accent);transform:translateY(-3px)}
.card b{display:block;font-size:14.5px;margin-bottom:4px}
.card span{font-size:13px;color:var(--dim);line-height:1.5}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;margin:14px 0}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.ncard .nt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ncard .nn{font-size:16px;font-weight:800}
.ncard .tag{font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 8px}
.ncard .nrow{font-size:13px;line-height:1.5;margin:5px 0}
.ncard .nrow .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1px}
.ncard .nrow.def .k{color:#c0453a}
.gtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:820px}
.gtable th,.gtable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);background:var(--soft)}
.gtable tr:last-child td{border-bottom:0}.gtable td b{color:var(--ink)}
.blist{margin:12px 0;padding-left:20px;max-width:760px}.blist li{font-size:14.5px;line-height:1.6;color:#39424f;margin:5px 0}
.flow{margin:16px 0;max-width:620px}
.flow .step{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 15px;font-size:14px;color:#39424f;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.flow .step b{color:var(--ink)}
.flow .arr{text-align:center;color:var(--accent);font-size:15px;line-height:1;margin:4px 0}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 8px;margin:18px 0;box-shadow:0 1px 2px rgba(20,25,40,.04);max-width:820px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:12.5px;color:var(--dim);text-align:center;padding:6px 8px 8px;line-height:1.5}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 19px;margin:12px 0;box-shadow:0 1px 2px rgba(20,25,40,.04);max-width:820px}
.term h4{margin:0 0 5px;font-size:17px;font-weight:800}
.term .what{font-size:14px;color:#39424f;line-height:1.6;margin:0 0 10px}
.term .trow{margin:8px 0}
.term .trow .k{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.term .trow.sym .k{color:#0891b2}.term .trow.fix .k{color:#16a34a}
.term .trow ul{margin:2px 0;padding-left:18px}.term .trow li{font-size:13.5px;line-height:1.5;color:#39424f}
@media(max-width:900px){.nlayout{flex-direction:column;height:auto}.nnav,.ntoc{flex:0 0 auto;border:0;border-bottom:1px solid var(--line)}.ntoc{display:none}.nmain{padding:22px 18px 70px}}
</style></head><body>
<div class="happ">
 <header class="hbar"><div class="hbrand">🥗 Nutrition</div><nav class="htabs" id="htabs"></nav></header>
 <div class="stage" id="stage"></div>
</div>
<script>
const C={ink:'#1f2933',mut:'#5b6572',line:'#c3cbd8',a1:'#4f46e5',a2:'#0891b2',a3:'#db2777',a4:'#ea580c',a5:'#16a34a',a6:'#9333ea'};

const MK=`<defs>
<marker id="mA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.mut}"/></marker>
<marker id="mR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.a3}"/></marker>
<marker id="mB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="${C.a1}"/></marker></defs>`;

const escT=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const P=[C.a1,C.a2,C.a4,C.a5,C.a6,C.a3];

function SV(inner,w=680,h=460){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial">${MK}${inner}</svg>`;}
function T(x,y,txt,{fill=C.ink,fs=12,fw=400,anchor='middle',tr=''}={}){return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="${fs}" font-weight="${fw}"${tr?` transform="${tr}"`:''}>${escT(txt)}</text>`;}
function ML(x,y,label,o={}){const lines=String(label).split('\n');const lh=o.lh||13;const off=(lines.length-1)*lh/2;return lines.map((ln,i)=>T(x,y-off+i*lh,ln,o)).join('');}
function boxN(x,y,w,h,label,{fill=C.a1,tc='#fff',fs=12,r=9,stroke='',sw=0}={}){const lines=String(label).split('\n');const startY=y+h/2-((lines.length-1)*7)+4;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''}/>`+lines.map((ln,i)=>T(x+w/2,startY+i*14,ln,{fill:tc,fs,fw:600})).join('');}

function genGraph(nodes,edges,{w=700,h=460,pad=26}={}){
  const px=n=>pad+n.x*(w-2*pad), py=n=>pad+n.y*(h-2*pad); const byId={}; nodes.forEach(n=>byId[n.id]=n); let s='';
  (edges||[]).forEach(e=>{const a=byId[e.from],b=byId[e.to]; if(!a||!b)return; let x1=px(a),y1=py(a),x2=px(b),y2=py(b);
    const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;
    const o1=(a.r||(a.w?Math.max(a.w,a.h)/2:26))+2, o2=(b.r||(b.w?Math.max(b.w,b.h)/2:26))+7;
    x1+=dx/d*o1; y1+=dy/d*o1; x2-=dx/d*o2; y2-=dy/d*o2;
    const mk=e.arrow===false?'':`marker-end="url(#${e.mk||'mA'})"`, col=e.color||C.mut; let lmx,lmy;
    if(e.curve){const mxp=(x1+x2)/2-dy/d*e.curve, myp=(y1+y2)/2+dx/d*e.curve; s+=`<path d="M${x1},${y1} Q${mxp},${myp} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${e.w||1.7}" ${e.dash?`stroke-dasharray="${e.dash}"`:''} ${mk}/>`; lmx=(x1+2*mxp+x2)/4; lmy=(y1+2*myp+y2)/4;}
    else {s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${e.w||1.7}" ${e.dash?`stroke-dasharray="${e.dash}"`:''} ${mk}/>`; lmx=(x1+x2)/2; lmy=(y1+y2)/2;}
    if(e.label){const lw=String(e.label).length*6+8; s+=`<rect x="${lmx-lw/2}" y="${lmy-9}" width="${lw}" height="16" rx="4" fill="#fff" opacity=".92"/>`+T(lmx,lmy+3,e.label,{fill:e.lc||C.mut,fs:e.label.length<3?12:9.5,fw:e.label.length<3?800:400});}
  });
  nodes.forEach((n,i)=>{const cx=px(n),cy=py(n),fill=n.fill||P[i%P.length],tc=n.tc||'#fff',shape=n.shape||'round';
    if(shape==='circle'){const r=n.r||30; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${n.hollow?'#fff':fill}"${n.hollow?` stroke="${fill}" stroke-width="2.5"`:''}/>`+ML(cx,cy+4,n.label,{fill:n.hollow?C.ink:tc,fs:n.fs||11,fw:600});}
    else if(shape==='diamond'){const ww=n.w||96,hh=n.h||64; s+=`<polygon points="${cx},${cy-hh/2} ${cx+ww/2},${cy} ${cx},${cy+hh/2} ${cx-ww/2},${cy}" fill="${n.hollow?'#fff':fill}"${n.hollow?` stroke="${fill}" stroke-width="2.5"`:''}/>`+ML(cx,cy+4,n.label,{fill:n.hollow?C.ink:tc,fs:n.fs||10,fw:600});}
    else {const ww=n.w||110,hh=n.h||44; s+=boxN(cx-ww/2,cy-hh/2,ww,hh,n.label,{fill,tc,fs:n.fs||11,r:shape==='rect'?4:12});}
  });
  return SV(s,w,h);
}
function genMindMap(center,branches,{w=780,h=540}={}){const cx=w/2,cy=h/2,R1=Math.min(w,h)*0.29,rr=Math.min(w,h)*0.185,n=branches.length; let s='';
  branches.forEach((br,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n,bx=cx+Math.cos(ang)*R1,by=cy+Math.sin(ang)*R1,col=P[i%P.length];
    s+=`<path d="M${cx},${cy} Q${(cx+bx)/2},${(cy+by)/2} ${bx},${by}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    const kids=br.children||[],spread=Math.PI/2.6;
    kids.forEach((k,j)=>{const ka=ang+(kids.length>1?(-spread/2+j*spread/(kids.length-1)):0),kx=bx+Math.cos(ka)*rr,ky=by+Math.sin(ka)*rr;
      s+=`<line x1="${bx}" y1="${by}" x2="${kx}" y2="${ky}" stroke="${col}" stroke-width="1.4" opacity=".65"/>`;
      s+=`<rect x="${kx-48}" y="${ky-13}" width="96" height="26" rx="13" fill="#fff" stroke="${col}" stroke-width="1.4"/>`+ML(kx,ky+4,k,{fill:C.ink,fs:9.5,fw:600});});
    s+=boxN(bx-58,by-19,116,38,br.label,{fill:col,fs:11,r:19});});
  s+=`<circle cx="${cx}" cy="${cy}" r="48" fill="${C.ink}"/>`+ML(cx,cy+4,center,{fill:'#fff',fs:13,fw:700});
  return SV(s,w,h);}
function genTree(root,{w=720,h=440,pad=44,boxW=104,boxH=40}={}){let leaves=[];const levels=[];
  (function walk(n,d){n._d=d;levels[d]=1;if(!n.children||!n.children.length)leaves.push(n);else n.children.forEach(c=>walk(c,d+1));})(root,0);
  const maxD=levels.length-1,xGap=(w-2*pad)/Math.max(1,leaves.length-1);
  leaves.forEach((lf,i)=>lf._x=leaves.length===1?w/2:pad+i*xGap);
  const yGap=(h-2*pad-boxH)/Math.max(1,maxD);
  (function setx(n){if(n.children&&n.children.length){n.children.forEach(setx);n._x=(n.children[0]._x+n.children[n.children.length-1]._x)/2;}n._y=pad+n._d*yGap;})(root);
  let s='';const pal=[C.a2,C.a4,C.a5,C.a6,C.a3];
  (function ed(n){if(n.children)n.children.forEach(c=>{s+=`<path d="M${n._x},${n._y+boxH} C${n._x},${(n._y+boxH+c._y)/2} ${c._x},${(n._y+boxH+c._y)/2} ${c._x},${c._y}" fill="none" stroke="${C.line}" stroke-width="1.6"/>`;ed(c);});})(root);
  (function nd(n){const col=n._d===0?C.a1:pal[(n._d-1)%pal.length];s+=boxN(n._x-boxW/2,n._y,boxW,boxH,n.label,{fill:n._d===0?C.a1:'#fff',tc:n._d===0?'#fff':C.ink,stroke:n._d===0?'':col,sw:1.8,fs:10.5,r:8});if(n.children)n.children.forEach(nd);})(root);
  return SV(s,w,h);}
function genPyramid(levels,{w=680,h=460}={}){const n=levels.length,top=44,botW=w-160,ax=w/2,H=h-100,lh=H/n;let s='';
  levels.forEach((lv,i)=>{const y0=top+i*lh,y1=top+(i+1)*lh,wt=botW*i/n,wb=botW*(i+1)/n;
    s+=`<polygon points="${ax-wt/2},${y0} ${ax+wt/2},${y0} ${ax+wb/2},${y1} ${ax-wb/2},${y1}" fill="${lv.color||P[i%P.length]}"/>`;
    s+=ML(ax,(y0+y1)/2+4,lv.label,{fill:'#fff',fs:12,fw:700});
    if(lv.sub)s+=T(ax+wb/2+10,(y0+y1)/2+4,lv.sub,{fill:C.mut,fs:10,anchor:'start'});});
  return SV(s,w,h);}
function genTreemap(items,{w=680,h=440,pad=8}={}){const total=items.reduce((a,b)=>a+b.weight,0);let it=items.slice().sort((a,b)=>b.weight-a.weight);
  const x=pad,rw=w-2*pad,rh=h-2*pad;let curY=pad,s='',rem=it.slice();
  while(rem.length){const rc=Math.min(rem.length,rem.length<=3?rem.length:2),row=rem.splice(0,rc),rowW=row.reduce((a,b)=>a+b.weight,0),rowH=rh*(rowW/total);let curX=x;
    row.forEach(item=>{const cw=rw*(item.weight/rowW);s+=`<rect x="${curX}" y="${curY}" width="${cw-4}" height="${rowH-4}" rx="6" fill="${item.color||C.a1}"/>`;
      s+=ML(curX+(cw-4)/2,curY+rowH/2-2,item.label,{fill:'#fff',fs:11.5,fw:700});
      s+=T(curX+(cw-4)/2,curY+rowH/2+16,Math.round(item.weight/total*100)+'%',{fill:'rgba(255,255,255,.85)',fs:10});curX+=cw;});curY+=rowH;}
  return SV(s,w,h);}
function genTimeline(events,{w=780,h=420}={}){const y=h/2,x0=54,x1=w-54,n=events.length;let s=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="3"/>`;
  events.forEach((e,i)=>{const x=x0+(x1-x0)*(n===1?0.5:i/(n-1)),dir=i%2===0?-1:1,col=P[i%P.length];
    s+=`<circle cx="${x}" cy="${y}" r="7" fill="${col}"/>`;const ly=y+dir*74;
    s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${ly+(dir<0?24:-24)}" stroke="${col}" stroke-width="1.6"/>`;
    s+=`<rect x="${x-72}" y="${ly-24}" width="144" height="54" rx="9" fill="#fff" stroke="${col}" stroke-width="1.6"/>`;
    s+=T(x,ly-6,e.when,{fill:col,fs:11.5,fw:700})+ML(x,ly+13,e.label,{fill:C.ink,fs:9.5,fw:600,lh:11});});
  return SV(s,w,h);}
function genCycle(stages,{w=620,h=560,center=''}={}){const cx=w/2,cy=h/2,R=Math.min(w,h)*0.30,n=stages.length;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.line}" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  const pts=stages.map((st,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,a};});
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],a1=p.a+0.44,a2=q.a-0.44,x1=cx+Math.cos(a1)*R,y1=cy+Math.sin(a1)*R,x2=cx+Math.cos(a2)*R,y2=cy+Math.sin(a2)*R;
    s+=`<path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" fill="none" stroke="${C.mut}" stroke-width="2" marker-end="url(#mA)"/>`;}
  stages.forEach((st,i)=>{const p=pts[i],col=P[i%P.length];s+=`<circle cx="${p.x}" cy="${p.y}" r="46" fill="${col}"/>`+ML(p.x,p.y+4,st.label,{fill:'#fff',fs:11,fw:700});
    if(st.note){const ox=cx+(p.x-cx)*1.62,oy=cy+(p.y-cy)*1.62;s+=ML(ox,oy,st.note,{fill:C.mut,fs:9,lh:10});}});
  if(center)s+=ML(cx,cy,center,{fill:C.ink,fs:12,fw:700});
  return SV(s,w,h);}
function genSankey(source,flows,{w=740,h=460}={}){const total=flows.reduce((a,b)=>a+b.value,0),pad=34,barX=64,barW=28,sy0=pad,sy1=h-pad,H=sy1-sy0;
  let s=`<rect x="${barX}" y="${sy0}" width="${barW}" height="${H}" rx="5" fill="${C.a1}"/>`+ML(barX+barW/2,sy0-14,source,{fill:C.ink,fs:12,fw:700,lh:12});
  const rightX=w-250;let cur=sy0;
  flows.forEach((f,i)=>{const th=H*(f.value/total),col=f.color||P[i%P.length],x1=barX+barW,x2=rightX;
    s+=`<path d="M${x1},${cur} C${(x1+x2)/2},${cur} ${(x1+x2)/2},${cur} ${x2},${cur} L${x2},${cur+th} C${(x1+x2)/2},${cur+th} ${(x1+x2)/2},${cur+th} ${x1},${cur+th} Z" fill="${col}" opacity=".5"/>`;
    s+=`<rect x="${x2}" y="${cur}" width="15" height="${th}" fill="${col}"/>`;
    s+=T(x2+24,cur+th/2+4,`${f.label} (${Math.round(f.value/total*100)}%)`,{fill:C.ink,fs:11,anchor:'start',fw:600});cur+=th;});
  return SV(s,w,h);}
function genFishbone(effect,bones,{w=800,h=470}={}){const y=h/2,x0=40,xEnd=w-170;let s=`<line x1="${x0}" y1="${y}" x2="${xEnd}" y2="${y}" stroke="${C.ink}" stroke-width="2.5"/>`;
  s+=`<polygon points="${xEnd},${y-9} ${xEnd+22},${y} ${xEnd},${y+9}" fill="${C.ink}"/>`+boxN(xEnd+26,y-27,132,54,effect,{fill:C.a4,fs:11});

els and the framework — carbs, protein, fats, and sugar.", "topics": [{"id": "carbs", "name": "Carbohydrates", "blurb": "Glucose, insulin and blood sugar.", "blocks": [{"t": "p", "x": "Carbohydrates are the body's quickest fuel. Nearly all of them end up as <b>glucose</b> in your blood — 'blood sugar' is literally the concentration of glucose, measured in mg/dL (a healthy fasting value is around 95)."}, {"t": "p", "x": "When blood glucose rises, the pancreas releases <b>insulin</b> — the master storage hormone. It does three jobs at once, deciding where the glucose goes."}, {"t": "fig", "gen": "genGraph", "cap": "Eat carbs → glucose rises → insulin stores it three ways.", "args": [[{"id": "e", "x": 0.5, "y": 0.06, "shape": "round", "w": 180, "h": 34, "label": "Eat rice → glucose ↑", "fill": "#4f46e5"}, {"id": "i", "x": 0.5, "y": 0.26, "shape": "rect", "w": 150, "h": 32, "label": "Insulin released", "fill": "#0891b2"}, {"id": "m", "x": 0.2, "y": 0.55, "shape": "rect", "w": 150, "h": 44, "label": "Muscle → glycogen", "fill": "#16a34a"}, {"id": "l", "x": 0.5, "y": 0.62, "shape": "rect", "w": 150, "h": 44, "label": "Liver → glycogen", "fill": "#16a34a"}, {"id": "f", "x": 0.8, "y": 0.55, "shape": "rect", "w": 150, "h": 44, "label": "Fat → triglycerides", "fill": "#ea580c"}, {"id": "b", "x": 0.5, "y": 0.92, "shape": "round", "w": 210, "h": 34, "label": "Glucose back to 70–100 in ~2h", "fill": "#0891b2"}], [{"from": "e", "to": "i"}, {"from": "i", "to": "m"}, {"from": "i", "to": "l"}, {"from": "i", "to": "f"}, {"from": "m", "to": "b"}, {"from": "l", "to": "b"}, {"from": "f", "to": "b"}], {"w": 720, "h": 520}]}, {"t": "h", "x": "The blood-sugar response tells the story"}, {"t": "table", "head": ["Person", "Spike", "Return to baseline"], "rows": [["Healthy", "~140 mg/dL", "Within ~2 hours"], ["Pre-diabetic", "~180 mg/dL", "3+ hours"], ["Diabetic", "Above 200 mg/dL", "May not return"]]}, {"t": "p", "x": "A longer-term marker is <b>HbA1c</b> — the fraction of your haemoglobin that has glucose stuck to it. Because red cells live ~3 months, it's a running average of your blood sugar, not a single snapshot."}, {"t": "call", "x": "The problem is rarely carbs existing — it's <b>refined</b> carbs and sugar spiking glucose fast and often, forcing big insulin swings."}]}, {"id": "protein", "name": "Protein", "blurb": "Amino acids — the body's building material.", "blocks": [{"t": "p", "x": "Protein is chains of <b>amino acids</b> — the alphabet the body builds nearly everything from: muscle, enzymes, hormones, skin, hair, antibodies, even neurotransmitters. There are 20 amino acids; 9 are <b>essential</b> (you must eat them) and 11 are non-essential (the body makes them)."}, {"t": "fig", "gen": "genTree", "cap": "20 amino acids — 9 you must eat, 11 you can make.", "args": [{"label": "Amino acids (20)", "children": [{"label": "Essential (9)", "children": [{"label": "Leucine"}, {"label": "Lysine"}, {"label": "Methionine"}, {"label": "Tryptophan"}]}, {"label": "Non-essential (11)", "children": [{"label": "Glutamine"}, {"label": "Glycine"}, {"label": "Alanine"}]}]}, {"w": 820, "h": 420, "boxW": 92, "boxH": 32}]}, {"t": "h", "x": "Complete vs incomplete"}, {"t": "cards", "items": [{"h": "Complete — all 9", "x": "Eggs (gold standard), whey, milk & paneer, chicken, fish."}, {"h": "Incomplete — missing some", "x": "Dal/lentils, rice/roti, peanut butter, chickpeas."}, {"h": "Combine to complete", "x": "Dal + rice together cover each other's gaps — a complete protein."}]}, {"t": "h", "x": "What protein does"}, {"t": "cards", "items": [{"h": "Muscle", "x": "Build & repair; leucine triggers synthesis."}, {"h": "Enzymes", "x": "Every chemical reaction in the body needs them."}, {"h": "Hormones", "x": "Insulin, growth hormone — all proteins."}, {"h": "Structure", "x": "Collagen (skin, tendons, bone), keratin (hair)."}, {"h": "Immunity", "x": "Every antibody is a protein."}, {"h": "Transport & mood", "x": "Haemoglobin carries O₂; serotonin & dopamine come from amino acids."}]}, {"t": "h", "x": "If you run short"}, {"t": "flow", "steps": ["Short term: poor recovery, fatigue, slow healing, hair loss, brain fog", "Medium term: muscle wasting, fluid retention, hormonal issues, skin loses elasticity", "Long term: organ damage, collapsed immunity, kwashiorkor"]}, {"t": "call", "x": "Master rule: get all 9 essential amino acids daily, prioritise complete sources, and aim for ~2 g per kg bodyweight if you train — eggs and whey first."}]}, {"id": "fats", "name": "Fats", "blurb": "Not the enemy — the type is what matters.", "blocks": [{"t": "p", "x": "A fat is a glycerol backbone with three fatty-acid chains. Whether it's solid or liquid — and whether it helps or harms — comes down to its chemical shape. There are three broad kinds, and they are not equal."}, {"t": "fig", "gen": "genTree", "cap": "The fat family — from best to avoid.", "args": [{"label": "Fats (lipids)", "children": [{"label": "Saturated", "children": [{"label": "solid"}]}, {"label": "Unsaturated", "children": [{"label": "Mono"}, {"label": "Poly", "children": [{"label": "Omega-3"}, {"label": "Omega-6"}]}]}, {"label": "Trans", "children": [{"label": "avoid"}]}]}, {"w": 820, "h": 430, "boxW": 84, "boxH": 30}]}, {"t": "fig", "gen": "genSpectrum", "cap": "How to treat each type.", "args": ["Eat freely", "Avoid entirely", [{"label": "Mono", "pos": 0.1, "color": "#16a34a"}, {"label": "Omega-3", "pos": 0.2, "color": "#16a34a"}, {"label": "Saturated\n(moderate)", "pos": 0.5, "color": "#ea580c"}, {"label": "Omega-6\n(reduce)", "pos": 0.68, "color": "#ea580c"}, {"label": "Trans", "pos": 0.95, "color": "#db2777"}], {"title": "Prioritise mono & omega-3; moderate saturated; cut omega-6 excess; eliminate trans", "w": 820, "h": 270}]}, {"t": "nutri", "items": [{"n": "Saturated", "tag": "MODERATE", "fn": ["Hormone production (testosterone/estrogen)", "Cell-membrane stability", "Absorbs vitamins A/D/E/K"], "src": ["Ghee, butter, eggs", "Full-fat milk, coconut oil"], "def": ["Low testosterone, hormonal disruption", "Poor fat-soluble vitamin absorption"]}, {"n": "Monounsaturated", "tag": "FREELY", "fn": ["Lowers LDL, raises HDL", "Anti-inflammatory", "Membrane flexibility"], "src": ["Olive oil, avocado", "Almonds, cashews, peanut butter"], "def": ["Higher cardiovascular risk", "Inflammation rises"]}, {"n": "Omega-3 (poly)", "tag": "PRIORITISE", "fn": ["DHA builds the brain", "EPA reduces inflammation", "Heart, eyes, joints, mood"], "src": ["Fatty fish (salmon, mackerel)", "Fish oil, walnuts & flax (ALA)"], "def": ["Brain fog, poor memory", "Depression, chronic inflammation, dry skin"]}, {"n": "Omega-6 (poly)", "tag": "REDUCE", "fn": ["Membrane structure", "Controlled inflammation (in balance)"], "src": ["Vegetable oils, sunflower seeds", "Corn oil, most packaged snacks"], "def": ["Excess → chronic inflammation", "Blocks omega-3 from working"]}, {"n": "Trans", "tag": "ELIMINATE", "fn": ["Zero beneficial function"], "src": ["Vanaspati/dalda, fried street food", "Anything 'partially hydrogenated'"], "def": ["Raises LDL AND lowers HDL", "Damages arteries — no safe level"]}]}, {"t": "call", "x": "The critical number is the <b>Omega-6 : Omega-3 ratio</b>. Ideal is ~4:1; a modern diet runs 20:1 or worse — which is why cutting seed oils and adding fish/flax matters more than total fat."}]}, {"id": "sugar", "name": "Sugar & Insulin", "blurb": "The spike, the crash, and the spiral.", "blocks": [{"t": "p", "x": "Sugar is the fastest carb of all — and its danger is behavioural as much as metabolic. Each hit sets up a short loop that, repeated for years, hardens into insulin resistance."}, {"t": "h", "x": "The meal-to-meal loop"}, {"t": "flow", "steps": ["Eat sugary/high-carb food", "Blood glucose spikes fast → dopamine hit (feels rewarding)", "Large insulin response to clear it", "Glucose crashes below baseline", "Energy crash → brain screams for quick energy", "Crave sugar again → repeat"]}, {"t": "h", "x": "The years-long spiral"}, {"t": "fig", "gen": "genCycle", "cap": "Repeated spikes → insulin resistance.", "args": [[{"label": "Chronic spikes"}, {"label": "Pancreas overworked"}, {"label": "Receptors downregulate"}, {"label": "Glucose can't enter cells"}, {"label": "Stored as visceral fat"}], {"w": 600, "h": 540, "center": "Resistance"}]}, {"t": "p", "x": "As receptors go numb, glucose can't get into cells efficiently — so cells are starved (chronic fatigue) while blood sugar stays high and gets stored as visceral fat, which worsens the resistance further. That's the road to Type 2 diabetes."}, {"t": "call", "x": "The fix isn't heroics — it's blunting the spikes: whole carbs over refined, protein/fat/fibre alongside, and movement after meals to pull glucose into muscle."}]}]}, {"id": "micros", "name": "Micronutrients", "icon": "💊", "intro": "Vitamins and minerals — tiny amounts, huge leverage, and they interact.", "topics": [{"id": "vitamins", "name": "Vitamins", "blurb": "Fat-soluble (stored) and water-soluble (daily).", "blocks": [{"t": "p", "x": "Vitamins split by where they dissolve. <b>Fat-soluble</b> (A, D, E, K) need dietary fat to absorb, are stored in liver and fat, and can accumulate — so you don't need them daily. <b>Water-soluble</b> (B-complex, C) aren't stored, flush out in urine, and are needed regularly (overdose is almost impossible)."}, {"t": "h", "x": "Fat-soluble — A · D · E · K"}, {"t": "nutri", "items": [{"n": "Vitamin A", "tag": "A", "fn": ["Night vision", "Skin cell renewal", "Immune barrier"], "src": ["Eggs, ghee, milk", "Carrots, pumpkin, spinach"], "def": ["Night blindness", "Dry skin, infections"]}, {"n": "Vitamin D3", "tag": "D", "fn": ["Calcium absorption", "Testosterone & mood", "Regulates 200+ genes"], "src": ["Sunlight (primary)", "Fatty fish, supplement"], "def": ["Fatigue, low testosterone", "Depression, weak bones"]}, {"n": "Vitamin E", "tag": "E", "fn": ["Antioxidant — protects cell walls", "Protects omega-3", "Works with vitamin C"], "src": ["Almonds, sunflower seeds", "Peanut butter, spinach"], "def": ["Cell damage", "Nerve damage, weak immunity"]}, {"n": "Vitamin K2", "tag": "K", "fn": ["Directs calcium INTO bones, OUT of arteries", "Works with D3"], "src": ["Natto (richest)", "Aged cheese, ghee"], "def": ["Calcium in arteries", "Weak bones despite calcium intake"]}]}, {"t": "h", "x": "Water-soluble — B-complex · C"}, {"t": "nutri", "items": [{"n": "B-complex (B1–B7)", "tag": "B", "fn": ["Turn food into ATP (energy)", "Nerve function, skin, hair", "B6 → serotonin/dopamine"], "src": ["Eggs, meat, dairy", "Whole grains, legumes"], "def": ["Fatigue, low energy", "Nerve and skin problems"]}, {"n": "B9 + B12", "tag": "B", "fn": ["DNA synthesis & red blood cells", "B12 builds myelin (nerves)"], "src": ["B9: leafy greens, dal", "B12: eggs, meat, dairy (supplement if vegan)"], "def": ["Anaemia, fatigue", "Nerve damage, brain fog"]}, {"n": "Vitamin C", "tag": "C", "fn": ["Collagen synthesis (skin, joints)", "Antioxidant", "Boosts iron absorption & immunity"], "src": ["Amla, citrus", "Tomato, peppers"], "def": ["Gum problems, poor healing", "Weak immunity (scurvy in extreme)"]}]}, {"t": "call", "x": "For most people on a mixed diet the gaps are: <b>Vitamin D</b> (supplement with food), and <b>B12</b> (must supplement if plant-based). Get vitamin C from food and A from colourful vegetables daily."}]}, {"id": "minerals", "name": "Minerals", "blurb": "Macrominerals (grams) and trace minerals (milligrams).", "blocks": [{"t": "p", "x": "Minerals are inorganic elements. <b>Macrominerals</b> you need in gram amounts — they run structure and fluid balance. <b>Trace minerals</b> you need in milligrams — but they act as catalysts, so a tiny shortfall causes outsized problems."}, {"t": "h", "x": "Macrominerals"}, {"t": "nutri", "items": [{"n": "Calcium", "tag": "Ca", "fn": ["Bone & teeth structure", "Muscle contraction, nerve signals"], "src": ["Milk, paneer", "Dal, sesame"], "def": ["Muscle cramps", "Bone density loss, osteoporosis"]}, {"n": "Magnesium", "tag": "Mg", "fn": ["300+ reactions — more than any other mineral", "Activates vitamin D3", "Muscle & nervous-system relaxation, sleep"], "src": ["Pumpkin seeds, dark leafy greens", "Dal, peanut butter"], "def": ["Poor sleep, cramps, anxiety", "D3 supplements barely work"]}, {"n": "Sodium", "tag": "Na", "fn": ["Fluid balance outside cells", "Nerve impulses, nutrient absorption"], "src": ["Table salt", "All cooked food"], "def": ["Rare; excess is the real issue → high BP"]}, {"n": "Potassium", "tag": "K", "fn": ["Fluid balance inside cells", "Heart rhythm, counters sodium → lowers BP"], "src": ["Potato, dal", "Banana, tomato, milk"], "def": ["Muscle weakness", "Irregular heartbeat, high BP"]}, {"n": "Phosphorus", "tag": "P", "fn": ["Bone structure with calcium", "Part of ATP and DNA/RNA"], "src": ["Eggs, milk", "Dal, peanut butter"], "def": ["Extremely rare — bone pain, low energy"]}]}, {"t": "h", "x": "Trace minerals"}, {"t": "nutri", "items": [{"n": "Iron", "tag": "Fe", "fn": ["Oxygen transport (haemoglobin)", "Energy production"], "src": ["Red meat (heme, best)", "Dal, spinach (needs vitamin C)"], "def": ["Fatigue, brain fog", "Anaemia — world's #1 deficiency"]}, {"n": "Zinc", "tag": "Zn", "fn": ["Immunity, wound healing", "Testosterone, taste & smell"], "src": ["Red meat, eggs", "Pumpkin seeds"], "def": ["Frequent illness", "Low testosterone, hair loss"]}, {"n": "Iodine", "tag": "I", "fn": ["Makes thyroid hormones T3/T4", "Sets whole-body metabolism"], "src": ["Iodised salt", "Seafood, dairy"], "def": ["Hypothyroidism", "Fatigue, weight gain, brain fog"]}, {"n": "Selenium", "tag": "Se", "fn": ["Master antioxidant (glutathione)", "Activates thyroid T4 → T3"], "src": ["Brazil nuts (2/day)", "Eggs, seafood"], "def": ["Thyroid dysfunction", "Weak immunity"]}, {"n": "Manganese", "tag": "Mn", "fn": ["Bone formation", "Antioxidant enzymes, metabolism"], "src": ["Rice, roti, dal", "Tea, nuts"], "def": ["Rare — bone fragility"]}]}]}, {"id": "pairs", "name": "Synergies & Antagonisms", "blurb": "Which nutrients help, block, or activate each other.", "blocks": [{"t": "p", "x": "Micronutrients don't act alone. Some <b>amplify</b> each other, some <b>compete</b> for the same absorption pathway, and some form <b>chains</b> where one activates the next. Getting the pairings right often matters more than the dose."}, {"t": "h", "x": "Synergistic pairs — take together"}, {"t": "cards", "items": [{"h": "D3 + K2", "x": "The most critical pairing. D3 absorbs calcium; K2 sends it to bones, not arteries. Always together."}, {"h": "D3 + Magnesium", "x": "Magnesium activates D3 — without it, a D3 supplement barely works."}, {"h": "Vitamin C + Iron", "x": "Vitamin C converts plant (non-heme) iron into an absorbable form. Lemon on dal."}, {"h": "Vitamin C + Vitamin E", "x": "C regenerates E after it neutralises a free radical — an antioxidant relay."}, {"h": "Ca + D3 + K2 + Mg", "x": "The bone team. Miss one and the whole chain underperforms."}, {"h": "Iodine + Selenium", "x": "Iodine makes T4; selenium converts it to active T3. Both needed for thyroid."}]}, {"t": "h", "x": "Antagonistic pairs — separate them"}, {"t": "cards", "items": [{"h": "Iron ✗ Calcium", "x": "Compete for absorption — don't take an iron and a calcium supplement together."}, {"h": "Iron ✗ Zinc", "x": "Share a pathway; large doses of one blunt the other."}, {"h": "Omega-6 ✗ Omega-3", "x": "Compete for the same enzymes — excess omega-6 crowds omega-3 out."}]}, {"t": "h", "x": "Dependent chains — one activates the next"}, {"t": "fig", "gen": "genGraph", "cap": "Chains where each step enables the next.", "args": [[{"id": "se", "x": 0.25, "y": 0.12, "shape": "round", "w": 130, "h": 32, "label": "Selenium", "fill": "#0891b2"}, {"id": "gl", "x": 0.25, "y": 0.5, "shape": "rect", "w": 150, "h": 32, "label": "Glutathione", "fill": "#0891b2"}, {"id": "ax", "x": 0.25, "y": 0.88, "shape": "round", "w": 140, "h": 32, "label": "Antioxidant", "fill": "#16a34a"}, {"id": "tr", "x": 0.75, "y": 0.12, "shape": "round", "w": 150, "h": 32, "label": "Tryptophan + B6", "fill": "#9333ea"}, {"id": "sr", "x": 0.75, "y": 0.5, "shape": "round", "w": 130, "h": 32, "label": "Serotonin", "fill": "#16a34a"}, {"id": "bb", "x": 0.5, "y": 0.7, "shape": "round", "w": 150, "h": 32, "label": "B9 + B12", "fill": "#4f46e5"}, {"id": "dn", "x": 0.75, "y": 0.88, "shape": "rect", "w": 170, "h": 32, "label": "DNA + red cells", "fill": "#16a34a"}], [{"from": "se", "to": "gl"}, {"from": "gl", "to": "ax"}, {"from": "tr", "to": "sr"}, {"from": "bb", "to": "dn"}], {"w": 720, "h": 460}]}]}]}, {"id": "systems", "name": "Body Systems", "icon": "🫀", "intro": "Where nutrition becomes physiology — cholesterol and the stress response.", "topics": [{"id": "chol", "name": "Cholesterol & Lipids", "blurb": "A building material, not a poison.", "blocks": [{"t": "p", "x": "Cholesterol is not a disease — it's a fat-like molecule your body depends on. Your liver makes ~80% of it; your brain is ~25% cholesterol; and testosterone, estrogen, cortisol and vitamin D are all built from it. The problem is never that it exists — it's the transport going wrong."}, {"t": "h", "x": "Six essential jobs"}, {"t": "fig", "gen": "genMindMap", "cap": "What cholesterol actually does.", "args": ["Cholesterol", [{"label": "Membrane fluidity"}, {"label": "Enables membrane proteins"}, {"label": "Lipid rafts (signalling)"}, {"label": "Myelin (nerve insulation)"}, {"label": "Steroid hormones"}, {"label": "Bile acids (fat digestion)"}], {"w": 800, "h": 560}]}, {"t": "h", "x": "LDL and HDL are trucks, not cargo"}, {"t": "p", "x": "Cholesterol can't travel in water-based blood alone, so it rides inside <b>lipoproteins</b>. LDL and HDL are the vehicles — not the cholesterol itself. 'LDL cholesterol' on a blood test means the cholesterol being carried inside LDL particles."}, {"t": "fig", "gen": "genGraph", "cap": "Delivery out, cleanup back.", "args": [[{"id": "li", "x": 0.5, "y": 0.1, "shape": "round", "w": 130, "h": 34, "label": "Liver", "fill": "#4f46e5"}, {"id": "ldl", "x": 0.25, "y": 0.45, "shape": "rect", "w": 170, "h": 44, "label": "LDL → delivers to cells", "fill": "#db2777"}, {"id": "cells", "x": 0.5, "y": 0.75, "shape": "round", "w": 130, "h": 34, "label": "Body cells", "fill": "#5b6572"}, {"id": "hdl", "x": 0.75, "y": 0.45, "shape": "rect", "w": 170, "h": 44, "label": "HDL → returns for recycling", "fill": "#16a34a"}], [{"from": "li", "to": "ldl"}, {"from": "ldl", "to": "cells"}, {"from": "cells", "to": "hdl"}, {"from": "hdl", "to": "li"}], {"w": 700, "h": 460}]}, {"t": "p", "x": "Trouble starts when there's too much LDL and it gets <b>oxidised</b> by free radicals — it deposits in artery walls, forming plaque (atherosclerosis). HDL is the cleanup crew pulling excess cholesterol back to the liver."}, {"t": "table", "head": ["Marker", "Target"], "rows": [["LDL", "below 100 mg/dL"], ["HDL", "above 60 mg/dL (protective)"], ["Triglycerides", "below 150 mg/dL"], ["Total : HDL ratio", "below 4"]]}, {"t": "call", "x": "The reframe: the fix is to improve transport — more HDL, less oxidised LDL — not to crush cholesterol itself. Triglycerides, notably, rise from excess <b>sugar and refined carbs</b>, not dietary fat."}]}, {"id": "stress", "name": "The Stress Response", "blurb": "One hormone, six system-wide effects.", "blocks": [{"t": "p", "x": "Acute stress is a brilliant survival system: adrenaline and cortisol prepare you to fight or flee — heart rate up, glucose dumped into blood, digestion and immunity paused. The design flaw is that it's meant to be <b>resolved by physical action</b>. When the threat is chronic and psychological, the hormones just circulate with nowhere to go."}, {"t": "fig", "gen": "genFishbone", "cap": "One trigger, one hormone, six simultaneous harms.", "args": ["Chronic disease", [{"name": "Blood sugar", "causes": ["insulin resistance", "Type 2 diabetes"]}, {"name": "Vessels", "causes": ["high blood pressure", "artery damage"]}, {"name": "Muscle", "causes": ["breakdown", "testosterone drops"]}, {"name": "Fat", "causes": ["visceral fat", "inflammation"]}, {"name": "Immune", "causes": ["suppressed", "frequent illness"]}, {"name": "Sleep", "causes": ["disrupted", "self-perpetuating"]}], {"w": 840, "h": 460}]}, {"t": "p", "x": "Sustained cortisol elevates blood sugar (→ insulin resistance), constricts vessels and retains sodium (→ high blood pressure), breaks down muscle (→ lower testosterone and metabolic rate), stores visceral fat (→ inflammation, worse cholesterol), suppresses immunity, and disrupts sleep — which loops back and worsens everything."}, {"t": "call", "x": "This is why exercise is the most effective stress relief — not as motivation, but as mechanism. Physical activity <b>completes the fight-or-flight cycle</b>: it burns off the adrenaline and cortisol-driven glucose, releases endorphins, and raises testosterone to directly counter cortisol."}]}]}, {"id": "terms", "name": "Medical Terms", "icon": "🩺", "intro": "Common conditions decoded — what they are, why they happen, and the nutrient links.", "topics": [{"id": "how", "name": "How to think about them", "blurb": "Categories that reveal mechanism.", "blocks": [{"t": "p", "x": "Most everyday medical terms fall into a few families. Knowing which family something belongs to immediately tells you how it works and why it happens."}, {"t": "cards", "items": [{"h": "Measurable values", "x": "Cholesterol, blood pressure, thyroid — numbers, usually silent until damage is done."}, {"h": "Digestive", "x": "Acidity, constipation, diarrhoea, kidney & gall stones."}, {"h": "Inflammatory / respiratory", "x": "Arthritis, asthma, sinusitis, migraine."}, {"h": "Infections", "x": "Cold and other viral illness — mostly your immune response, not the virus itself."}, {"h": "Neurological / vestibular", "x": "Migraine, vertigo — and nausea, which is a symptom, not a disease."}]}, {"t": "table", "head": ["Condition", "Category", "Root cause", "Key symptom"], "rows": [["Cholesterol", "Blood lipid", "Excess LDL, trans fats, sugar", "Silent"], ["Blood pressure", "Circulatory", "Arterial resistance, sodium, stress", "Silent"], ["Thyroid", "Hormonal", "Iodine/selenium deficiency, autoimmune", "Fatigue, weight change"], ["Cold", "Viral", "Rhinovirus", "Runny nose, sore throat"], ["Sinusitis", "Inflammatory", "Blocked sinus drainage", "Facial pressure, thick mucus"], ["Migraine", "Neurological", "Cortical spreading depression", "Severe one-sided headache"], ["Acidity", "Digestive", "LES valve failure", "Burning in chest"], ["Constipation", "Digestive", "Low fibre/water/magnesium", "Hard stools, straining"], ["Diarrhoea", "Digestive", "Infection, intolerance", "Loose watery stools"], ["Asthma", "Respiratory", "Airway hypersensitivity", "Wheezing, breathlessness"], ["Arthritis", "Inflammatory", "Wear & tear or autoimmune", "Joint pain, stiffness"], ["Kidney stone", "Mineral deposit", "Concentrated urine", "Severe flank pain"], ["Gallstone", "Mineral deposit", "Excess cholesterol in bile", "Upper-right abdominal pain"]]}]}, {"id": "measurable", "name": "Measurable Values", "blurb": "Cholesterol, blood pressure, thyroid.", "blocks": [{"t": "term", "items": [{"n": "Blood Pressure", "what": "The force of blood against artery walls — systolic (heart contracts) over diastolic (heart relaxes). Normal ~120/80; hypertension is consistently above 130/80.", "why": ["Arteries narrow (plaque) or stiffen (age, trans fats, K2 deficiency)", "Excess sodium retains water → more blood volume", "Stress and stimulants make the heart pump harder", "Kidneys are the master regulator via fluid balance"], "sym": ["Usually none — the 'silent killer'", "Severe: headache, vision changes, nosebleeds"], "fix": ["Less sodium, more potassium (potato, dal)", "Exercise, stress reduction, magnesium"]}, {"n": "Thyroid", "what": "The thyroid sets whole-body metabolic speed via hormones T4 and T3. Low output (hypothyroidism) slows every cell.", "why": ["Iodine or selenium deficiency", "Autoimmun
